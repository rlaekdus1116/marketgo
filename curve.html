<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>곡선 탐정 🕵️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 「떡볶이 시장」과 같은 디자인 */
:root{
  --bg:#FFF9F4; --ink:#5B4B57; --sub:#A3919C; --line:#F2E6EC; --card:#FFFFFF;
  --pink:#FFE3EA; --pinkD:#F4A9BD; --mint:#DDF5EA; --mintD:#8FD5B5;
  --lemon:#FFF5CC; --lemonD:#F2D477; --lav:#ECE5FF; --lavD:#B8A7EE;
  --sky:#E0F0FF; --skyD:#93C4EE; --peach:#FFE9DA; --peachD:#F5B48C; --red:#FFD9D9; --redD:#EE9A9A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua',sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#F6E3EA 1.4px,transparent 1.4px);background-size:22px 22px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.s-wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.muted{color:var(--sub)} .center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
h3{margin:0 0 12px;font-size:22px;font-weight:normal}
.btn{background:var(--pink);border-radius:20px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 var(--pinkD);transition:transform .08s;margin:4px 4px 4px 0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}
.btn.lemon{background:var(--lemon);box-shadow:0 5px 0 var(--lemonD)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lavD)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.peach{background:var(--peach);box-shadow:0 5px 0 var(--peachD)}
.btn.big{font-size:28px;padding:18px 36px}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)}
.title{font-size:44px;margin:6px 0;letter-spacing:1px} .title span{color:var(--peachD)}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topbar .logo{font-size:26px;margin-right:auto}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lemon);border-radius:999px;padding:7px 14px;font-size:18px}
.chip.soft{background:var(--sky)}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;margin:0}
.lobby{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:72px;letter-spacing:8px;color:var(--peachD);line-height:1}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:14px}
.stage{min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.bigEmoji{font-size:110px;line-height:1}
.rule{font-size:26px;line-height:1.5}
.roundBadge{display:inline-block;background:var(--lemon);border-radius:999px;padding:8px 22px;font-size:24px;box-shadow:0 4px 0 var(--lemonD)}
.timer{font-size:110px;line-height:1;color:var(--peachD)}
.timer.s{font-size:56px}
.timer.hurry{color:var(--redD);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.bar{height:22px;background:var(--line);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mintD),var(--skyD));border-radius:999px;transition:width .3s linear}
.bar.hurry>i{background:linear-gradient(90deg,var(--peachD),var(--pinkD))}
.dur{display:inline-flex;align-items:center;gap:8px;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 6px}
.dur b{color:var(--peachD);font-weight:normal;font-size:24px}
.dur .btn{margin:0}
.hl{background:var(--lemon);border-radius:20px;padding:14px 18px;font-size:22px;line-height:1.5;margin-top:10px}
.hl.mint{background:var(--mint)} .hl.peach{background:var(--peach)} .hl.lav{background:var(--lav)} .hl.sky{background:var(--sky)} .hl.red{background:var(--red)}
/* 결과표 */
table{border-collapse:separate;border-spacing:4px;width:100%;font-size:20px}
th,td{border-radius:12px;padding:8px 6px;text-align:center;font-weight:normal}
thead th{background:var(--lemon)}
tbody th{background:var(--peach)}
td{background:#fff;border:2px solid var(--line);color:var(--line)}
td.on{background:var(--mint);border-color:var(--mintD);color:var(--ink);font-size:28px}
td.sum{background:var(--lav);border-color:var(--lav);color:var(--ink)}
.q{border-top:2px dashed var(--line);padding:14px 0}
.q p{font-size:24px;margin:0 0 8px;line-height:1.45}
.q b{color:var(--peachD);font-weight:normal}
/* 학생 카드 (교과서 카드 모양) */
.tcard{border-radius:28px;padding:22px;text-align:center;border:4px solid;position:relative}
.tcard.buyer{background:var(--sky);border-color:var(--skyD);box-shadow:0 8px 0 var(--skyD)}
.tcard.seller{background:var(--peach);border-color:var(--peachD);box-shadow:0 8px 0 var(--peachD)}
.tcard .role{font-size:34px}
.tcard .amt{display:inline-block;font-size:64px;background:#fff;border-radius:22px;padding:4px 26px;margin:8px 0}
.tcard .desc{font-size:20px;line-height:1.5}
.tcard .rn{position:absolute;top:12px;left:16px;font-size:15px;color:var(--sub)}
.s-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.s-top .me{margin-right:auto;font-size:22px}
.field{width:100%;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:#fff;outline:none;font-family:inherit;color:var(--ink);margin:6px 0}
.field:focus{border-color:var(--peachD)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 6px;font-size:22px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.sel{background:var(--lemon);border-color:var(--lemonD);box-shadow:0 4px 0 var(--lemonD)}
.lab{font-size:20px;margin-top:6px}
.doneBox{background:var(--mint);border-radius:24px;padding:22px;font-size:28px;text-align:center}
.doneBox.wait{background:var(--lemon)} .doneBox.bad{background:var(--red)} .doneBox.none{background:var(--lav)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;border:3px solid var(--peachD);border-radius:20px;padding:14px 22px;font-size:22px;z-index:99;box-shadow:0 6px 0 var(--peachD);max-width:92vw;text-align:center}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ===== 🌈 안내문: 일부러 촌스럽고 눈에 확 띄게 ===== */
.ann{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;cursor:pointer;animation:annIn .45s cubic-bezier(.2,1.7,.4,1)}
.ann::before{content:'';position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;
  background:repeating-conic-gradient(#FF9EBB 0 10deg,#FFC48A 10deg 20deg,#FFF08A 20deg 30deg,#A8F0C0 30deg 40deg,#9ED8FF 40deg 50deg,#C9B3FF 50deg 60deg);
  animation:spinbg 14s linear infinite}
.ann::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.95) 0 22%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%)}
.ann > *{position:relative;z-index:1}
.ann .rb{display:block;font-size:min(15vw,150px);line-height:1.08;text-align:center;padding:0 3vw;
  background:linear-gradient(90deg,#FF4F8B,#FF8A3D,#FFC81E,#3DD68C,#3DA9FF,#9B5CFF,#FF4F8B);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:4px #fff;
  filter:drop-shadow(0 7px 0 #5B4B57) drop-shadow(0 0 18px #fff);
  animation:rainbow 2s linear infinite,wobble .55s ease-in-out infinite alternate}
.ann .sub{font-size:min(6.5vw,46px);background:#fff;border:5px solid #5B4B57;border-radius:999px;padding:10px 34px;box-shadow:0 8px 0 #5B4B57;transform:rotate(-3deg);text-align:center;max-width:92vw}
.ann .emo{font-size:min(20vw,150px);line-height:1;animation:hop .5s ease-in-out infinite alternate}
.ann .fl{position:absolute;z-index:1;font-size:56px;animation:floaty 3s ease-in-out infinite alternate;pointer-events:none}
.ann .tap{position:absolute;bottom:18px;z-index:1;font-size:18px;color:#5B4B57;opacity:.7}
@keyframes spinbg{to{transform:rotate(360deg)}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes wobble{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.07)}}
@keyframes hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(8deg)}}
@keyframes floaty{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-40px) rotate(15deg)}}
@keyframes annIn{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.ann,.ann *,.ann::before{animation:none!important}}

/* ===== 경매소 전용 ===== */
.item-hero{display:flex;flex-direction:column;align-items:center;gap:6px}
.item-hero .ie{font-size:120px;line-height:1;animation:hop .7s ease-in-out infinite alternate}
.item-hero .in{font-size:40px}
.item-hero .ip{font-size:22px;background:var(--lemon);border-radius:999px;padding:6px 20px}
.price-big{font-size:96px;color:var(--peachD);line-height:1}
.price-big.s{font-size:64px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper .btn{font-size:34px;padding:10px 26px;margin:0}
input[type=range]{width:100%;accent-color:#F5B48C;height:36px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick .btn{margin:0}
.lock{background:var(--lav);border-radius:24px;padding:18px;font-size:26px;text-align:center}
.cv-wrap{background:#fff;border:3px solid var(--line);border-radius:22px;padding:6px;touch-action:none}
canvas{display:block;width:100%;touch-action:none;border-radius:16px}
.speech{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:12px 26px;font-size:34px;box-shadow:0 6px 0 var(--ink);max-width:92%}
.speech::after{display:none}
.hammer{font-size:80px;line-height:1;display:inline-block;transform-origin:80% 80%}
.hammer.bang{animation:bang .35s ease-in}
@keyframes bang{0%{transform:rotate(-40deg)}60%{transform:rotate(18deg)}100%{transform:rotate(0)}}
.acc{font-size:110px;line-height:1;color:var(--peachD)}
.acc small{font-size:50px}
.stand{background:var(--mint);border-radius:28px;padding:26px;font-size:40px;text-align:center;box-shadow:0 8px 0 var(--mintD)}
.sit{background:var(--line);border-radius:28px;padding:26px;font-size:32px;text-align:center}
.svgbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:middle;margin-right:4px}
.edit-row{display:grid;grid-template-columns:64px 1fr auto 44px;gap:6px;align-items:center;margin-bottom:6px}
.edit-row.one{grid-template-columns:1fr}
.edit-row label{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--sub)}
.edit-row .sup{flex-direction:row;align-items:center;gap:6px;white-space:nowrap}
.edit-row .sup input{width:70px}
.iedit{border-bottom:2px dashed var(--line);padding:8px 0}
.edit-row input,.edit-row select{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);color:var(--ink);width:100%}
@media (max-width:700px){.edit-row{grid-template-columns:52px 1fr auto 40px}}
.stat-big{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ===== v3: 준비 화면·카운트다운 ===== */
.edit-row{grid-template-columns:30px 64px 1fr auto!important}
.edit-row.one{grid-template-columns:1fr!important}
.iedit{border-bottom:2px dashed var(--line);padding:10px 0}
.cd{font-size:150px;line-height:1;color:var(--peachD);background:#fff;border:8px solid var(--peachD);border-radius:50%;width:230px;height:230px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 var(--peachD)}
.cd.hurry{color:var(--redD);border-color:var(--redD);box-shadow:0 10px 0 var(--redD);animation:beat .5s infinite}
.cdS{color:var(--peachD);font-weight:normal}
/* ===== 🌈 병맛 안내 화면: 무지개가 화면 가득 빙글빙글 ===== */
.ann{animation:annIn .45s cubic-bezier(.2,1.7,.4,1),hueSpin 2.4s linear infinite!important}
.ann::before{animation:spinbg 2.6s linear infinite!important}
.ann::after{background:radial-gradient(circle,rgba(255,255,255,.6) 0 16%,rgba(255,255,255,0) 42%)!important}
.ann .emo{animation:spinEmo 1.1s linear infinite!important}
.ann .rb{animation:rainbow .9s linear infinite,wobble .28s ease-in-out infinite alternate!important}
.ann .sub{animation:wobble .4s ease-in-out infinite alternate}
.ann .fl{animation:floaty 1.4s ease-in-out infinite alternate,spinEmo 2s linear infinite!important}
@keyframes hueSpin{to{filter:hue-rotate(360deg)}}
@keyframes spinEmo{to{transform:rotate(360deg)}}

/* ===== 곡선 탐정 전용 ===== */
.toast{pointer-events:none}
.case{background:#fff;border:4px solid var(--ink);border-radius:30px;padding:22px 26px;box-shadow:0 8px 0 var(--ink);text-align:center;max-width:820px;width:100%}
.case .ce{font-size:84px;line-height:1}
.case .cm{display:inline-block;background:var(--lemon);border-radius:999px;padding:4px 18px;font-size:22px;margin:6px 0}
.case .cp{font-size:24px;margin:4px 0 8px;color:var(--peachD)}
.case .ct{font-size:32px;line-height:1.45}
.case.s .ct{font-size:24px} .case.s .ce{font-size:56px}
.stepbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.stepbar span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;color:var(--sub)}
.stepbar span.on{background:var(--lemon);border-color:var(--lemonD);color:var(--ink)}
.stepbar span.ok{background:var(--mint);border-color:var(--mintD);color:var(--ink)}
.q{font-size:30px;line-height:1.4;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:760px}
.choice{background:#fff;border:4px solid var(--line);border-radius:24px;padding:22px 12px;font-size:26px;box-shadow:0 6px 0 var(--line);line-height:1.35}
.choice:active{transform:translateY(4px);box-shadow:none}
.choice.right{background:var(--mint);border-color:var(--mintD);box-shadow:0 6px 0 var(--mintD)}
.choice.wrong{background:var(--red);border-color:var(--redD);box-shadow:0 6px 0 var(--redD);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{background:var(--lemon);border:3px dashed var(--lemonD);border-radius:20px;padding:14px 18px;font-size:22px;line-height:1.5;max-width:760px}
.good{background:var(--mint);border-radius:20px;padding:14px 18px;font-size:24px;line-height:1.5;max-width:760px;text-align:center}
.graph{background:#fff;border:3px solid var(--line);border-radius:22px;padding:6px;width:100%;max-width:640px;touch-action:none}
.graph svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.dist{width:100%;max-width:820px}
.drow{display:grid;grid-template-columns:minmax(180px,38%) 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:22px}
.dbar{height:34px;background:var(--line);border-radius:999px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--skyD);border-radius:999px;transition:width .4s}
.drow.right .dbar i{background:var(--mintD)} .drow.right{color:#2a8a5f}
.chain{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:21px}
.chain b{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:normal}
.heat{border-collapse:separate;border-spacing:4px;width:100%;font-size:17px}
.heat th{background:var(--lemon);border-radius:10px;padding:6px;font-weight:normal}
.heat td{border-radius:10px;padding:6px;text-align:center;background:#fff;border:2px solid var(--line);color:var(--ink)}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.prog .pp{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;font-size:18px}
.prog .pp .bar{height:10px;margin-top:6px}
.edit-case{display:grid;grid-template-columns:30px 56px 110px 120px 1fr;gap:6px;align-items:center;margin-bottom:4px}
.edit-case input,.edit-case select,.edit-sel select{font-family:inherit;font-size:17px;padding:7px 9px;border-radius:12px;border:2px solid var(--line);color:var(--ink);width:100%;background:#fff}
.edit-sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 4px 36px;font-size:16px;color:var(--sub)}
.edit-sel select{width:auto}
.cbox{border-bottom:2px dashed var(--line);padding:8px 0}
.modeTg .btn.on{outline:3px solid var(--mintD)}
@media (max-width:700px){.choices{grid-template-columns:1fr}.edit-case{grid-template-columns:26px 46px 1fr 1fr}.edit-case input[data-f=text]{grid-column:1/-1}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 「시장에 가면」·「떡볶이 시장」·「경매소」와 같은 Firebase 프로젝트 (데이터는 rooms/curve_코드 에 저장) */
const firebaseConfig = {
  apiKey: "AIzaSyDiehLZ1aKv8E3N_pD4bNmw0zgMexau99U",
  authDomain: "marketgo-80ab5.firebaseapp.com",
  databaseURL: "https://marketgo-80ab5-default-rtdb.firebaseio.com",
  projectId: "marketgo-80ab5",
  storageBucket: "marketgo-80ab5.firebasestorage.app",
  messagingSenderId: "666715038541",
  appId: "1:666715038541:web:b0f84a9703aa70aeca4d04"
};
const db = getDatabase(initializeApp(firebaseConfig));
let offset = 0;
onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });

/* ========== 기본 사례 (준비 화면에서 바꿀 수 있어요) ==========
   type: shift(곡선 자체의 이동) / along(곡선 위의 이동)
   curve: D(수요) / S(공급)
   dir: shift면 +증가(오른쪽) -감소(왼쪽) / along이면 +가격 오름 -가격 내림 */
const DEFAULT_CASES = [

/* ========== 그래프 (SVG 400×320, 데이터 0~100) ========== */
const GW = 400, GH = 320, GL = 46, GR = 16, GT = 16, GB = 40, pw = GW - GL - GR, ph = GH - GT - GB;
const X = q => GL + q / 100 * pw, Y = p => GT + (1 - p / 100) * ph;
const dLine = s => `M${X(15)},${Y(85 + s)} L${X(85)},${Y(15 + s)}`;     // 수요: P = 100 - Q + s
const sLine = s => `M${X(15)},${Y(15 - s)} L${X(85)},${Y(85 - s)}`;     // 공급: P = Q - s
const eqOf = (sD, sS) => { const q = (100 + sD + sS) / 2; return [q, 100 - q + sD]; };
// opt: { c, mode:'base'|'shift'|'along', off, pt, hit, done }
function graphSVG(o) {
  const c = o.c, off = o.off || 0;
  let g = `<defs><clipPath id="cl"><rect x="${GL}" y="${GT}" width="${pw}" height="${ph}"/></clipPath><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#E8803E"/></marker></defs>
    <rect x="${GL}" y="${GT}" width="${pw}" height="${ph}" fill="#FFFDF9" stroke="#F2E6EC" stroke-width="2" rx="6"/>
    <line x1="${GL}" y1="${GT + ph}" x2="${GL + pw}" y2="${GT + ph}" stroke="#A3919C" stroke-width="2"/><line x1="${GL}" y1="${GT}" x2="${GL}" y2="${GT + ph}" stroke="#A3919C" stroke-width="2"/>
    <text x="${GL - 8}" y="${GT + 12}" text-anchor="end" font-size="14" fill="#A3919C">가격</text><text x="${GL + pw}" y="${GH - 8}" text-anchor="end" font-size="14" fill="#A3919C">수량</text>`;
  const moveD = o.mode === 'shift' && c.curve === 'D', moveS = o.mode === 'shift' && c.curve === 'S';
  const sD = moveD ? off : 0, sS = moveS ? off : 0;
  const showBoth = o.mode !== 'along';
  // 원래 곡선 (움직이는 곡선은 흐리게 남겨 둠)
  if (moveD) g += `<path d="${dLine(0)}" stroke="#93C4EE" stroke-width="3" stroke-dasharray="7 6" fill="none" clip-path="url(#cl)"/>`;
  if (moveS) g += `<path d="${sLine(0)}" stroke="#F5B48C" stroke-width="3" stroke-dasharray="7 6" fill="none" clip-path="url(#cl)"/>`;
  if (showBoth || c.curve === 'D') g += `<path id="dPath" d="${dLine(sD)}" stroke="#3B8FD9" stroke-width="5" fill="none" clip-path="url(#cl)"/><text x="${Math.min(GW - 52, X(87) + (moveD ? off / 100 * pw : 0))}" y="${Y(15 + sD) + 4}" font-size="18" fill="#3B8FD9">수요${moveD && off ? "'" : ''}</text>`;
  if (showBoth || c.curve === 'S') g += `<path id="sPath" d="${sLine(sS)}" stroke="#E8803E" stroke-width="5" fill="none" clip-path="url(#cl)"/><text x="${Math.min(GW - 52, X(87) + (moveS ? off / 100 * pw : 0))}" y="${Y(85 - sS) + 4}" font-size="18" fill="#E8803E">공급${moveS && off ? "'" : ''}</text>`;
  if (o.mode === 'shift') {
    const [q0, p0] = eqOf(0, 0);
    g += `<circle cx="${X(q0)}" cy="${Y(p0)}" r="7" fill="#fff" stroke="#A3919C" stroke-width="3"/>`;
    if (o.done && off) {
      const [q1, p1] = eqOf(sD, sS);
      g += `<line x1="${GL}" x2="${X(q1)}" y1="${Y(p1)}" y2="${Y(p1)}" stroke="#2FA67A" stroke-width="2" stroke-dasharray="5 5"/><line x1="${GL}" x2="${X(q0)}" y1="${Y(p0)}" y2="${Y(p0)}" stroke="#A3919C" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="${X(q1)}" y="${Y(p1)}" font-size="30" text-anchor="middle" dominant-baseline="central">⭐</text>
        <text x="${GL + 5}" y="${Y(p1) + (p1 > p0 ? -6 : 16)}" font-size="14" fill="#2FA67A">새 가격</text><text x="${GL + 5}" y="${Y(p0) + (p1 > p0 ? 16 : -6)}" font-size="14" fill="#A3919C">원래 가격</text>`;
      if (o.showPrice) g += `<line x1="${GL - 22}" x2="${GL - 22}" y1="${Y(p0)}" y2="${Y(p1) + (p1 > p0 ? 8 : -8)}" stroke="#E8803E" stroke-width="5" marker-end="url(#ar)"/>`;
    }
    if (o.hit) g += `<path id="hit" d="${c.curve === 'D' ? dLine(sD) : sLine(sS)}" stroke="transparent" stroke-width="44" fill="none" style="cursor:grab"/>`;
    if (o.hit && !off) g += `<text x="${GL + pw / 2}" y="${GT + 24}" text-anchor="middle" font-size="17" fill="#B8A7EE">👆 ${curveName(c.curve)} 곡선을 잡고 옆으로 끌어요</text>`;
  }
  if (o.mode === 'along') {
    const q0 = 50, pt = o.pt ?? 50;
    const q = c.curve === 'D' ? 100 - pt : pt;
    g += `<circle cx="${X(q0)}" cy="${Y(50)}" r="7" fill="#fff" stroke="#A3919C" stroke-width="3"/>`;
    if (pt !== 50) g += `<line x1="${X(q0)}" y1="${Y(50)}" x2="${X(q)}" y2="${Y(pt)}" stroke="#2FA67A" stroke-width="3" stroke-dasharray="5 5"/>`;
    if (o.done && pt !== 50) g += `<line x1="${X(q)}" x2="${X(q)}" y1="${Y(pt)}" y2="${GT + ph}" stroke="#2FA67A" stroke-width="2" stroke-dasharray="5 5"/><line x1="${X(q0)}" x2="${X(q0)}" y1="${Y(50)}" y2="${GT + ph}" stroke="#A3919C" stroke-width="2" stroke-dasharray="5 5"/>${o.showPrice ? `<line x1="${X(q0)}" x2="${X(q) + (q > q0 ? -8 : 8)}" y1="${GT + ph + 14}" y2="${GT + ph + 14}" stroke="#E8803E" stroke-width="5" marker-end="url(#ar)"/>` : ''}`;
    g += `<circle id="pt" cx="${X(q)}" cy="${Y(pt)}" r="${o.hit ? 16 : 10}" fill="#2FA67A" stroke="#fff" stroke-width="4" style="cursor:grab"/>`;
    if (o.hit && pt === 50) g += `<text x="${GL + pw / 2}" y="${GT + 24}" text-anchor="middle" font-size="17" fill="#B8A7EE">👆 초록 점을 잡고 곡선을 따라 끌어요</text>`;
  }
  return `<svg viewBox="0 0 ${GW} ${GH}" font-family="Jua">${g}</svg>`;
}

function solvedGraph(c, showPrice) {
  return c.type === 'shift' ? graphSVG({ c, mode: 'shift', off: c.dir === '+' ? 20 : -20, done: true, showPrice })
    : graphSVG({ c, mode: 'along', pt: c.dir === '+' ? 70 : 30, done: true, showPrice });
}

async function join(c, name) {

  if (!name) return toast('이름을 써 주세요');

  try { snap = await get(A(c)); } catch (e) { return toast('접속을 못 했어요 😢 인터넷을 확인해 주세요'); }
  if (!snap.exists()) return toast('그런 방이 없어요 😢 코드를 확인해 주세요');
  let id = localStorage.getItem('curve_pid_' + c);
  if (!id) {
    const ps = snap.val().players || {};
    const hit = Object.entries(ps).find(([, p]) => p.name === name && p.online !== true);   // 다른 기기로 다시 들어와도 이어서
    id = hit ? hit[0] : Math.random().toString(36).slice(2, 10);
    localStorage.setItem('curve_pid_' + c, id);
  }
  await update(ref(db, `rooms/curve_${c}/players/${id}`), { name, joinedAt: Date.now() });
  localStorage.setItem('curve_name', name); localStorage.setItem('curve_last_room', c);
  location.href = `?room=${c}`;
}

/* ========== 기록 ========== */
// ans[학생][사례][단계] = { first: 처음 고른 답, ok: 처음에 맞혔나, done: 결국 맞혔나 }
const ansOf = id => ((room.ans || {})[id]) || {};
const stepRec = (id, ci, st) => ((ansOf(id)[ci] || {})[st]) || null;
const caseDone = (id, ci, c) => stepsOf(c).every(st => (stepRec(id, ci, st) || {}).done);
function scoreOf(id) {
  const cs = casesOf(); let ok = 0, tot = 0;
  cs.forEach((c, ci) => stepsOf(c).forEach(st => { const r = stepRec(id, ci, st); if (r) { tot++; if (r.ok) ok++; } }));
  return { ok, tot };
}

// 사례 × 단계별 "처음에 맞힌 비율" — 어디서 많이 헷갈렸는지 한눈에
function heatTable(cs, from) {
  const ids = playerIds(), all = ['price', 'move', 'who', 'drag', 'final'];
  const cell = (ci, s, c) => {
    if (!stepsOf(c).includes(s)) return '<td style="background:var(--line);border-color:var(--line)">-</td>';
    const rs = ids.map(id => stepRec(id, ci, s)).filter(Boolean);
    if (!rs.length) return '<td class="muted">·</td>';
    const r = rs.filter(x => x.ok).length / rs.length, bg = r >= .8 ? 'var(--mint)' : r >= .5 ? 'var(--lemon)' : 'var(--red)';
    return `<td style="background:${bg}">${Math.round(r * 100)}%</td>`;
  };
  return `<div class="card"><h3>📊 처음에 맞힌 비율 <span class="muted" style="font-size:16px">빨간 칸 = 많이 헷갈린 곳</span></h3>
    <table class="heat"><tr><th>사건</th>${all.map(s => `<th>${STEP_NAME[s]}</th>`).join('')}</tr>
    ${cs.map((c, ci) => ci < from ? '' : `<tr><th style="text-align:left">${ci + 1}. ${esc(c.emoji)} ${esc(c.text.slice(0, 18))}${c.text.length > 18 ? '…' : ''}</th>${all.map(s => cell(ci, s, c)).join('')}</tr>`).join('')}</table></div>`;
}

  const prevKey = sKey; sKey = key;
  const caseCard = `<div class="case s"><div class="ce">${esc(c.emoji)}</div><div class="cm">${esc(c.market)} 시장 · 사건 ${ci + 1}</div>${c.price ? `<div class="cp">💰 지금 가격: <b>${esc(c.price)}</b></div>` : ''}<div class="ct">${esc(c.text)}</div></div>`;
  const bar = stepBar(c, k, s => (stepRec(pid, ci, s) || {}).done);
  if (k === 0) {
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="gap:14px"><span class="roundBadge">🚨 사건 ${ci + 1} 발생!</span>${caseCard.replace('case s', 'case')}${bar}
      ${st.mode === 'solo' ? '<button class="btn big mint" id="startCase">🔍 수사 시작!</button>' : '<div class="rule muted">사례를 잘 읽어요 📖 곧 수사가 시작돼요</div>'}</div></div>`;
    if (el('startCase')) el('startCase').onclick = () => { readSeen[ci] = true; sKey = ''; renderStudent(); };
    return;
  }
  const justWrong = rec && !rec.done && prevKey.startsWith([st.mode, ci, k].join('|'));
  const head = `<div class="s-wrap">${top}<div class="stage" style="gap:12px;min-height:auto">${caseCard}${bar}<div class="q">${k}. ${questionOf(c, stp)}</div>`;
  const doneBox = rec && rec.done ? `<div class="good">${rec.ok ? '🎯 한 번에 맞혔어요! +1점' : '✅ 맞았어요!'}${k === steps.length ? `<div class="chain" style="margin-top:8px">${chainOf(c).map(x => `<b>${x}</b>`).join(' → ')}</div>` : ''}</div>
      ${st.mode === 'together' ? '<div class="rule muted">칠판을 보며 기다려요 👀</div>' : `<button class="btn big mint" id="goOn">${k === steps.length ? (cs.findIndex((x, j) => j > ci && !caseDone(pid, j, x)) >= 0 ? '🚨 다음 사건 ▶' : '🎉 끝!') : '▶ 다음 단계'}</button>`}` : '';
  const hintBox = rec && !rec.done ? `<div class="hint">${hintOf(c, stp)}<br><b>다시 골라 봐요!</b></div>` : '';
  if (stp === 'drag') {
    const solved = rec && rec.done;
    app.innerHTML = `${head}<div class="graph" id="gwrap">${solved ? solvedGraph(c, false) : graphSVG({ c, mode: c.type, off: 0, pt: 50, hit: true })}</div>${hintBox}${doneBox}</div></div>`;
    if (!solved) setupDrag(c, ci);
  } else {
    const opts = optionsOf(c, stp), right = answerOf(c, stp);
    const showGraph = stp === 'final';
    app.innerHTML = `${head}${showGraph ? `<div class="graph">${solvedGraph(c, rec && rec.done)}</div>` : ''}
      <div class="choices">${opts.map(([v, lab]) => `<button class="choice ${rec && rec.done && v === right ? 'right' : ''}" data-v="${v}" ${rec && rec.done ? 'disabled' : ''}>${lab}</button>`).join('')}</div>${hintBox}${doneBox}</div></div>`;
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const v = b.dataset.v, ok = v === right;
      if (!ok) { b.classList.add('wrong'); }
      record(ci, stp, v, ok);
    });
    if (justWrong) { const w = document.querySelector(`.choice[data-v="${rec.first}"]`); if (w && !rec.done) w.classList.add('wrong'); }
  }
  if (el('goOn')) el('goOn').onclick = () => { hold = null; sKey = ''; renderStudent(); };
}

/* 👆 그래프 끌기: 곡선 통째로(좌우) 또는 곡선 위의 점(위아래) */
function setupDrag(c, ci) {
  const wrap = el('gwrap'), svg = () => wrap.querySelector('svg');
  const toSvg = e => { const r = svg().getBoundingClientRect(); return [(e.clientX - r.left) * GW / r.width, (e.clientY - r.top) * GH / r.height]; };
  const redraw = v => { wrap.innerHTML = c.type === 'shift' ? graphSVG({ c, mode: 'shift', off: v, hit: true }) : graphSVG({ c, mode: 'along', pt: v, hit: true }); bind(); };
  const finish = v => {
    dragState = null;
    const moved = c.type === 'shift' ? v : v - 50;
    if (Math.abs(moved) < 6) { toast('조금 더 확실하게 끌어 봐요 👆'); redraw(c.type === 'shift' ? 0 : 50); return; }
    const val = moved > 0 ? '+' : '-', ok = val === c.dir;
    if (ok) { wrap.innerHTML = solvedGraph(c, false); }
    else { toast(c.type === 'shift' ? '앗, 반대쪽이에요! 💡 힌트를 봐요' : '앗, 반대 방향이에요! 💡 힌트를 봐요'); redraw(c.type === 'shift' ? 0 : 50); }
    record(ci, 'drag', val, ok);
    sKey = ''; setTimeout(renderStudent, ok ? 600 : 50);
  };
  function bind() {
    const h = svg().querySelector(c.type === 'shift' ? '#hit' : '#pt'); if (!h) return;
    h.onpointerdown = e => {
      e.preventDefault(); const [sx, sy] = toSvg(e); dragState = { sx, sy, v: c.type === 'shift' ? 0 : 50 };
      const move = ev => {
        if (!dragState) return; ev.preventDefault();
        const [x, y] = toSvg(ev);
        if (c.type === 'shift') dragState.v = Math.max(-25, Math.min(25, (x - dragState.sx) / pw * 100));
        else dragState.v = Math.max(22, Math.min(78, (1 - (y - GT) / ph) * 100));
        const s = svg(); s.outerHTML; wrap.innerHTML = c.type === 'shift' ? graphSVG({ c, mode: 'shift', off: dragState.v, hit: true }) : graphSVG({ c, mode: 'along', pt: dragState.v, hit: true });
      };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); if (dragState) finish(dragState.v); };
      window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    };
  }
  bind();
}

start();
</script>
