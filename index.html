<!doctype html>
<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#FFF9F4; --ink:#5B4B57; --sub:#A3919C; --line:#F2E6EC; --card:#FFFFFF;
  --pink:#FFE3EA; --pinkD:#F4A9BD; --mint:#DDF5EA; --mintD:#8FD5B5;
  --lemon:#FFF5CC; --lemonD:#F2D477; --lav:#ECE5FF; --lavD:#B8A7EE;
  --sky:#E0F0FF; --skyD:#93C4EE; --peach:#FFE9DA; --peachD:#F5B48C;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Jua',sans-serif;color:var(--ink);
  background:var(--bg);
  background-image:radial-gradient(#F6E3EA 1.4px,transparent 1.4px);
  background-size:22px 22px;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
input{font-family:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.muted{color:var(--sub)}
.center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 var(--line)}
.btn{background:var(--pink);border-radius:20px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 var(--pinkD);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}
.btn.lemon{background:var(--lemon);box-shadow:0 5px 0 var(--lemonD)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lavD)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.big{font-size:28px;padding:18px 36px}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lav{box-shadow:0 3px 0 var(--lavD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)}
.title{font-size:44px;margin:6px 0;letter-spacing:1px}
.title span{color:var(--pinkD)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topbar .logo{font-size:26px;margin-right:auto}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lemon);border-radius:999px;padding:7px 8px 7px 14px;font-size:18px}
.chip small{color:var(--sub);font-size:13px}
.chip.soft{background:var(--sky);padding:6px 14px}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:15px;line-height:24px;padding:0}
.lobby{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:72px;letter-spacing:8px;color:var(--pinkD);line-height:1}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:14px}
h3{margin:0 0 12px;font-size:22px;font-weight:normal}
.stage{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.chant{font-size:52px;color:var(--sub)}
.itemCard{background:#fff;border:4px solid var(--pink);border-radius:40px;padding:30px 60px;font-size:96px;box-shadow:0 10px 0 var(--pinkD);min-width:50%}
.itemCard .tail{display:block;font-size:40px;color:var(--sub);margin-top:4px}
.author{font-size:30px;background:var(--lav);border-radius:999px;padding:6px 20px}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.beatRow{display:flex;gap:14px;justify-content:center}
.beatDot{width:34px;height:34px;border-radius:50%;background:var(--line);transition:transform .08s,background .08s}
.beatDot.on{transform:scale(1.35);background:var(--pinkD)}
.beatDot.on.c{background:var(--mintD)}
.prog{font-size:24px;color:var(--sub)}
.roundBadge{display:inline-block;background:var(--lemon);border-radius:999px;padding:8px 22px;font-size:24px;box-shadow:0 4px 0 var(--lemonD)}
.bigEmoji{font-size:110px;line-height:1}
.rule{font-size:28px;line-height:1.5}
.timer{font-size:120px;line-height:1;color:var(--pinkD)}
.bar{height:22px;background:var(--line);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mintD),var(--skyD));border-radius:999px;transition:width .2s linear}
.bar.hurry>i{background:linear-gradient(90deg,var(--peachD),var(--pinkD))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

.ans{background:var(--sky);border-radius:18px;padding:10px 14px;font-size:22px}
.ans small{display:block;font-size:14px;color:var(--sub)}
.ans .n{display:inline-block;background:#fff;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px;font-size:15px;margin-right:6px}
.rank{display:flex;align-items:center;gap:12px;font-size:26px;padding:8px 6px;border-bottom:2px dashed var(--line)}
.rank b{font-weight:normal;margin-left:auto;color:var(--pinkD)}
.medal{font-size:32px;width:42px;text-align:center}
.hl{background:var(--lemon);border-radius:20px;padding:14px 18px;font-size:22px;line-height:1.5;margin-top:12px}
.hl.lav{background:var(--lav)} .hl.mint{background:var(--mint)}

.s-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.s-top .me{margin-right:auto;font-size:20px}
.field{width:100%;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:#fff;outline:none}
.field:focus{border-color:var(--pinkD)}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.slot{min-width:92px;padding:10px 12px;border-radius:16px;background:#fff;border:3px dashed var(--line);font-size:19px;text-align:center}
.slot .k{display:block;font-size:12px;color:var(--sub)}
.slot.f{border-style:solid;border-color:var(--mintD);background:var(--mint)}
.slot.gift{border-style:solid;border-color:var(--lemonD);background:var(--lemon)}
.slot.cur{border-color:var(--pinkD);border-style:solid;animation:blink 1s infinite}
@keyframes blink{50%{background:var(--pink)}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 8px;font-size:22px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.used{opacity:.25;pointer-events:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tin{width:100%;font-size:22px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;outline:none}
.tin:focus{border-color:var(--pinkD)}
.tin[readonly]{background:var(--lemon);border-color:var(--lemonD)}
.tlab{font-size:13px;color:var(--sub);margin:0 0 3px 6px}
.doneBox{background:var(--mint);border-radius:24px;padding:22px;font-size:28px;text-align:center;margin-top:14px}
.luck{perspective:800px;margin:16px auto;width:240px;height:150px}
.luck .in{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d;animation:flip 1s .4s forwards}
@keyframes flip{to{transform:rotateY(180deg)}}
.luck .fa,.luck .ba{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:30px;backface-visibility:hidden}
.luck .fa{background:var(--lav)}
.luck .ba{background:var(--lemon);transform:rotateY(180deg);flex-direction:column}
.brk{display:flex;justify-content:space-between;font-size:22px;padding:6px 4px;border-bottom:2px dashed var(--line)}
.score{font-size:64px;color:var(--pinkD)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;border:3px solid var(--pinkD);border-radius:20px;padding:14px 22px;font-size:22px;z-index:99;box-shadow:0 6px 0 var(--pinkD);max-width:92vw;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.toggle{display:inline-flex;align-items:center;gap:6px}
.setup{max-width:640px;margin:60px auto;line-height:1.7;font-size:19px}
.setup code{background:var(--lemon);padding:2px 6px;border-radius:6px;font-family:monospace;font-size:15px}
</style>
</head>

function norm(s){

  const m = a.length, n = b.length; const d = Array.from({length:m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)

const Beat = {

  ensure(){
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C();

      const i = this.idx, t = this.next, g = this.gen;
      this.play(i, t);
      setTimeout(() => { if (g === this.gen && this.cb) this.cb(i); }, Math.max(0, (t - ctx.currentTime) * 1000));
      this.next += 60 / this.bpm; this.idx++;
    }
  },
  play(i, t){ if (this.muted) return; if (i % 2 === 0) this.kick(t); else this.clap(t); this.shaker(t + 30 / this.bpm); },
  kick(t){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.16);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + 0.3);
  },
  clap(t){
    const c = this.ctx;
    [0, 0.012, 0.024].forEach((d, k) => {
      const s = c.createBufferSource(); s.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8;
      const g = c.createGain(); const tt = t + d;
      g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(k === 2 ? 0.75 : 0.4, tt + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + (k === 2 ? 0.15 : 0.02));
      s.connect(f).connect(g).connect(this.master); s.start(tt); s.stop(tt + 0.2);
    });
  },
  shaker(t){
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + 0.08);
  },
  tone(freq, t, dur = 0.25, vol = 0.35, type = 'triangle'){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  ding(){ if (this.muted || !this.ctx) return; const ns = [523.25, 587.33, 659.25, 783.99, 880]; const t = this.ctx.currentTime; this.tone(ns[Math.floor(Math.random() * ns.length)], t); this.tone(ns[Math.floor(Math.random() * ns.length)] * 2, t + 0.07, 0.2, 0.12); },
  fanfare(){ if (this.muted) return; this.ensure(); const t = this.ctx.currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, t + i * 0.11, 0.35, 0.3)); },
};

      || '<p class="muted">학생들이 물건을 넣으면 여기에 쌓여요!</p>';

    el('startBtn').disabled = items.length < MIN_ITEMS;
    el('startHint').textContent = items.length < MIN_ITEMS ? `물건이 ${MIN_ITEMS}개 이상 있어야 시작할 수 있어요` : '이상한 물건은 × 로 지우고 시작하세요';
  }

function T_tick(){
  if (!room || room.state.phase !== 'answer') return;
  const st = room.state, rem = st.answerEndsAt - now();
  const cfg = ROUNDS[st.round - 1];
  const t = el('tTimer'), bar = el('tBar');
  if (t) t.textContent = Math.max(0, Math.ceil(rem / 1000));
  if (bar) { bar.firstElementChild.style.width = Math.max(0, Math.min(100, rem / (cfg.limit * 1000) * 100)) + '%'; bar.classList.toggle('hurry', rem < 10000); }
  const total = Object.keys(room.players || {}).length;
  const picks = (room.picks && room.picks[st.round]) || {};
  const done = Object.values(picks).filter(p => p.doneAt).length;
  if (rem <= -500 || (total > 0 && done >= total)) T_finalize();
}

function beatVis(i){
  for (let k = 0; k < 4; k++) { const d = el('bd' + k); if (d) d.className = 'beatDot' + (k === i % 4 ? ' on' + (i % 2 ? ' c' : '') : ''); }
}

function makeTraps(seqTexts, usedNorms, k){
  const out = [], used = new Set(usedNorms), cands = [];
  for (const t of shuffle(seqTexts)) { const list = LOOK[norm(t)]; if (list) cands.push(...list); }
  for (const c of shuffle(cands)) { if (out.length >= k) break; const n = norm(c); if (!used.has(n)) { used.add(n); out.push(c); } }
  const pre = ['왕', '미니', '꼬마', '황금', '아기', '쪼꼬미'];
  for (let g = 0; out.length < k && g < 200; g++) {
    const c = pre[Math.floor(Math.random() * pre.length)] + seqTexts[Math.floor(Math.random() * seqTexts.length)];
    const n = norm(c); if (!used.has(n)) { used.add(n); out.push(c); }
  }
  return out;
}

async function T_startRound(r){
  if (roundStarting) return; roundStarting = true;
  try {
    const cfg = ROUNDS[r - 1];
    const items = room.items || {};
    const ids = Object.keys(items);
    const usage = {};
    Object.values(room.rounds || {}).forEach(rd => (rd.seq || []).forEach(id => usage[id] = (usage[id] || 0) + 1));
    const ordered = shuffle(ids).sort((a, b) => (usage[a] || 0) - (usage[b] || 0));
    const count = Math.min(cfg.count, ids.length);
    const seq = shuffle(ordered.slice(0, count));
    const labels = {}; seq.forEach(id => labels[id] = items[id].text);
    const target = cfg.reverse ? [...seq].reverse() : seq;
    let options = [];
    if (!cfg.typing) {
      const others = shuffle(ids.filter(id => !seq.includes(id))).slice(0, cfg.others);
      const traps = makeTraps(seq.map(id => items[id].text), ids.map(id => items[id].norm), cfg.traps);
      options = shuffle([
        ...seq.map(id => ({ id, text: items[id].text })),
        ...others.map(id => ({ id, text: items[id].text })),
        ...traps.map((t, i) => ({ id: 'trap' + i, text: t })),
      ]);
    }
    const pids = Object.keys(room.players || {});
    const luck = shuffle(pids).slice(0, Math.max(1, Math.round(pids.length / 8)));
    finalizing = false;
    await update(ref(db, 'rooms/' + code), {
      ['rounds/' + r]: { seq, labels, options, first: target[0], slotCount: seq.length, reverse: cfg.reverse, typing: cfg.typing, luck },
      ['picks/' + r]: null,
      'state/phase': 'intro', 'state/round': r, 'state/revealIdx': -1, 'state/answerEndsAt': 0,
    });
  } finally { roundStarting = false; }
}

function T_playShow(){
  const st = room.state, r = st.round, cfg = ROUNDS[r - 1], rd = room.rounds[r];
  const n = rd.seq.length;
  update(ref(db, 'rooms/' + code + '/state'), { phase: 'show', revealIdx: -1 });
  Beat.start(cfg.bpm, i => {
    beatVis(i);
    const chant = el('chant'), slot = el('itemSlot'), prog = el('prog');
    if (!chant) return;
    if (i < 4) {
      chant.textContent = '시장에 가면~'; chant.classList.remove('pop'); void chant.offsetWidth; chant.classList.add('pop');
      if (slot) slot.innerHTML = ''; if (prog) prog.textContent = '준비~';
      return;
    }
    const j = i - 4;
    if (j < 2 * n) {
      if (j % 2 === 0) {
        const k = j / 2, id = rd.seq[k], last = k === n - 1;
        const author = (room.items && room.items[id] && room.items[id].author) || '';
        chant.textContent = '시장에 가면~';
        slot.innerHTML = `<div class="itemCard pop">${esc(rd.labels[id])}<span class="tail">${last ? '도 있다!' : '도 있고~'}</span></div>
          ${room.state.showNames && author ? `<div class="author pop">by ${esc(author)}</div>` : ''}`;
        prog.textContent = `${k + 1} / ${n}`;
        Beat.ding();
        update(ref(db, 'rooms/' + code + '/state'), { revealIdx: k });
      }
      return;
    }
    if (j === 2 * n) { slot.innerHTML = '<div class="bigEmoji pop">🤔</div>'; chant.textContent = '자, 기억나니?'; prog.textContent = ''; }
    if (j === 2 * n + 2) T_startAnswer();
  });
  tKey = 'show:' + r + ':' + room.state.showNames;
  room.state.phase = 'show';
  T_shell();
}

function T_startAnswer(){
  const cfg = ROUNDS[room.state.round - 1];
  Beat.setCb(i => beatVis(i));
  update(ref(db, 'rooms/' + code + '/state'), { phase: 'answer', answerEndsAt: now() + cfg.limit * 1000, revealIdx: -1 });
}

async function T_finalize(){
  if (finalizing) return; finalizing = true;
  try {
    const R = (await get(ref(db, 'rooms/' + code))).val();
    if (!R || R.state.phase !== 'answer') return;
    Beat.stop();
    const r = R.state.round, cfg = ROUNDS[r - 1], rd = R.rounds[r];
    const items = R.items || {}, players = R.players || {}, picks = (R.picks && R.picks[r]) || {};
    const target = rd.reverse ? [...rd.seq].reverse() : rd.seq;
    const missed = {}; target.forEach(id => missed[id] = 0);
    const res = {};
    for (const pid of Object.keys(players)) {
      const p = picks[pid];
      if (!p) { res[pid] = { absent: true, correct: 0, base: 0, combo: 0, speed: 0, breaker: 0, lucky: false, score: 0 }; continue; }
      const list = p.list || [];
      const flags = target.map((id, i) => i === 0 ? true : (rd.typing ? fuzzyEq(list[i], rd.labels[id]) : list[i] === id));
      flags.forEach((f, i) => { const id = target[i]; if (!f && items[id] && items[id].pid !== pid) missed[id]++; });
      let run = 0, best = 0; flags.forEach(f => { run = f ? run + 1 : 0; best = Math.max(best, run); });
      const correct = flags.filter(Boolean).length;
      const complete = rd.typing ? !!p.doneAt : list.length >= rd.slotCount;
      const speed = (complete && p.doneAt) ? Math.min(SPEED_MAX, Math.max(0, Math.floor((R.state.answerEndsAt - p.doneAt) / 2000))) : 0;
      res[pid] = { correct, flags, base: correct * cfg.per, combo: best >= COMBO_MIN ? COMBO_BONUS : 0, speed, breaker: 0, lucky: (rd.luck || []).includes(pid), score: 0 };
    }
    target.forEach(id => { const a = items[id] && items[id].pid; if (a && res[a]) res[a].breaker += missed[id] * BREAKER_PER; });
    const upd = {};
    for (const [pid, x] of Object.entries(res)) {
      if (!x.absent) x.score = (x.base + x.combo + x.speed + x.breaker) * (x.lucky ? 2 : 1);
      else if (x.breaker) x.score = x.breaker;
      upd['players/' + pid + '/total'] = (players[pid].total || 0) + x.score;
      upd['players/' + pid + '/breakerTotal'] = (players[pid].breakerTotal || 0) + x.breaker;
    }
    const played = Object.values(res).filter(x => !x.absent).length;
    for (const id of target) {
      upd['missTotal/' + id] = ((R.missTotal && R.missTotal[id]) || 0) + missed[id];
    }
    upd['rounds/' + r + '/results'] = res;
    upd['rounds/' + r + '/missed'] = missed;
    upd['rounds/' + r + '/played'] = played;
    upd['state/phase'] = 'result';
    await update(ref(db, 'rooms/' + code), upd);
    Beat.fanfare();
  } finally { finalizing = false; }
}

function topPlayers(n = 5){
  return Object.entries(room.players || {}).map(([pid, p]) => ({ pid, ...p, total: p.total || 0 }))
    .sort((a, b) => b.total - a.total).slice(0, n);
}
const MEDAL = ['🥇', '🥈', '🥉', '🎀', '🌷'];

function T_resultHTML(){
  const r = room.state.round, cfg = ROUNDS[r - 1], rd = room.rounds[r];
  const res = rd.results || {}, missed = rd.missed || {}, played = rd.played || 0;
  const items = room.items || {}, players = room.players || {};
  const target = rd.reverse ? [...rd.seq].reverse() : rd.seq;
  const lucky = Object.entries(res).filter(([, x]) => x.lucky && !x.absent).map(([pid]) => players[pid] && players[pid].name).filter(Boolean);
  let worst = null; target.forEach(id => { if (!worst || missed[id] > missed[worst]) worst = id; });
  const worstItem = worst && items[worst];
  const ans = target.map((id, i) => `<div class="ans"><span class="n">${i + 1}</span>${esc(rd.labels[id])}
     <small>${room.state.showNames && items[id] ? esc(items[id].author) + ' · ' : ''}😵 ${missed[id] || 0}명 깜빡</small></div>`).join('');
  const ranks = topPlayers().map((p, i) => `<div class="rank"><span class="medal">${MEDAL[i]}</span>${esc(p.name)}<b>${p.total}점</b></div>`).join('');
  return `<div class="center" style="margin-bottom:14px"><span class="roundBadge">${r}라운드 결과 · ${esc(cfg.name)}</span></div>
    <div class="grid2">
      <div class="card"><h3>✅ 정답 순서 ${rd.reverse ? '(거꾸로)' : ''}</h3><div class="ansList">${ans}</div></div>
      <div class="card"><h3>🏆 TOP 5</h3>${ranks || '<p class="muted">아직 없어요</p>'}
        ${lucky.length ? `<div class="hl">🍀 <b>행운 카드!</b> ${lucky.map(esc).join(', ')} — 이번 라운드 점수 2배!</div>` : ''}
        ${worstItem && missed[worst] > 0 ? `<div class="hl lav">💥 <b>기억 브레이커</b> ${room.state.showNames ? esc(worstItem.author) + '의 ' : ''}'${esc(worstItem.text)}' — ${missed[worst]}명이 깜빡했어요!</div>` : ''}
        <div class="hl mint">🙌 참여 ${played}명</div>
      </div>
    </div>
    <div class="center" style="margin-top:22px">
      ${r < 4 ? `<button class="btn big mint" data-act="startRound" data-r="${r + 1}">${r + 1}라운드 ▶ ${ROUNDS[r].emoji} ${esc(ROUNDS[r].name)}</button>`
              : `<button class="btn big lemon" data-act="toEnd">🎉 최종 결과 보기</button>`}
    </div>`;
}

function T_endHTML(){
  const players = room.players || {}, items = room.items || {}, mt = room.missTotal || {};
  const top = topPlayers();
  const brk = Object.values(players).filter(p => (p.breakerTotal || 0) > 0).sort((a, b) => (b.breakerTotal || 0) - (a.breakerTotal || 0))[0];
  const worst3 = Object.entries(mt).filter(([id, v]) => items[id] && v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return `<div class="stage" style="min-height:auto">
      <div class="bigEmoji bounce">🎉</div><div class="title">시장 <span>폐장!</span></div></div>
    <div class="grid2" style="margin-top:10px">
      <div class="card"><h3>🏆 최종 TOP 5</h3>${top.map((p, i) => `<div class="rank"><span class="medal">${MEDAL[i]}</span>${esc(p.name)}<b>${p.total}점</b></div>`).join('')}</div>
      <div class="card"><h3>✨ 특별상</h3>
        ${brk ? `<div class="hl lav">💥 <b>기억 브레이커 왕</b><br>${esc(brk.name)} — 친구들을 ${Math.round(brk.breakerTotal / BREAKER_PER)}번 헷갈리게 했어요!</div>` : ''}
        ${worst3.length ? `<div class="hl">😵 <b>가장 많이 깜빡한 물건</b><br>${worst3.map(([id, v], i) => `${i + 1}. ${esc(items[id].text)} (${v}번)`).join('<br>')}</div>` : ''}
      </div>
    </div>`;
}

/* =========================================================
   🧒 학생 화면
   ========================================================= */
const S = { code: params.get('room') || '', pid: null, name: '', state: null, me: null, rd: null, rdRound: 0, list: [], listRound: 0,
            hintUsed: false, done: false, locked: false, view: '', myItem: null, unsub: [] };

function S_init(){
  app.innerHTML = `<div class="s-wrap"><div class="stage">
    <div class="bigEmoji bounce">🧺</div>
    <div class="title">시장에 <span>가면</span></div>
    <div class="card" style="width:min(460px,100%);display:grid;gap:12px">
      <input class="field" id="jCode" inputmode="numeric" maxlength="4" placeholder="입장 코드 4자리" value="${esc(S.code)}">
      <input class="field" id="jName" maxlength="8" placeholder="내 이름" value="${esc(localStorage.getItem('market_name') || '')}">
      <button class="btn big mint" data-act="join">들어가기 🚪</button>
    </div>
  </div></div>`;
}

async function S_join(){
  const c = el('jCode').value.trim(), name = el('jName').value.trim();
  if (!/^\d{4}$/.test(c)) { toast('입장 코드 4자리를 써 주세요'); return; }
  if (!name) { toast('이름을 써 주세요'); return; }
  const st = await get(ref(db, 'rooms/' + c + '/state'));
  if (!st.exists()) { toast('그런 방이 없어요 😢 코드를 확인해 주세요'); return; }
  S.code = c; S.name = name; localStorage.setItem('market_name', name);
  let pid = localStorage.getItem('market_pid_' + c);
  if (!pid) { pid = rid(); localStorage.setItem('market_pid_' + c, pid); }
  S.pid = pid;
  const pref = ref(db, `rooms/${c}/players/${pid}`);
  const ex = await get(pref);
  if (ex.exists()) await update(pref, { name });
  else await set(pref, { name, total: 0, breakerTotal: 0, joinedAt: serverTimestamp() });
  S.myItem = localStorage.getItem(`market_item_${c}_${pid}`);
  onValue(pref, s => { S.me = s.val(); const t = el('myTotal'); if (t && S.me) t.textContent = (S.me.total || 0) + '점'; });
  onValue(ref(db, `rooms/${c}/state`), s => { S.state = s.val(); S_render(); });
  setInterval(S_tick, 200);
}

function S_top(){
  return `<div class="s-top"><span class="me">🙂 ${esc(S.name)}</span><span class="pill">⭐ <span id="myTotal">${(S.me && S.me.total) || 0}점</span></span></div>`;
}

async function S_loadRound(r){
  if (S.rdRound === r && S.rd) return;
  const s = await get(ref(db, `rooms/${S.code}/rounds/${r}`));
  S.rd = s.val(); S.rdRound = r;
}

async function S_render(){
  const st = S.state; if (!st) return;
  const key = st.phase + ':' + st.round;
  if (key === S.view) return;
  S.view = key;
  const r = st.round, cfg = ROUNDS[r - 1];
  if (st.phase === 'lobby') {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="min-height:70vh">
      <div class="title" style="font-size:36px">시장에 무엇을 넣을까? 🧺</div>
      <div id="itemZone" style="width:min(560px,100%)"></div></div></div>`;
    S_lobbyZone();
    if (S.myItem) onValue(ref(db, `rooms/${S.code}/items/${S.myItem}`), s => { if (!s.exists() && S.myItem) { S.myItem = null; localStorage.removeItem(`market_item_${S.code}_${S.pid}`); if (S.state.phase === 'lobby') { S_lobbyZone(); toast('선생님이 물건을 지웠어요. 다른 걸로 넣어 볼까요?'); } } });
    return;
  }
  if (st.phase === 'intro' || st.phase === 'show') {
    S_loadRound(r);
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
      <span class="roundBadge">${r}라운드 · ${esc(cfg.name)}</span>
      <div class="bigEmoji bounce">👀</div>
      <div class="title" style="font-size:40px">${st.phase === 'intro' ? '곧 시작해요!' : '프로젝터를 봐요!'}</div>
      <div class="rule">${esc(cfg.desc)}</div>
      <div class="muted" style="font-size:20px">${st.phase === 'show' ? '순서를 꼭 외워요 🧠' : '1개당 ' + cfg.per + '점'}</div>
    </div></div>`;
    return;
  }
  if (st.phase === 'answer') {
    await S_loadRound(r);
    if (S.listRound !== r) {
      S.listRound = r; S.hintUsed = false; S.done = false; S.locked = false;
      const ex = (await get(ref(db, `rooms/${S.code}/picks/${r}/${S.pid}`))).val();
      S.list = (ex && ex.list) || (S.rd.typing ? [] : [S.rd.first]);
      S.done = !!(ex && ex.doneAt);
      if (!ex) set(ref(db, `rooms/${S.code}/picks/${r}/${S.pid}/list`), S.list);
    }
    S_answerShell(r);
    return;
  }
  if (st.phase === 'result') {
    const res = (await get(ref(db, `rooms/${S.code}/rounds/${r}/results/${S.pid}`))).val();
    S_resultView(r, res);
    return;
  }
  if (st.phase === 'end') {
    const ps = (await get(ref(db, `rooms/${S.code}/players`))).val() || {};
    const sorted = Object.entries(ps).sort((a, b) => (b[1].total || 0) - (a[1].total || 0));
    const inTop = sorted.slice(0, 5).some(([pid]) => pid === S.pid);
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
      <div class="bigEmoji bounce">🎉</div><div class="title">시장 <span>폐장!</span></div>
      <div class="muted" style="font-size:22px">내 최종 점수</div>
      <div class="score">${(S.me && S.me.total) || 0}점</div>
      ${inTop ? '<div class="hl">🏆 TOP 5 안에 들었어요!</div>' : '<div class="hl mint">끝까지 함께해서 최고였어요 🙌</div>'}
      ${(S.me && S.me.breakerTotal) ? `<div class="hl lav">💥 내 물건으로 친구들을 ${Math.round(S.me.breakerTotal / BREAKER_PER)}번 헷갈리게 했어요!</div>` : ''}
    </div></div>`;
  }
}

function S_lobbyZone(){
  const z = el('itemZone'); if (!z) return;
  if (S.myItem) {
    get(ref(db, `rooms/${S.code}/items/${S.myItem}`)).then(s => {
      const it = s.val(); if (!it || !el('itemZone')) return;
      el('itemZone').innerHTML = `<div class="card center"><div class="muted">내가 넣은 물건</div>
        <div class="itemCard pop" style="font-size:54px;padding:20px;margin:14px auto;min-width:0">${esc(it.text)}</div>
        <div class="rule bounce">친구들 기다리는 중... ⏳</div></div>`;
    });
    return;
  }
  z.innerHTML = `<div class="card" style="display:grid;gap:12px">
    <div class="rule">시장에 가면 ___ 도 있고~</div>
    <input class="field" id="itemInput" maxlength="12" placeholder="예) 치킨, 교감선생님, 고무장갑">
    <div class="muted">먹을 거, 물건, 사람 다 OK! 엉뚱할수록 친구들이 헷갈려서 💥브레이커 점수를 받아요</div>
    <button class="btn big" data-act="addItem">시장에 넣기 🧺</button></div>`;
  el('itemInput').addEventListener('keydown', e => { if (e.key === 'Enter') S_addItem(); });
}

async function S_addItem(){
  const inp = el('itemInput'); if (!inp) return;
  const v = inp.value.trim();
  if (!v) { toast('물건을 써 주세요'); return; }
  const n = norm(v);
  if (!n) { toast('다른 걸로 써 볼까요?'); return; }
  if (S.state.phase !== 'lobby') { toast('이미 게임이 시작됐어요!'); return; }
  const id = rid();
  const tx = await runTransaction(ref(db, `rooms/${S.code}/norms/${n}`), cur => cur === null ? id : undefined);
  if (!tx.committed) { toast('앗! 이미 누가 시장에 넣었어요 😮 다른 걸로!'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
  await set(ref(db, `rooms/${S.code}/items/${id}`), { text: v, norm: n, author: S.name, pid: S.pid, at: serverTimestamp() });
  S.myItem = id; localStorage.setItem(`market_item_${S.code}_${S.pid}`, id);
  onValue(ref(db, `rooms/${S.code}/items/${id}`), s => { if (!s.exists() && S.myItem === id) { S.myItem = null; localStorage.removeItem(`market_item_${S.code}_${S.pid}`); if (S.state.phase === 'lobby') { S_lobbyZone(); toast('선생님이 물건을 지웠어요. 다른 걸로 넣어 볼까요?'); } } });
  S_lobbyZone();
}

function S_target(){ const rd = S.rd; return rd.reverse ? [...rd.seq].reverse() : rd.seq; }

function S_answerShell(r){
  const cfg = ROUNDS[r - 1], rd = S.rd;
  app.innerHTML = `<div class="s-wrap">${S_top()}
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="roundBadge" style="font-size:18px">${r}라운드 · ${esc(cfg.name)}</span>
      <span class="rule" style="font-size:20px">${rd.reverse ? '⬅️ 마지막 물건부터 거꾸로!' : rd.typing ? '✍️ 순서대로 써요' : '👆 순서대로 눌러요 (취소 안 돼요!)'}</span>
      <span style="margin-left:auto;font-size:26px;color:var(--pinkD)" id="sTime"></span>
    </div>
    <div class="bar" id="sBar" style="margin:10px 0"><i></i></div>
    <div id="ansArea"></div>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn sm lemon" id="hintBtn" data-act="hint">💡 힌트 (1번)</button>
      ${rd.typing ? '<button class="btn mint" id="submitBtn" data-act="submitTyping" style="margin-left:auto">다 썼어요! 제출 ✅</button>' : ''}
    </div>
    <div id="doneArea"></div></div>`;
  S_drawAnswer();
}

function S_drawAnswer(){
  const rd = S.rd, area = el('ansArea'); if (!area) return;
  const target = S_target(), labelOf = id => (rd.labels && rd.labels[id]) || ((rd.options || []).find(o => o.id === id) || {}).text || '';
  if (rd.typing) {
    if (!area.querySelector('.tgrid')) {
      area.innerHTML = `<div class="tgrid">${target.map((id, i) => `<div><div class="tlab">${i + 1}번째${i === 0 ? ' 🎁 선물' : ''}</div>
        <input class="tin" data-i="${i}" maxlength="14" ${i === 0 ? `readonly value="${esc(labelOf(id))}"` : `value="${esc(S.list[i] || '')}"`} autocomplete="off"></div>`).join('')}</div>`;
      let tm;
      area.querySelectorAll('.tin').forEach(inp => inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(S_saveTyping, 400); }));
    }
    area.querySelectorAll('.tin').forEach(inp => { if (S.done || S.locked) inp.disabled = true; });
  } else {
    const filled = S.list.length;
    const slots = target.map((id, i) => {
      const v = S.list[i];
      const cls = i === 0 ? 'slot gift' : v ? 'slot f' : i === filled ? 'slot cur' : 'slot';
      return `<div class="${cls}"><span class="k">${i + 1}${i === 0 ? ' 🎁' : ''}</span>${v ? esc(labelOf(v)) : '?'}</div>`;
    }).join('');
    const opts = (rd.options || []).map(o => `<button class="opt${S.list.includes(o.id) ? ' used' : ''}" data-act="pick" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join('');
    area.innerHTML = `<div class="slots">${slots}</div>${S.done || S.locked ? '' : `<div class="opts">${opts}</div>`}`;
  }
  const hb = el('hintBtn'); if (hb) { hb.disabled = S.hintUsed || S.done || S.locked; if (S.hintUsed) hb.textContent = '💡 힌트 사용함'; }
  const sb = el('submitBtn'); if (sb) sb.disabled = S.done || S.locked;
  const da = el('doneArea');
  if (da) da.innerHTML = S.done ? '<div class="doneBox pop">제출 완료! 🎉<br><span style="font-size:20px">프로젝터를 보며 기다려요</span></div>'
                      : S.locked ? '<div class="doneBox pop" style="background:var(--lemon)">시간 끝! ⏰<br><span style="font-size:20px">고른 만큼 점수를 받아요</span></div>' : '';
}

function S_pick(id){
  if (S.done || S.locked || !S.rd) return;
  if (S.list.includes(id)) return;
  S.list.push(id);
  const base = `rooms/${S.code}/picks/${S.state.round}/${S.pid}`;
  set(ref(db, base + '/list'), S.list);
  if (S.list.length >= S.rd.slotCount) { S.done = true; set(ref(db, base + '/doneAt'), serverTimestamp()); }
  S_drawAnswer();
}

function S_collectTyping(){
  const vals = []; document.querySelectorAll('.tin').forEach(inp => vals[+inp.dataset.i] = inp.value.trim());
  return vals;
}
function S_saveTyping(){
  if (!S.rd || !S.rd.typing || S.done) return;
  S.list = S_collectTyping();
  set(ref(db, `rooms/${S.code}/picks/${S.state.round}/${S.pid}/list`), S.list);
}
function S_submitTyping(){
  if (S.done || S.locked) return;
  S.list = S_collectTyping();
  const base = `rooms/${S.code}/picks/${S.state.round}/${S.pid}`;
  set(ref(db, base + '/list'), S.list);
  set(ref(db, base + '/doneAt'), serverTimestamp());
  S.done = true; S_drawAnswer();
}

function S_hint(){
  if (S.hintUsed || S.done || S.locked || !S.rd) return;
  const target = S_target();
  let idx;
  if (S.rd.typing) { const vals = S_collectTyping(); idx = target.findIndex((_, i) => i > 0 && !vals[i]); if (idx < 0) idx = target.length - 1; }
  else idx = S.list.length;
  if (idx >= target.length) return;
  const text = S.rd.labels[target[idx]] || '';
  S.hintUsed = true;
  toast(`💡 ${idx + 1}번째는 '${text.charAt(0)}'(으)로 시작해요! (${text.length}글자)`);
  S_drawAnswer();
}

function S_tick(){
  const st = S.state; if (!st || st.phase !== 'answer' || !S.rd) return;
  const cfg = ROUNDS[st.round - 1], rem = st.answerEndsAt - now();
  const t = el('sTime'), bar = el('sBar');
  if (t) t.textContent = '⏱ ' + Math.max(0, Math.ceil(rem / 1000)) + '초';
  if (bar) { bar.firstElementChild.style.width = Math.max(0, Math.min(100, rem / (cfg.limit * 1000) * 100)) + '%'; bar.classList.toggle('hurry', rem < 10000); }
  if (rem <= 0 && !S.locked && !S.done) { if (S.rd.typing) S_saveTyping(); S.locked = true; S_drawAnswer(); }
}

function S_resultView(r, res){
  const cfg = ROUNDS[r - 1];
  if (!res || res.absent) {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage"><div class="bigEmoji">☕</div>
      <div class="title" style="font-size:36px">이번 라운드는 쉬었어요</div>
      ${res && res.breaker ? `<div class="hl lav">그래도 💥 내 물건 덕분에 +${res.breaker}점!</div>` : ''}
      <div class="rule">다음 라운드에 같이 해요 🙌</div></div></div>`;
    return;
  }
  const slots = S.rd ? S.rd.slotCount : '';
  app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="gap:10px">
    <span class="roundBadge">${r}라운드 결과</span>
    <div class="rule">${slots}개 중 <b style="color:var(--pinkD)">${res.correct}개</b> 맞혔어요!</div>
    ${res.lucky ? `<div class="luck"><div class="in"><div class="fa">🎴 ?</div><div class="ba">🍀 행운 카드!<span style="font-size:20px">점수 2배</span></div></div></div>` : ''}
    <div class="card" style="width:min(460px,100%)">
      <div class="brk"><span>✅ 맞힌 점수</span><span>+${res.base}</span></div>
      ${res.combo ? `<div class="brk"><span>🔥 연속 콤보</span><span>+${res.combo}</span></div>` : ''}
      ${res.speed ? `<div class="brk"><span>⚡ 스피드</span><span>+${res.speed}</span></div>` : ''}
      ${res.breaker ? `<div class="brk"><span>💥 기억 브레이커</span><span>+${res.breaker}</span></div>` : ''}
      ${res.lucky ? `<div class="brk"><span>🍀 행운 카드</span><span>×2</span></div>` : ''}
      <div class="brk" style="border:none;font-size:28px"><span>이번 라운드</span><span style="color:var(--pinkD)">+${res.score}점</span></div>
    </div>
    <div class="muted" style="font-size:20px">${res.correct >= 1 ? '잘했어요! 프로젝터에서 정답을 확인해요 👀' : '괜찮아요, 다음 라운드에 또!'}</div>
  </div></div>`;
}

/* ---------------- 클릭 처리 ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'join') return S_join();
  if (a === 'addItem') return S_addItem();
  if (a === 'pick') return S_pick(b.dataset.id);
  if (a === 'hint') return S_hint();
  if (a === 'submitTyping') return S_submitTyping();
  if (a === 'newRoom') return T_newRoom();
  if (a === 'resume') { location.href = location.pathname + '?t=1&room=' + b.dataset.code; return; }
  if (!room) return;
  if (a === 'toggleNames') return update(ref(db, `rooms/${code}/state`), { showNames: !room.state.showNames });
  if (a === 'toggleMute') { Beat.muted = !Beat.muted; b.textContent = Beat.muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐'; return; }
  if (a === 'newGame') { if (confirm('새 게임을 만들까요? (지금 방은 그대로 남아요)')) T_newRoom(); return; }
  if (a === 'addReserve') {
    const used = new Set(Object.values(room.items || {}).map(i => i.norm));
    const upd = {}; let k = 0;
    for (const t of shuffle(RESERVE)) { const n = norm(t); if (used.has(n)) continue; const id = rid(); upd['items/' + id] = { text: t, norm: n, author: '선생님', pid: 'teacher', at: Date.now() }; upd['norms/' + n] = id; if (++k >= 5) break; }
    return update(ref(db, 'rooms/' + code), upd);
  }
  if (a === 'delItem') {
    const it = room.items && room.items[b.dataset.id]; if (!it) return;
    return update(ref(db, 'rooms/' + code), { ['items/' + b.dataset.id]: null, ['norms/' + it.norm]: null });
  }
  if (a === 'startRound') { Beat.ensure(); return T_startRound(+b.dataset.r); }
  if (a === 'playShow') return T_playShow();
  if (a === 'resumeBeat') { Beat.start(ROUNDS[room.state.round - 1].bpm, i => beatVis(i)); b.remove(); return; }
  if (a === 'closeNow') { if (confirm('지금 마감할까요?')) T_finalize(); return; }
  if (a === 'toEnd') return update(ref(db, `rooms/${code}/state`), { phase: 'end' });
});
</script>
