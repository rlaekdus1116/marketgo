/* ---------------- 공통 ---------------- */
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const isTeacher = params.has('t');
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function norm(s){
  let n = String(s || '').normalize('NFC').toLowerCase().replace(/[\s.,!?~'"`#$\[\]\/·\-_()^*:;]/g, '');
  if (n.length > 2 && n.endsWith('들')) n = n.slice(0, -1);
  return n;
}
function lev(a, b){
  const m = a.length, n = b.length; const d = Array.from({length:m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function fuzzyEq(a, b){
  a = norm(a); b = norm(b);
  if (!a || !b) return false;
  if (a === b) return true;
  if (Math.min(a.length, b.length) >= 3 && Math.abs(a.length - b.length) <= 1) return lev(a, b) <= 1;

const db = getDatabase(initializeApp(firebaseConfig));

onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });

setTimeout(() => { if (!connected) toast('⚠️ 인터넷 연결을 확인해 주세요'); }, 7000);

const targetOf = (rd, k, rev) => { const c = rd.chain.slice(0, k); return rev ? c.reverse() : c; };
const roundLabel = cfg => cfg.practice ? '연습' : cfg.bonus ? '번외' : cfg.name;
function buildPlan(cfg, target, avail){
  const K = Math.max(2, Math.min(target, avail));
  if (cfg.flash) return [{ k: K, rev: false }];
  const ks = [2];
  while (ks[ks.length - 1] < K) { const k = ks[ks.length - 1]; ks.push(Math.min(K, k + (cfg.jumpFrom && k >= cfg.jumpFrom ? 2 : 1))); }
  const out = ks.map(k => ({ k, rev: false }));

  const eq = (pick, id) => typing ? fuzzyEq(pick, labels[id]) : pick === id;
  const flags = target.map((id, i) => !!list[i] && eq(list[i], id));
  const used = new Set();
  const hit = target.map(id => {
    const j = list.findIndex((p, i) => !used.has(i) && p && eq(p, id));

  const res = rd.res || {}; let s = null;

const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const BASS = [36, 43, 45, 41];                                   // C G Am F
const ARP = [[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69]];

const Music = {
  ctx:null, master:null, mus:null, sfx:null, noise:null,
  timer:null, i:0, next:0, bpm:112, level:1, gen:0,
  mode:'synth', audio:null, fileName:'', muted:false, onBeat:null,
  ensure(){

  duck(on){ if (this.mus) this.mus.gain.setTargetAtTime(on ? 0.3 : 0.55, this.ctx.currentTime, 0.2); },
  setMode(m){
    this.mode = m;
    if (m === 'synth' && this.audio) this.audio.pause();
    if (m === 'file' && this.audio && this.timer) this.audio.play().catch(() => {});
  },
  loadFile(file){
    this.ensure();
    if (this.audio) { this.audio.pause(); URL.revokeObjectURL(this.audio.src); }
    const a = new Audio(URL.createObjectURL(file)); a.loop = true;
    this.ctx.createMediaElementSource(a).connect(this.mus);
    this.audio = a; this.fileName = file.name.replace(/\.[^.]+$/, '');
    this.setMode('file');
  },
  tick(){
    const c = this.ctx;
    while (this.next < c.currentTime + 0.12) {
      const i = this.i, t = this.next, g = this.gen;
      if (this.mode === 'synth') this.step(i, t);
      if (i % 4 === 0) setTimeout(() => { if (g === this.gen && this.onBeat) this.onBeat(i / 4); }, Math.max(0, (t - c.currentTime) * 1000));
      this.next += 60 / this.bpm / 4; this.i++;
    }
  },
  step(i, t){
    const s = i % 16, bar = Math.floor(i / 16) % 4, L = this.level, sd = 60 / this.bpm / 4;
    if (s % 4 === 0) this.kick(t);
    if (L >= 4 && (s === 14 || s === 7)) this.kick(t, 0.6);
    if (s % 2 === 0) this.hat(t, s % 4 === 2 ? 0.11 : 0.05, s % 4 === 2 && L >= 4 ? 0.18 : 0.04);
    else if (L >= 3) this.hat(t, 0.035, 0.03);
    if (L >= 1 && s % 2 === 0) this.bass(t, BASS[bar] + (s % 4 === 2 ? 12 : 0), sd * 1.7);
    if (L >= 2 && (s === 4 || s === 12)) this.clap(t);
    if (L >= 2) this.arp(t, ARP[bar][s % 4] + (L >= 4 && s >= 8 ? 12 : 0), sd * 0.9, L >= 3 ? 0.035 : 0.05);
    if (L >= 3) { const n = MEL[bar * 16 + s]; if (n) this.lead(t, n[0], n[1] * sd); }
    if (L >= 4 && s === 0 && bar === 0) this.crash(t);
  },
  env(g, t, v, a, d){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  kick(t, v = 0.9){ const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.15); this.env(g, t, v, 0.003, 0.26); o.connect(g).connect(this.mus); o.start(t); o.stop(t + 0.3); },
  noiseHit(t, type, freq, v, d, out){ const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noise; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = c.createGain(); this.env(g, t, v, 0.002, d); s.connect(f).connect(g).connect(out || this.mus); s.start(t); s.stop(t + d + 0.05); },
  hat(t, v, d){ this.noiseHit(t, 'highpass', 8000, v, d); },
  clap(t){ [0, 0.012, 0.024].forEach((dd, k) => this.noiseHit(t + dd, 'bandpass', 1500, k === 2 ? 0.5 : 0.25, k === 2 ? 0.14 : 0.02)); },
  crash(t){ this.noiseHit(t, 'highpass', 5000, 0.14, 0.9); },
  bass(t, m, d){ const c = this.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(); o.type = 'square'; o.frequency.value = mf(m); f.type = 'lowpass'; f.frequency.value = 650; this.env(g, t, 0.17, 0.005, d); o.connect(f).connect(g).connect(this.mus); o.start(t); o.stop(t + d + 0.05); },
  arp(t, m, d, v){ const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = mf(m); this.env(g, t, v, 0.004, d); o.connect(g).connect(this.mus); o.start(t); o.stop(t + d + 0.05); },
  lead(t, m, d){
    const c = this.ctx;
    [['square', 0, 0.06], ['square', 7, 0.035]].forEach(([type, det, v]) => {
      const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      o.type = type; o.frequency.value = mf(m); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 3200;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01);
      g.gain.setValueAtTime(v, t + d * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(f).connect(g).connect(this.mus); o.start(t); o.stop(t + d + 0.05);
    });
  },
  tone(freq, t, dur = 0.25, vol = 0.3, type = 'triangle'){ const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = freq; this.env(g, t, vol, 0.01, dur); o.connect(g).connect(this.sfx); o.start(t); o.stop(t + dur + 0.05); },
  ding(){ if (!this.ctx) return; const t = this.ctx.currentTime; this.tone(1046.5, t, 0.2, 0.25); this.tone(1568, t + 0.07, 0.3, 0.18); },
  chime(){ if (!this.ctx) return; const t = this.ctx.currentTime; [784, 988, 1175].forEach((f, i) => this.tone(f, t + i * 0.08, 0.3, 0.22)); },
  fanfare(){ this.ensure(); const t = this.ctx.currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, t + i * 0.11, 0.4, 0.3, 'square')); },
  tickSnd(hi){ if (!this.ctx) return; const t = this.ctx.currentTime; this.tone(hi ? 1760 : 1320, t, 0.06, hi ? 0.35 : 0.22, 'square'); },
  siren(){
    this.ensure(); const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(); o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 2500;
    o.frequency.setValueAtTime(600, t); [0.4, 0.8, 1.2, 1.6].forEach((d, k) => o.frequency.linearRampToValueAtTime(k % 2 ? 600 : 1300, t + d));
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.05); g.gain.setValueAtTime(0.12, t + 1.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    o.connect(f).connect(g).connect(this.sfx); o.start(t); o.stop(t + 1.8);
    let tt = t + 1.6; for (let k = 0; k < 14; k++) { this.noiseHit(tt, 'bandpass', 1800, 0.35, 0.05, this.sfx); tt += Math.max(0.03, 0.09 - k * 0.005); }
    this.noiseHit(tt + 0.05, 'highpass', 4000, 0.3, 0.8, this.sfx);
  },
};
const musicLevel = (cfg, k, rev, maxK) => cfg.practice ? 1 : rev ? 4 : 1 + Math.min(3, Math.floor(3 * k / maxK));
const musicBpm = (cfg, k) => Math.min(150, cfg.bpm + 3 * k);
function beatVis(q){

let room = null, code = params.get('room'), tKey = '', loopGen = 0, looping = false, paused = false, forceClose = false, skipCheck = false, starting = false, lastTick = 0;

function T_init(){
  if (!code) {
    const saved = localStorage.getItem('market_teacher_room');
    app.innerHTML = `<div class="wrap"><div class="stage">
      <div class="bigEmoji bounce">🧺</div>
      <div class="title">시장에 <span>가면</span></div>
      <p class="muted" style="font-size:22px">차곡차곡 늘어나는 실시간 기억 게임</p>

  }
  localStorage.setItem('market_teacher_room', code);

}

async function T_newRoom(){
  let c;
  for (let i = 0; i < 15; i++) { c = String(Math.floor(1000 + Math.random() * 9000)); const s = await get(ref(db, 'rooms/' + c + '/state')); if (!s.exists()) break; }
  await set(ref(db, 'rooms/' + c), { createdAt: Date.now(), state: { phase:'lobby', round:-1, si:0, k:0, rev:false, showNames:true, answerEndsAt:0 } });
  localStorage.setItem('market_teacher_room', c);
  location.href = location.pathname + '?t=1&room=' + c;
}

const onlineIds = () => Object.entries(room.players || {}).filter(([, p]) => p.online === true).map(([id]) => id);

const resumeBtn = () => looping ? '' : `<button class="btn big sky" data-act="resumeLoop">▶ 이어서 하기</button>`;
const roundPicker = hi => `<div class="roundPick">${ROUNDS.map((c, i) => `<div class="rpCard">

    <div class="tgt"><button class="btn sm sky" data-act="tgt" data-r="${i}" data-d="-1">−</button><span><b id="tgt${i}">${targets[i]}</b>개까지</span><button class="btn sm sky" data-act="tgt" data-r="${i}" data-d="1">+</button></div>
  </div>`).join('')}</div>`;

function T_render(){
  const st = room.state;
  const key = [st.phase, st.round, st.si, st.showNames, looping, paused, Music.mode, Music.fileName, Music.muted].join(':');
  if (key !== tKey) { tKey = key; T_shell(); }
  T_update();
}

function T_shell(){

  if (st.phase === 'lobby') {

      <div class="lobby">
        <div class="card center">
          <h3>태블릿으로 들어와요!</h3>
          <div class="muted">입장 코드</div>
          <div class="bigcode">${esc(code)}</div>
          <div id="qr"></div>
          <div class="muted" style="font-size:13px;word-break:break-all">${esc(url)}</div>
        </div>

            <div id="itemChips" class="chips"></div>

        </div>
      </div>
      <div style="margin-top:22px">${roundPicker(0)}</div>

  }
  else if (st.phase === 'intro') {

      <div class="rule">${esc(cfg.desc)}<br>
        <span class="muted">${cfg.flash ? `물건 ${maxK}개를 한꺼번에 휙휙! → 기억나는 대로 와다다 쓰기 (순서 맞으면 보너스)` : `물건 ${plan[0].k}개로 시작 → 차곡차곡 ${maxK}개까지!`}</span><br>
        ${plan.some(p => p.rev) ? '<span style="color:var(--peachD)">🔄 중간에 깜짝 리버스가 올 수도...?</span><br>' : ''}
        <span class="muted" style="font-size:22px">🧺 기억한 물건 ${PT_ITEM}점 + 순서까지 맞으면 ${PT_POS}점 더${cfg.mult > 1 ? ` · ×${cfg.mult}` : ''} · 리버스는 ×${REV_MULT}${cfg.practice ? ' (연습은 점수 없음)' : ''}</span></div>
      <button class="btn big" data-act="playRound">▶ 시작!</button>
    </div></div>`;
  }

      <div id="itemSlot" style="min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"></div>

function T_update(){
  const st = room.state, r = st.round, rd = room.rounds && room.rounds[r];
  if (st.phase === 'lobby') {
    const items = Object.entries(room.items || {}).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
    el('itemCount').textContent = items.length + '개';
    el('itemChips').innerHTML = items.map(([id, it]) =>
      `<span class="chip">${esc(it.text)}<small>${esc(it.author)}</small><button class="x" data-act="delItem" data-id="${id}" title="지우기">×</button></span>`).join('')
      || '<p class="muted">학생들이 물건을 넣으면 여기에 쌓여요!</p>';
    const ps = Object.values(room.players || {});
    el('playerCount').textContent = `${ps.filter(p => p.online === true).length}명 접속 중`;
    el('playerChips').innerHTML = ps.map(p => `<span class="chip soft${p.online === true ? '' : ' off'}">${esc(p.name)}</span>`).join('') || '<p class="muted">아직 아무도 없어요</p>';
    const ok = items.length >= MIN_ITEMS;
    document.querySelectorAll('.roundPick [data-act=startRound]').forEach(b => b.disabled = !ok);
    const need = Math.max(...targets) + 2;
    el('startHint').textContent = !ok ? `물건이 ${MIN_ITEMS}개 이상 있어야 시작할 수 있어요 (예비 물건으로 채워도 돼요)`
      : items.length < need ? `${Math.max(...targets)}개까지 하려면 물건이 ${need}개 이상 있어야 해요 (지금은 ${items.length - 2}개까지 가능) · 예비 물건으로 채울 수 있어요` : '이상한 물건은 × 로 지우고 −/+ 로 개수를 정한 다음 라운드를 골라요!';
  }
  if (['show', 'answer', 'check'].includes(st.phase) && rd) {
    const sv = el('surv');
    if (sv) {
      const lastScored = st.phase === 'check' ? st.si : st.si - 1;
      const n = lastScored >= 0 && !ROUNDS[r].flash ? survivors(rd, lastScored) : null;
      sv.innerHTML = (n !== null && !ROUNDS[r].practice ? `<span class="hot">🔥 완벽 생존자 ${n}명</span>` : '') + leaderHTML(st.phase === 'check');
    }
  }
  if (st.phase === 'answer') {
    const onl = onlineIds();
    const picks = (room.picks && room.picks[r] && room.picks[r][st.si]) || {};
    const done = onl.filter(id => picks[id] && picks[id].doneAt).length;
    el('doneCount').textContent = `✅ ${done} / ${onl.length}명 완료`;
  }
  else if (st.phase === 'check') {
    const cfg = ROUNDS[r], k = st.k, si = st.si;
    const target = targetOf(rd, k, st.rev);
    const miss = (rd.miss && rd.miss[si]) || {};
    const items = room.items || {};
    const pk = prevK(rd.plan, si);
    const newIds = st.rev ? [] : rd.chain.slice(pk, k);
    el('checkBody').innerHTML = target.map((id, i) => `<div class="ans pop${newIds.includes(id) ? ' new' : ''}"><span class="n">${i + 1}</span>${esc(rd.labels[id])}
      <small>${st.showNames && items[id] ? esc(items[id].author) + ' · ' : ''}${miss[id] ? '😵 ' + miss[id] + '명 깜빡' : '👍 다 맞힘'}</small></div>`).join('');
    const vals = Object.values((rd.res && rd.res[si]) || {}).filter(x => x && !x.absent);
    const perfect = vals.filter(x => x.perfect).length;
    const more = si < rd.plan.length - 1;
    el('checkInfo').innerHTML = `🌟 이번 단계 완벽: <b>${perfect}명</b> / ${vals.length}명` + (more ? (rd.plan[si + 1].rev ? '' : ' · 다음엔 더 늘어나요!') : ' · 라운드 끝!');
  }
  else if (st.phase === 'result') el('resultBody').innerHTML = T_resultHTML();
  else if (st.phase === 'end') el('endBody').innerHTML = T_endHTML();
}

function T_tick(){
  if (!room || room.state.phase !== 'answer') { lastTick = 0; return; }
  const st = room.state, rem = st.answerEndsAt - now(), lim = answerSec(ROUNDS[st.round], st.k, st.rev) * 1000;
  const t = el('tTimer'), bar = el('tBar');
  const sec = Math.max(0, Math.ceil(rem / 1000));
  if (t) t.textContent = sec;
  if (bar) { bar.firstElementChild.style.width = Math.max(0, Math.min(100, rem / lim * 100)) + '%'; bar.classList.toggle('hurry', rem < 6000); }
  if (looping && sec >= 1 && sec <= 5 && sec !== lastTick) { lastTick = sec; Music.tickSnd(sec <= 3); }
}

async function T_startRound(r){
  if (starting) return;
  const cfg = ROUNDS[r];
  if (!cfg.practice && room.rounds && room.rounds[r] && room.rounds[r].done && !confirm('이미 한 라운드예요. 다시 하면 점수가 또 더해져요. 할까요?')) return;
  starting = true;
  try {
    loopGen++; looping = false; Music.stop();
    const items = room.items || {}, ids = Object.keys(items);
    const usage = {};
    Object.entries(room.rounds || {}).forEach(([rr, rd]) => { if (+rr > 0 && rd) (rd.chain || []).forEach(id => usage[id] = (usage[id] || 0) + 1); });
    const ordered = shuffle(ids).sort((a, b) => (usage[a] || 0) - (usage[b] || 0));
    const plan = buildPlan(cfg, targets[r], ids.length - cfg.others);
    if (Math.max(...plan.map(p => p.k)) < targets[r]) toast(`물건이 모자라서 ${Math.max(...plan.map(p => p.k))}개까지만 해요`);
    const len = Math.max(...plan.map(p => p.k));
    const chain = shuffle(ordered.slice(0, len));
    const labels = {}; chain.forEach(id => labels[id] = items[id].text);
    const decoys = shuffle(ids.filter(id => !chain.includes(id))).slice(0, cfg.others).map(id => ({ id, text: items[id].text }));
    const pids = Object.keys(room.players || {});
    const luck = (cfg.practice || cfg.bonus) ? [] : shuffle(pids).slice(0, Math.max(1, Math.round(pids.length / 8)));
    paused = false;
    await update(ref(db, 'rooms/' + code), {
      ['rounds/' + r]: { chain, labels, decoys, luck, plan },
      ['picks/' + r]: null,
      'state/phase': 'intro', 'state/round': r, 'state/si': 0, 'state/k': plan[0].k, 'state/rev': false, 'state/answerEndsAt': 0,
    });
  } finally { starting = false; }
}

/* 라운드 진행: 보여주기 → 답하기 → 정답 확인 → 하나 더 (또는 깜짝 리버스) ... */
async function T_runRound(fromSi){
  const g = ++loopGen; looping = true; forceClose = false;
  const r = room.state.round;
  const alive = () => g === loopGen;
  tKey = ''; T_render();
  try {
    for (let si = fromSi; ; si++) {
      if (!alive()) return;
      if (si >= room.rounds[r].plan.length) break;
      await T_show(r, si, alive); if (!alive()) return;
      await T_answer(r, si, alive); if (!alive()) return;
      await T_score(r, si);
      Music.chime(); Music.duck(false);
      skipCheck = false; const t0 = Date.now();
      while (alive() && !skipCheck && Date.now() - t0 < CHECK_MS) await sleep(100);
      while (alive() && paused && !skipCheck) await sleep(200);
    }
    if (!alive()) return;
    Music.stop();
    await update(ref(db, `rooms/${code}`), { 'state/phase': 'result', [`rounds/${r}/done`]: true });
    Music.fanfare();
  } finally { if (g === loopGen) { looping = false; tKey = ''; if (room) T_render(); } }
}

async function T_show(r, si, alive){
  const rd = room.rounds[r], cfg = ROUNDS[r], p = rd.plan[si], maxK = rd.chain.length;
  Music.play(musicLevel(cfg, p.k, p.rev, maxK), musicBpm(cfg, p.k)); Music.duck(false);
  await update(ref(db, `rooms/${code}/state`), { phase: 'show', si, k: p.k, rev: !!p.rev });
  const slot = () => el('itemSlot');
  if (p.rev) {
    if (slot()) slot().innerHTML = `<div class="revBig">🔄</div><div class="revText pop">리버스!</div><div class="rule">새 물건 없이 바로! 마지막 물건부터 거꾸로!</div>`;
    Music.siren();
    await sleep(2800);
    return;
  }
  const pk = prevK(rd.plan, si), newIds = rd.chain.slice(pk, p.k);
  if (cfg.flash) {
    for (const n of ['⚡ 플래시!', '3', '2', '1']) { if (slot()) slot().innerHTML = `<div class="revText pop">${n}</div>`; Music.tickSnd(n === '1'); await sleep(650); }
    for (let i = 0; i < newIds.length; i++) {
      if (!alive()) return;
      const id = newIds[i];
      if (slot()) slot().innerHTML = `<div class="itemCard pop">${esc(rd.labels[id])}</div><div class="rule muted">${i + 1} / ${newIds.length}</div>`;
      Music.ding();
      await sleep(FLASH_MS);
    }
    if (slot()) slot().innerHTML = '<div class="revText pop">와다다 써요! ✍️</div>';
    await sleep(900);
    return;
  }
  if (slot()) slot().innerHTML = pk ? `<div class="rule pop">지금까지 ${pk}개! 그리고...</div>` : '<div class="bigEmoji pop">🧺</div>';
  await sleep(1200);
  for (let i = 0; i < newIds.length; i++) {
    if (!alive()) return;
    const id = newIds[i], last = p.k === maxK && i === newIds.length - 1;
    const author = (room.items && room.items[id] && room.items[id].author) || '';
    if (slot()) slot().innerHTML = `<div class="itemCard pop">${esc(rd.labels[id])}<span class="tail">${last ? '도 있다!' : '도 있고~'}</span></div>
      ${room.state.showNames && author ? `<div class="author pop">by ${esc(author)}</div>` : ''}`;
    Music.ding();
    await sleep(SHOW_MS);
  }
  if (slot()) slot().innerHTML = '<div class="bigEmoji pop">🤔</div><div class="rule">자, 처음부터!</div>';
  await sleep(900);
}

async function T_answer(r, si, alive){
  forceClose = false;
  const p = room.rounds[r].plan[si];
  Music.duck(true);
  await update(ref(db, `rooms/${code}/state`), { phase: 'answer', si, k: p.k, rev: !!p.rev, answerEndsAt: now() + answerSec(ROUNDS[r], p.k, p.rev) * 1000 });
  while (alive()) {
    const onl = onlineIds();
    const picks = (room.picks && room.picks[r] && room.picks[r][si]) || {};
    const allDone = onl.length > 0 && onl.every(id => picks[id] && picks[id].doneAt);
    if (forceClose || now() > room.state.answerEndsAt + 600 || allDone) break;
    await sleep(200);
  }
}

async function T_score(r, si){
  const R = (await get(ref(db, 'rooms/' + code))).val();
  const rd = R.rounds[r], cfg = ROUNDS[r], p = rd.plan[si], k = p.k, rev = !!p.rev;
  if (rd.res && rd.res[si]) { await update(ref(db, `rooms/${code}/state`), { phase: 'check', si, k, rev }); return; }
  const items = R.items || {}, players = R.players || {}, picks = (R.picks && R.picks[r] && R.picks[r][si]) || {};
  const target = targetOf(rd, k, rev);
  const mult = cfg.mult * (rev ? REV_MULT : 1);
  const miss = {}; target.forEach(id => miss[id] = 0);
  const res = {};
  for (const pid of Object.keys(players)) {
    const pk = picks[pid];
    if (!pk) { res[pid] = { absent: true, score: 0, breaker: 0 }; continue; }
    const list = pk.list || [];
    const { flags, hit, inc, pos } = gradeList(target, rd.labels, list, !!cfg.typing);
    const perfect = cfg.flash ? inc === k : pos === k;
    (cfg.flash ? hit : flags).forEach((f, i) => { const id = target[i]; if (!f && items[id] && items[id].pid !== pid) miss[id]++; });
    const speed = (perfect && pk.doneAt) ? Math.min(SPEED_MAX, Math.max(0, Math.floor((R.state.answerEndsAt - pk.doneAt) / 2000))) : 0;
    const base = (inc * PT_ITEM + pos * PT_POS + (perfect ? PT_PERFECT : 0) + speed) * mult;
    res[pid] = { inc, pos, perfect, speed, base, flags, hit, breaker: 0, lucky: (rd.luck || []).includes(pid), score: 0 };
  }
  if (!cfg.practice) target.forEach(id => { const a = items[id] && items[id].pid; if (a && res[a]) res[a].breaker += miss[id] * BREAKER_PER; });
  const upd = {};
  for (const [pid, x] of Object.entries(res)) {
    x.score = cfg.practice ? 0 : ((x.base || 0) + x.breaker) * (x.lucky ? 2 : 1);
    upd[`rounds/${r}/sum/${pid}`] = ((rd.sum && rd.sum[pid]) || 0) + x.score;
    upd[`rounds/${r}/brk/${pid}`] = ((rd.brk && rd.brk[pid]) || 0) + x.breaker;
    if (!cfg.practice) {
      upd[`players/${pid}/total`] = (players[pid].total || 0) + x.score;
      upd[`players/${pid}/breakerTotal`] = (players[pid].breakerTotal || 0) + x.breaker;
    }
  }
  if (!cfg.practice) for (const id of target) upd['missTotal/' + id] = ((R.missTotal && R.missTotal[id]) || 0) + miss[id];
  upd[`rounds/${r}/res/${si}`] = res;
  upd[`rounds/${r}/miss/${si}`] = miss;
  upd['state/phase'] = 'check'; upd['state/si'] = si; upd['state/k'] = k; upd['state/rev'] = rev;
  await update(ref(db, 'rooms/' + code), upd);
}

function T_resume(){
  const st = room.state;
  if (st.phase === 'check') T_runRound(st.si + 1);
  else T_runRound(st.si || 0);
}

function T_revNext(){
  const st = room.state, rd = room.rounds && room.rounds[st.round];
  if (!rd || !['show', 'answer', 'check'].includes(st.phase)) return;
  const plan = [...rd.plan], cur = st.si;
  if (plan[cur].rev || (plan[cur + 1] && plan[cur + 1].rev)) { toast('이미 다음 문제가 리버스예요!'); return; }
  plan.splice(cur + 1, 0, { k: plan[cur].k, rev: true });
  set(ref(db, `rooms/${code}/rounds/${st.round}/plan`), plan);
  toast(`🔄 다음 문제는 리버스! (물건 ${plan[cur].k}개 거꾸로)`);
}

function leaderHTML(top3){
  const ps = Object.values(room.players || {}).filter(p => (p.total || 0) > 0).sort((a, b) => b.total - a.total);
  if (!ps.length) return '';

  const max = ps[0].total, names = ps.filter(p => p.total === max).map(p => esc(p.name));
  return `<span class="hot lead">👑 지금 1등: ${names.join(', ')} · ${max}점</span>`;
}

function topPlayers(n = 5){
  return Object.entries(room.players || {}).map(([pid, p]) => ({ pid, ...p, total: p.total || 0 }))
    .sort((a, b) => b.total - a.total).slice(0, n);
}
const MEDAL = ['🥇', '🥈', '🥉', '🎀', '🌷'];

function T_resultHTML(){
  const r = room.state.round, cfg = ROUNDS[r], rd = room.rounds[r];
  const players = room.players || {}, items = room.items || {};

  const ranks = topPlayers().map((p, i) => `<div class="rank"><span class="medal">${MEDAL[i]}</span>${esc(p.name)}<b>${p.total}점</b></div>`).join('');

    <div class="grid2">
      <div class="card"><h3>🧺 이번 시장 물건</h3><div class="chainRow" style="justify-content:flex-start">${ans}</div>
        ${surv ? `<div class="hl peach">🔥 끝까지 완벽 생존: <b>${surv}명</b>!</div>` : ''}</div>
      <div class="card"><h3>🏆 TOP 5</h3>${ranks || '<p class="muted">아직 없어요</p>'}
        ${lucky.length ? `<div class="hl">🍀 <b>행운 카드!</b> ${lucky.map(esc).join(', ')} — 이번 라운드 점수 2배!</div>` : ''}
        ${worst && missAll[worst] > 0 && items[worst] ? `<div class="hl lav">💥 <b>기억 브레이커</b> ${room.state.showNames ? esc(items[worst].author) + '의 ' : ''}'${esc(items[worst].text)}' — ${missAll[worst]}번 깜빡했어요!</div>` : ''}
      </div>
    </div>
    <div style="margin-top:22px">${roundPicker(r + 1 < ROUNDS.length ? r + 1 : -1)}</div>
    <div class="center" style="margin-top:16px"><button class="btn big lemon" data-act="toEnd">🎉 최종 결과 보기</button></div>`;
}

function T_endHTML(){

const S = { code: '', pid: null, name: '', state: null, me: null, rd: null, rdRound: -9,
            list: [], stepKey: '', opts: [], hintRound: -9, done: false, locked: false, view: '', myItem: null, ticker: null };

function S_form(){
  const c = params.get('room') || localStorage.getItem('market_last_room') || '';
  app.innerHTML = `<div class="s-wrap"><div class="stage">
    <div class="bigEmoji bounce">🧺</div>
    <div class="title">시장에 <span>가면</span></div>
    <div class="card" style="width:min(460px,100%);display:grid;gap:12px">
      <input class="field" id="jCode" inputmode="numeric" maxlength="4" placeholder="입장 코드 4자리" value="${esc(c)}">
      <input class="field" id="jName" maxlength="8" placeholder="내 이름" value="${esc(localStorage.getItem('market_name') || '')}">

    </div>
  </div></div>`;
}

function S_init(){
  const c = params.get('room') || localStorage.getItem('market_last_room');
  const name = localStorage.getItem('market_name');
  if (c && name && localStorage.getItem('market_pid_' + c)) {
    app.innerHTML = `<div class="s-wrap"><div class="stage"><div class="bigEmoji bounce">🧺</div><div class="rule">${esc(name)}, 다시 들어가는 중...</div></div></div>`;
    S_join(c, name, true);
  } else S_form();
}

async function S_join(c, name, auto){
  if (!/^\d{4}$/.test(c)) { toast('입장 코드 4자리를 써 주세요'); if (auto) S_form(); return; }
  if (!name) { toast('이름을 써 주세요'); return; }
  const st = await get(ref(db, 'rooms/' + c + '/state'));
  if (!st.exists()) { toast('그런 방이 없어요 😢 코드를 확인해 주세요'); if (auto) S_form(); return; }
  if (auto && !params.get('room') && st.val().phase === 'end') { S_form(); return; }
  let pid = localStorage.getItem('market_pid_' + c), tookOver = false;
  if (!pid) {
    const ps = (await get(ref(db, `rooms/${c}/players`))).val() || {};
    const hit = Object.entries(ps).find(([, p]) => norm(p.name) === norm(name) && p.online !== true);
    if (hit) { pid = hit[0]; tookOver = true; } else pid = rid();
    localStorage.setItem('market_pid_' + c, pid);
  }
  S.code = c; S.name = name; S.pid = pid;
  localStorage.setItem('market_name', name); localStorage.setItem('market_last_room', c);
  const pref = ref(db, `rooms/${c}/players/${pid}`);
  const ex = await get(pref);
  if (ex.exists()) await update(pref, { name });
  else await set(pref, { name, total: 0, breakerTotal: 0, joinedAt: serverTimestamp() });
  if (tookOver) {
    toast('다시 왔구나! 점수 이어서 해요 🙌');
    const items = (await get(ref(db, `rooms/${c}/items`))).val() || {};
    const mine = Object.entries(items).find(([, it]) => it.pid === pid);
    if (mine) localStorage.setItem(`market_item_${c}_${pid}`, mine[0]);
  }
  S.myItem = localStorage.getItem(`market_item_${c}_${pid}`);
  const onlineRef = ref(db, `rooms/${c}/players/${pid}/online`);
  onValue(ref(db, '.info/connected'), s => { if (s.val()) { onDisconnect(onlineRef).set(false); set(onlineRef, true); } });
  onValue(pref, s => { S.me = s.val(); const t = el('myTotal'); if (t && S.me) t.textContent = (S.me.total || 0) + '점'; });
  onValue(ref(db, `rooms/${c}/state`), s => { S.state = s.val(); S_render(); });
  if (!S.ticker) S.ticker = setInterval(S_tick, 200);
}

const S_top = () => `<div class="s-top"><span class="me">🙂 ${esc(S.name)}</span><span class="pill">⭐ <span id="myTotal">${(S.me && S.me.total) || 0}점</span></span></div>`;

async function S_loadRound(r){
  if (S.rdRound === r && S.rd) return;
  S.rd = (await get(ref(db, `rooms/${S.code}/rounds/${r}`))).val(); S.rdRound = r;
}

async function S_render(){
  const st = S.state; if (!st) return;
  const key = st.phase + ':' + st.round + ':' + st.si;
  if (key === S.view) return;
  S.view = key;
  const r = st.round, cfg = ROUNDS[r];
  if (st.phase === 'lobby') {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="min-height:70vh">
      <div class="title" style="font-size:36px">시장에 무엇을 넣을까? 🧺</div>
      <div id="itemZone" style="width:min(560px,100%)"></div></div></div>`;
    S_lobbyZone();
    if (S.myItem) S_watchItem(S.myItem);
    return;
  }
  if (st.phase === 'intro' || st.phase === 'show') {
    if (st.phase === 'intro') S.rdRound = -9;
    S_loadRound(r);
    if (st.phase === 'show' && st.rev) {
      app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
        <div class="revBig">🔄</div><div class="revText pop">리버스!</div>
        <div class="rule">마지막 물건부터 거꾸로! 준비~</div></div></div>`;
      return;
    }
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
      <span class="roundBadge">${cfg.emoji} ${esc(roundLabel(cfg))}</span>
      <div class="bigEmoji bounce">👀</div>
      <div class="title" style="font-size:40px">${st.phase === 'intro' ? '곧 시작해요!' : '칠판을 보세요!'}</div>
      <div class="rule">${st.phase === 'show' ? (cfg.flash ? '⚡ 휙휙 지나가요! 집중! 🧠' : '새 물건이 나와요! 외워요 🧠') : esc(cfg.desc)}</div>
    </div></div>`;
    return;
  }
  if (st.phase === 'answer') {
    await S_loadRound(r);
    const sk = r + ':' + st.si;
    if (S.stepKey !== sk) {
      S.stepKey = sk; S.done = false; S.locked = false;
      S.opts = shuffle([...S.rd.chain.slice(0, st.k).map(id => ({ id, text: S.rd.labels[id] })), ...(S.rd.decoys || [])]);
      const ex = (await get(ref(db, `rooms/${S.code}/picks/${r}/${st.si}/${S.pid}`))).val();
      S.list = (ex && ex.list) || [];
      S.done = !!(ex && ex.doneAt);
      if (!ex) set(ref(db, `rooms/${S.code}/picks/${r}/${st.si}/${S.pid}/list`), []);
    }
    S_answerShell();
    return;
  }
  if (st.phase === 'check') {
    await S_loadRound(r);
    const allRes = (await get(ref(db, `rooms/${S.code}/rounds/${r}/res`))).val() || {};
    const res = allRes[st.si] && allRes[st.si][S.pid];
    let streak = 0; for (let j = st.si; j >= 0; j--) { const x = allRes[j] && allRes[j][S.pid]; if (x && x.perfect) streak++; else break; }
    if (S.stepKey !== r + ':' + st.si) S.list = [];
    const ps = (await get(ref(db, `rooms/${S.code}/players`))).val() || {};
    const sorted = Object.entries(ps).filter(([, p]) => (p.total || 0) > 0).sort((a, b) => b[1].total - a[1].total);
    const myIdx = sorted.findIndex(([pid]) => pid === S.pid);
    const rank = myIdx >= 0 ? sorted.filter(([, p]) => p.total > sorted[myIdx][1].total).length + 1 : 0;
    S_checkView(r, st, res, streak, rank);
    return;
  }
  if (st.phase === 'result') {
    const rr = (await get(ref(db, `rooms/${S.code}/rounds/${r}`))).val() || {};
    S_resultView(r, rr);
    return;
  }
  if (st.phase === 'end') {
    const ps = (await get(ref(db, `rooms/${S.code}/players`))).val() || {};
    const inTop = Object.entries(ps).sort((a, b) => (b[1].total || 0) - (a[1].total || 0)).slice(0, 5).some(([pid]) => pid === S.pid);
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
      <div class="bigEmoji bounce">🎉</div><div class="title">시장 <span>폐장!</span></div>
      <div class="muted" style="font-size:22px">내 최종 점수</div>
      <div class="score">${(S.me && S.me.total) || 0}점</div>
      ${inTop ? '<div class="hl">🏆 TOP 5 안에 들었어요!</div>' : '<div class="hl mint">끝까지 함께해서 최고였어요 🙌</div>'}
      ${(S.me && S.me.breakerTotal) ? `<div class="hl lav">💥 내 물건으로 친구들을 ${S.me.breakerTotal}번 헷갈리게 했어요!</div>` : ''}
    </div></div>`;
  }
}

function S_watchItem(id){
  onValue(ref(db, `rooms/${S.code}/items/${id}`), s => {
    if (!s.exists() && S.myItem === id) {
      S.myItem = null; localStorage.removeItem(`market_item_${S.code}_${S.pid}`);
      if (S.state && S.state.phase === 'lobby') { S_lobbyZone(); toast('선생님이 물건을 지웠어요. 다른 걸로 넣어 볼까요?'); }
    }
  });
}

function S_lobbyZone(){
  const z = el('itemZone'); if (!z) return;
  if (S.myItem) {
    get(ref(db, `rooms/${S.code}/items/${S.myItem}`)).then(s => {
      const it = s.val(); if (!it || !el('itemZone')) return;
      el('itemZone').innerHTML = `<div class="card center"><div class="muted">내가 넣은 물건</div>
        <div class="itemCard pop" style="font-size:54px;padding:20px;margin:14px auto;min-width:0">${esc(it.text)}</div>
        <div class="rule bounce">친구들 기다리는 중... ⏳</div></div>`;
    });
    return;
  }
  z.innerHTML = `<div class="card" style="display:grid;gap:12px">
    <div class="rule">시장에 가면 ___ 도 있고~</div>
    <input class="field" id="itemInput" maxlength="12" placeholder="예) 치킨, 교감선생님, 고무장갑">
    <div class="muted">먹을 거, 물건, 사람 다 OK! 엉뚱할수록 친구들이 헷갈려서 💥브레이커 점수를 받아요</div>
    <button class="btn big" data-act="addItem">시장에 넣기 🧺</button></div>`;
  el('itemInput').addEventListener('keydown', e => { if (e.key === 'Enter') S_addItem(); });
}

async function S_addItem(){
  const inp = el('itemInput'); if (!inp) return;
  const v = inp.value.trim();
  if (!v) { toast('물건을 써 주세요'); return; }
  const n = norm(v);
  if (!n) { toast('다른 걸로 써 볼까요?'); return; }
  if (S.state.phase !== 'lobby') { toast('이미 게임이 시작됐어요!'); return; }
  const id = rid();
  const tx = await runTransaction(ref(db, `rooms/${S.code}/norms/${n}`), cur => cur === null ? id : undefined);
  if (!tx.committed) { toast('앗! 이미 누가 시장에 넣었어요 😮 다른 걸로!'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
  await set(ref(db, `rooms/${S.code}/items/${id}`), { text: v, norm: n, author: S.name, pid: S.pid, at: serverTimestamp() });
  S.myItem = id; localStorage.setItem(`market_item_${S.code}_${S.pid}`, id);
  S_watchItem(id);
  S_lobbyZone();
}

function S_answerShell(){
  const st = S.state, cfg = ROUNDS[st.round];
  app.innerHTML = `<div class="s-wrap">${S_top()}
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="roundBadge${st.rev ? ' rev' : ''}" style="font-size:18px">${st.rev ? '🔄 리버스!' : esc(roundLabel(cfg))} · 물건 ${st.k}개</span>
      <span class="rule" style="font-size:20px">${st.rev ? '⬅️ 마지막 물건부터 거꾸로!' : cfg.flash ? '⚡ 기억나는 대로 와다다!' : cfg.typing ? '✍️ 처음부터 순서대로 써요!' : '👆 처음부터 순서대로!'}</span>
      <span style="margin-left:auto;font-size:26px;color:var(--pinkD)" id="sTime"></span>
    </div>
    <div class="bar" id="sBar" style="margin:10px 0"><i></i></div>
    <div id="ansArea"></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn sm lemon" id="hintBtn" data-act="hint">💡 힌트 (라운드에 1번)</button>
      ${cfg.typing ? '' : '<button class="btn sm sky" id="undoBtn" data-act="undo">↩️ 하나 빼기</button>'}
      <button class="btn mint" id="submitBtn" data-act="submit" style="margin-left:auto">다 했어요! ✅</button>
    </div>
    <div class="muted" style="margin-top:8px">${cfg.flash ? '쓰고 엔터! 순서는 몰라도 OK · 본 순서대로 쓰면 보너스 · 쓴 걸 누르면 빠져요' : cfg.typing ? '기억나는 칸만 써도 점수를 받아요 · 오타 1글자는 봐줘요' : '채운 칸을 누르면 빠져요 · 순서가 헷갈려도 기억나는 물건은 다 눌러요!'}</div>
    <div id="doneArea"></div></div>`;
  S_drawAnswer();
}

function S_drawAnswer(){
  const st = S.state, area = el('ansArea'); if (!area || !S.rd) return;
  const cfg = ROUNDS[st.round], k = st.k, lock = S.done || S.locked;
  if (cfg.flash) {
    if (!el('wIn')) {
      area.innerHTML = `<div class="rule" id="wCount" style="font-size:22px;margin-top:10px"></div>
        <div class="slots" id="wList"></div>
        <div style="display:flex;gap:10px"><input class="field" id="wIn" maxlength="14" autocomplete="off" placeholder="기억나는 물건 쓰고 엔터! ⏎"><button class="btn mint" data-act="wAdd">➕</button></div>`;
      el('wIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); S_wAdd(); } });
      setTimeout(() => el('wIn') && el('wIn').focus(), 50);
    }
    el('wList').innerHTML = S.list.map((v, i) => `<div class="slot f" ${lock ? '' : `data-act="unslot" data-i="${i}"`}><span class="k">${i + 1}</span>${esc(v)}</div>`).join('');
    el('wCount').innerHTML = `${k}개 중 <b style="color:var(--pinkD)">${S.list.length}개</b> 썼어요!`;
    el('wIn').disabled = lock;
  } else if (cfg.typing) {
    if (area.querySelectorAll('.tin').length !== k) {
      area.innerHTML = `<div class="tgrid">${Array.from({ length: k }, (_, i) => `<div><div class="tlab">${i + 1}번째</div>
        <input class="tin" data-i="${i}" maxlength="14" autocomplete="off" value="${esc(S.list[i] || '')}"></div>`).join('')}</div>`;
      let tm;
      area.querySelectorAll('.tin').forEach(inp => inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { S.list = S_collect(); S_save(); }, 400); }));
    }
    area.querySelectorAll('.tin').forEach(inp => inp.disabled = lock);
  } else {
    const lab = id => (S.opts.find(o => o.id === id) || {}).text || '';
    const slots = Array.from({ length: k }, (_, i) => {
      const v = S.list[i];
      const cls = v ? 'slot f' : i === S.list.length ? 'slot cur' : 'slot';
      return `<div class="${cls}" ${v && !lock ? `data-act="unslot" data-i="${i}"` : ''}><span class="k">${i + 1}번째</span>${v ? esc(lab(v)) : '?'}</div>`;
    }).join('');
    const opts = S.opts.map(o => `<button class="opt${S.list.includes(o.id) ? ' used' : ''}" data-act="pick" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join('');
    area.innerHTML = `<div class="slots">${slots}</div>${lock ? '' : `<div class="opts">${opts}</div>`}`;
  }
  const hb = el('hintBtn'); if (hb) { hb.disabled = S.hintRound === st.round || lock; if (S.hintRound === st.round) hb.textContent = '💡 힌트 사용함'; }
  const ub = el('undoBtn'); if (ub) ub.disabled = lock || S.list.length === 0;
  const sb = el('submitBtn'); if (sb) sb.disabled = lock;
  const da = el('doneArea');
  if (da) da.innerHTML = S.done ? '<div class="doneBox pop">제출 완료! 🎉<br><span style="font-size:20px">칠판을 보며 기다려요</span></div>'
                      : S.locked ? '<div class="doneBox pop" style="background:var(--lemon)">시간 끝! ⏰<br><span style="font-size:20px">고른 만큼 점수를 받아요</span></div>' : '';
}

function S_collect(){ const v = []; document.querySelectorAll('.tin').forEach(inp => v[+inp.dataset.i] = inp.value.trim()); return v; }
function S_save(){ set(ref(db, `rooms/${S.code}/picks/${S.state.round}/${S.state.si}/${S.pid}/list`), S.list); }
function S_pick(id){
  if (S.done || S.locked || !S.rd) return;
  if (S.list.includes(id) || S.list.length >= S.state.k) return;
  S.list.push(id); S_save(); S_drawAnswer();
}
function S_unslot(i){ if (S.done || S.locked) return; S.list.splice(i, 1); S_save(); S_drawAnswer(); }
function S_wAdd(){
  const inp = el('wIn'); if (!inp || S.done || S.locked) return;
  const v = inp.value.trim(); if (!v) return;
  if (S.list.some(x => fuzzyEq(x, v))) { toast('이미 썼어요! 다른 거 ✍️'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); return; }
  if (S.list.length >= S.state.k) { toast(`${S.state.k}개 다 썼어요! 다 했으면 제출 ✅`); return; }
  S.list.push(v); inp.value = ''; S_save(); S_drawAnswer(); inp.focus();
}
function S_undo(){ if (S.done || S.locked || !S.list.length) return; S.list.pop(); S_save(); S_drawAnswer(); }
function S_submit(){
  if (S.done || S.locked) return;
  const cfgS = ROUNDS[S.state.round];
  if (cfgS.flash) { if (el('wIn') && el('wIn').value.trim()) S_wAdd(); }
  else if (cfgS.typing) S.list = S_collect();
  const filled = S.list.filter(Boolean).length;
  if (!filled) { toast('하나라도 골라 볼까요?'); return; }
  if (filled < S.state.k && !confirm('아직 빈 칸이 있어요. 그래도 낼까요?')) return;
  S_save();
  set(ref(db, `rooms/${S.code}/picks/${S.state.round}/${S.state.si}/${S.pid}/doneAt`), serverTimestamp());
  S.done = true; S_drawAnswer();
}
function S_hint(){
  const st = S.state, cfg = ROUNDS[st.round];
  if (S.hintRound === st.round || S.done || S.locked || !S.rd) return;
  const target = targetOf(S.rd, st.k, st.rev);
  let idx;
  if (cfg.flash) {
    const { hit } = gradeList(target, S.rd.labels, S.list, true);
    idx = hit.findIndex(h => !h); if (idx < 0) { toast('벌써 다 썼어요! 👍'); return; }
    const text = S.rd.labels[target[idx]] || '';
    S.hintRound = st.round;
    toast(`💡 아직 안 쓴 것 중에 '${text.charAt(0)}'(으)로 시작하는 게 있어요! (${text.length}글자)`);
    S_drawAnswer(); return;
  }
  if (cfg.typing) { const v = S_collect(); idx = target.findIndex((_, i) => !v[i]); if (idx < 0) idx = target.length - 1; }
  else idx = S.list.length;
  if (idx >= target.length) return;
  const text = S.rd.labels[target[idx]] || '';
  S.hintRound = st.round;
  toast(`💡 ${idx + 1}번째는 '${text.charAt(0)}'(으)로 시작해요! (${text.length}글자)`);
  S_drawAnswer();
}

function S_tick(){
  const st = S.state; if (!st || st.phase !== 'answer' || !S.rd) return;
  const rem = st.answerEndsAt - now(), lim = answerSec(ROUNDS[st.round], st.k, st.rev) * 1000;
  const t = el('sTime'), bar = el('sBar');
  if (t) t.textContent = '⏱ ' + Math.max(0, Math.ceil(rem / 1000)) + '초';
  if (bar) { bar.firstElementChild.style.width = Math.max(0, Math.min(100, rem / lim * 100)) + '%'; bar.classList.toggle('hurry', rem < 6000); }
  if (rem <= 0 && !S.locked && !S.done) {
    if (ROUNDS[st.round].flash) { if (el('wIn') && el('wIn').value.trim()) S_wAdd(); }
    else if (ROUNDS[st.round].typing) { S.list = S_collect(); S_save(); }
    S.locked = true; S_drawAnswer();
  }
}

function S_checkView(r, st, res, streak, rank){
  const cfg = ROUNDS[r], target = targetOf(S.rd, st.k, st.rev);
  if (!res || res.absent) {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage"><div class="bigEmoji">☕</div>
      <div class="rule">이번 단계는 쉬었어요. 칠판으로 정답을 봐요!</div></div></div>`;
    return;
  }
  const list = S.list || [];
  const lab = v => cfg.typing ? v : ((S.rd.labels && S.rd.labels[v]) || ((S.rd.decoys || []).find(d => d.id === v) || {}).text || '');
  const slots = cfg.flash
    ? target.map((id, i) => { const ok = res.hit && res.hit[i]; return `<div class="slot ${ok ? 'ok' : 'bad'}"><span class="k">${i + 1}번째 ${ok ? '✅ 기억함' : '❌ 놓침'}</span>${esc(S.rd.labels[id])}</div>`; }).join('')
    : target.map((id, i) => {
    const ok = res.flags && res.flags[i];
    return `<div class="slot ${ok ? 'ok' : 'bad'}"><span class="k">${i + 1}번째 ${ok ? '✅' : '❌'}</span>${list[i] ? esc(lab(list[i])) : '—'}${ok ? '' : `<span class="ca">정답: ${esc(S.rd.labels[id])}</span>`}</div>`;
  }).join('');
  const last = st.si >= (S.rd.plan || []).length - 1;
  app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="gap:10px;min-height:auto;margin-top:20px">
    <div class="title" style="font-size:38px">${res.perfect ? '완벽해요! 🌟' : res.inc ? '좋아요! 👍' : '괜찮아요, 다음에 또! 💪'}</div>
    ${streak >= 2 && !cfg.flash ? `<div class="hot">🔥 ${streak}단계 연속 완벽!</div>` : ''}
    ${rank >= 1 && rank <= 3 && !cfg.practice ? `<div class="hot lead">${['🥇', '🥈', '🥉'][rank - 1]} 지금 ${rank}등!</div>` : ''}
    <div class="rule">기억한 물건 <b style="color:var(--pinkD)">${res.inc}개</b> · 순서까지 <b style="color:var(--pinkD)">${res.pos}개</b></div>
    <div class="slots" style="justify-content:center">${slots}</div>
    ${cfg.practice ? '<div class="muted" style="font-size:20px">연습이라 점수는 없어요</div>' : `<div class="score" style="font-size:44px">+${res.score}점</div>`}
    <div class="muted" style="font-size:20px">${last ? '라운드 끝! 칠판을 보세요 👀' : st.rev ? '이제 다시 앞으로! 칠판을 보세요 👀' : '다음엔 또 늘어나요! 칠판을 보세요 👀'}</div>
  </div></div>`;
}

function S_resultView(r, rr){
  const cfg = ROUNDS[r];
  if (cfg.practice) {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage"><div class="bigEmoji bounce">🧪</div>
      <div class="title" style="font-size:40px">연습 끝!</div><div class="rule">이제 진짜 시작이에요 💪</div></div></div>`;
    return;
  }
  const sum = (rr.sum && rr.sum[S.pid]) || 0, brk = (rr.brk && rr.brk[S.pid]) || 0;
  const lucky = (rr.luck || []).includes(S.pid);
  app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="gap:10px">
    <span class="roundBadge">${cfg.emoji} ${esc(cfg.name)} 결과</span>
    ${lucky ? `<div class="luck"><div class="in"><div class="fa">🎴 ?</div><div class="ba">🍀 행운 카드!<span style="font-size:20px">이번 라운드 2배</span></div></div></div>` : ''}
    <div class="muted" style="font-size:22px">이번 라운드에서 받은 점수</div>
    <div class="score">+${sum}점</div>
    ${brk ? `<div class="hl lav">💥 내 물건 덕분에 친구들이 ${brk}번 헷갈렸어요! (브레이커 점수 포함)</div>` : ''}
    <div class="muted" style="font-size:20px">칠판에서 순위를 확인해요 👀</div>
  </div></div>`;
}

/* ---------------- 클릭 처리 ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'join') return S_join(el('jCode').value.trim(), el('jName').value.trim(), false);
  if (a === 'addItem') return S_addItem();
  if (a === 'pick') return S_pick(b.dataset.id);
  if (a === 'unslot') return S_unslot(+b.dataset.i);
  if (a === 'wAdd') return S_wAdd();
  if (a === 'undo') return S_undo();
  if (a === 'submit') return S_submit();
  if (a === 'hint') return S_hint();
  if (a === 'newRoom') return T_newRoom();
  if (a === 'resume') { location.href = location.pathname + '?t=1&room=' + b.dataset.code; return; }
  if (!room) return;
  const rerender = () => { tKey = ''; T_render(); };
  if (a === 'toggleNames') return update(ref(db, `rooms/${code}/state`), { showNames: !room.state.showNames });
  if (a === 'toggleMute') { Music.ensure(); Music.setMute(!Music.muted); return rerender(); }
  if (a === 'musicSynth') { Music.setMode('synth'); return rerender(); }
  if (a === 'musicFile') { if (!Music.audio) el('musicInput').click(); else { Music.setMode('file'); rerender(); } return; }
  if (a === 'musicPick') { el('musicInput').click(); return; }
  if (a === 'togglePause') { paused = !paused; return rerender(); }
  if (a === 'tgt') {
    const i = +b.dataset.r; targets[i] = Math.max(MIN_K, Math.min(MAX_K, targets[i] + (+b.dataset.d))); saveTargets();
    const t = el('tgt' + i); if (t) t.textContent = targets[i];
    if (room.state.phase === 'lobby') T_update();
    return;
  }
  if (a === 'revNext') return T_revNext();
  if (a === 'skipCheck') { skipCheck = true; paused = false; return; }
  if (a === 'newGame') { if (confirm('새 게임을 만들까요? (지금 방은 그대로 남아요)')) { loopGen++; Music.stop(); T_newRoom(); } return; }
  if (a === 'addReserve') {
    const used = new Set(Object.values(room.items || {}).map(i => i.norm));
    const upd = {}; let k = 0;
    for (const t of shuffle(RESERVE)) { const n = norm(t); if (used.has(n)) continue; const id = rid(); upd['items/' + id] = { text: t, norm: n, author: '선생님', pid: 'teacher', at: Date.now() }; upd['norms/' + n] = id; if (++k >= 5) break; }
    return update(ref(db, 'rooms/' + code), upd);
  }
  if (a === 'delItem') {
    const it = room.items && room.items[b.dataset.id]; if (!it) return;
    return update(ref(db, 'rooms/' + code), { ['items/' + b.dataset.id]: null, ['norms/' + it.norm]: null });
  }
  if (a === 'startRound') { Music.ensure(); return T_startRound(+b.dataset.r); }
  if (a === 'playRound') { Music.ensure(); return T_runRound(0); }
  if (a === 'resumeLoop') { Music.ensure(); return T_resume(); }
  if (a === 'closeNow') { forceClose = true; return; }
  if (a === 'toEnd') { loopGen++; looping = false; Music.stop(); return update(ref(db, `rooms/${code}/state`), { phase: 'end' }); }
});

/* ---------------- 시작 ---------------- */
if (isTeacher) T_init(); else S_init();
</script>
