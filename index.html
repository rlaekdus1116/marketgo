<!doctype html>
<html lang="ko">

<title>시장에 가면</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#FFF9F4; --ink:#5B4B57; --sub:#A3919C; --line:#F2E6EC; --card:#FFFFFF;
  --pink:#FFE3EA; --pinkD:#F4A9BD; --mint:#DDF5EA; --mintD:#8FD5B5;
  --lemon:#FFF5CC; --lemonD:#F2D477; --lav:#ECE5FF; --lavD:#B8A7EE;
  --sky:#E0F0FF; --skyD:#93C4EE; --peach:#FFE9DA; --peachD:#F5B48C; --red:#FFD9D9; --redD:#EE9A9A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua',sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#F6E3EA 1.4px,transparent 1.4px);background-size:22px 22px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
input{font-family:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.muted{color:var(--sub)} .center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 var(--line)}
.btn{background:var(--pink);border-radius:20px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 var(--pinkD);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}
.btn.lemon{background:var(--lemon);box-shadow:0 5px 0 var(--lemonD)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lavD)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.big{font-size:28px;padding:18px 36px}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lav{box-shadow:0 3px 0 var(--lavD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)}
.title{font-size:44px;margin:6px 0;letter-spacing:1px} .title span{color:var(--pinkD)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topbar .logo{font-size:26px;margin-right:auto}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lemon);border-radius:999px;padding:7px 8px 7px 14px;font-size:18px}
.chip small{color:var(--sub);font-size:13px}
.chip.soft{background:var(--sky);padding:6px 14px}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:15px;line-height:24px;padding:0}
.lobby{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:72px;letter-spacing:8px;color:var(--pinkD);line-height:1}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:14px}
h3{margin:0 0 12px;font-size:22px;font-weight:normal}
.stage{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.chant{font-size:50px;color:var(--sub)}
.itemCard{background:#fff;border:4px solid var(--pink);border-radius:40px;padding:30px 60px;font-size:96px;box-shadow:0 10px 0 var(--pinkD);min-width:50%}
.itemCard .tail{display:block;font-size:40px;color:var(--sub);margin-top:4px}
.author{font-size:30px;background:var(--lav);border-radius:999px;padding:6px 20px}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.beatRow{display:flex;gap:14px;justify-content:center}
.beatDot{width:30px;height:30px;border-radius:50%;background:var(--line);transition:transform .08s,background .08s}
.beatDot.on{transform:scale(1.35);background:var(--pinkD)} .beatDot.on.c{background:var(--mintD)}
.roundBadge{display:inline-block;background:var(--lemon);border-radius:999px;padding:8px 22px;font-size:24px;box-shadow:0 4px 0 var(--lemonD)}
.bigEmoji{font-size:110px;line-height:1}
.rule{font-size:28px;line-height:1.5}
.timer{font-size:110px;line-height:1;color:var(--pinkD)}
.bar{height:22px;background:var(--line);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mintD),var(--skyD));border-radius:999px;transition:width .2s linear}
.bar.hurry>i{background:linear-gradient(90deg,var(--peachD),var(--pinkD))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.chainRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ans{background:var(--sky);border-radius:20px;padding:12px 18px;font-size:30px;text-align:center}
.ans small{display:block;font-size:15px;color:var(--sub)}
.ans .n{display:inline-block;background:#fff;border-radius:50%;width:32px;height:32px;text-align:center;line-height:32px;font-size:16px;margin-right:6px}
.ans.new{background:var(--lemon);box-shadow:0 0 0 4px var(--lemonD)}
.rank{display:flex;align-items:center;gap:12px;font-size:26px;padding:8px 6px;border-bottom:2px dashed var(--line)}
.rank b{font-weight:normal;margin-left:auto;color:var(--pinkD)}
.medal{font-size:32px;width:42px;text-align:center}
.hl{background:var(--lemon);border-radius:20px;padding:14px 18px;font-size:22px;line-height:1.5;margin-top:12px}
.hl.lav{background:var(--lav)} .hl.mint{background:var(--mint)}

.s-wrap{max-width:1000px;margin:0 auto;padding:14px 14px 40px}
.s-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.s-top .me{margin-right:auto;font-size:20px}
.field{width:100%;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:#fff;outline:none}
.field:focus{border-color:var(--pinkD)}
.slots{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.slot{min-width:110px;padding:12px 14px;border-radius:18px;background:#fff;border:3px dashed var(--line);font-size:24px;text-align:center}
.slot .k{display:block;font-size:13px;color:var(--sub)}
.slot.f{border-style:solid;border-color:var(--mintD);background:var(--mint);cursor:pointer}
.slot.f::after{content:' ✕';font-size:14px;color:var(--sub)}
.slot.cur{border-color:var(--pinkD);border-style:solid;animation:blink 1s infinite}
.slot.ok{border-style:solid;border-color:var(--mintD);background:var(--mint)}
.slot.bad{border-style:solid;border-color:var(--redD);background:var(--red)}
.slot .ca{display:block;font-size:15px;color:var(--ink);margin-top:4px}
@keyframes blink{50%{background:var(--pink)}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px 8px;font-size:26px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.used{opacity:.25;pointer-events:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0}
.tin{width:100%;font-size:24px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;outline:none}
.tin:focus{border-color:var(--pinkD)}
.tlab{font-size:13px;color:var(--sub);margin:0 0 3px 6px}
.doneBox{background:var(--mint);border-radius:24px;padding:22px;font-size:28px;text-align:center;margin-top:14px}
.luck{perspective:800px;margin:16px auto;width:240px;height:150px}
.luck .in{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d;animation:flip 1s .4s forwards}
@keyframes flip{to{transform:rotateY(180deg)}}
.luck .fa,.luck .ba{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:30px;backface-visibility:hidden}
.luck .fa{background:var(--lav)} .luck .ba{background:var(--lemon);transform:rotateY(180deg);flex-direction:column}
.score{font-size:64px;color:var(--pinkD)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;border:3px solid var(--pinkD);border-radius:20px;padding:14px 22px;font-size:22px;z-index:99;box-shadow:0 6px 0 var(--pinkD);max-width:92vw;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
</style>
</head>

  let n = String(s || '').normalize('NFC').toLowerCase().replace(/[\s.,!?~'"`#$\[\]\/·\-_()^*:;]/g, '');

  const m = a.length, n = b.length; const d = Array.from({length:m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;

const Beat = {
  ctx:null, master:null, noise:null, bpm:90, next:0, idx:0, timer:null, cb:null, gen:0, muted:false,

  play(i, t){ if (this.muted) return; if (i % 2 === 0) this.kick(t); else this.clap(t); this.shaker(t + 30 / this.bpm); },
  kick(t){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.16);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + 0.3);
  },
  clap(t){
    const c = this.ctx;
    [0, 0.012, 0.024].forEach((d, k) => {
      const s = c.createBufferSource(); s.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8;
      const g = c.createGain(); const tt = t + d;
      g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(k === 2 ? 0.75 : 0.4, tt + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + (k === 2 ? 0.15 : 0.02));
      s.connect(f).connect(g).connect(this.master); s.start(tt); s.stop(tt + 0.2);
    });
  },
  shaker(t){
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + 0.08);
  },
  tone(freq, t, dur = 0.25, vol = 0.35){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  ding(){ if (this.muted || !this.ctx) return; const ns = [523.25, 587.33, 659.25, 783.99, 880]; const t = this.ctx.currentTime; this.tone(ns[Math.floor(Math.random() * 5)], t); this.tone(ns[Math.floor(Math.random() * 5)] * 2, t + 0.07, 0.2, 0.12); },
  fanfare(){ if (this.muted) return; this.ensure(); const t = this.ctx.currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, t + i * 0.11, 0.35, 0.3)); },
};
function beatVis(i){
  for (let k = 0; k < 4; k++) { const d = el('bd' + k); if (d) d.className = 'beatDot' + (k === i % 4 ? ' on' + (i % 2 ? ' c' : '') : ''); }
}
const beatRow = () => `<div class="beatRow">${[0,1,2,3].map(i => `<div class="beatDot" id="bd${i}"></div>`).join('')}</div>`;

/* 정답 채점 (보기 / 직접 쓰기 공통) */
function gradeList(target, labels, list, typing){
  const eq = (pick, id) => typing ? fuzzyEq(pick, labels[id]) : pick === id;
  const flags = target.map((id, i) => !!list[i] && eq(list[i], id));
  const used = new Set(); let inc = 0;
  for (const id of target) {
    const j = list.findIndex((p, i) => !used.has(i) && p && eq(p, id));
    if (j >= 0) { used.add(j); inc++; }
  }
  return { flags, inc, pos: flags.filter(Boolean).length };
}

function T_update(){
  const st = room.state, r = st.round;
  if (st.phase === 'lobby') {
    const items = Object.entries(room.items || {}).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));

      `<span class="chip">${esc(it.text)}<small>${esc(it.author)}</small><button class="x" data-act="delItem" data-id="${id}" title="지우기">×</button></span>`).join('')
      || '<p class="muted">학생들이 물건을 넣으면 여기에 쌓여요!</p>';
    const ps = Object.values(room.players || {});
    el('playerCount').textContent = ps.length + '명';
    el('playerChips').innerHTML = ps.map(p => `<span class="chip soft">${esc(p.name)}</span>`).join('') || '<p class="muted">아직 아무도 없어요</p>';
    const ok = items.length >= MIN_ITEMS;
    el('startBtn').disabled = !ok; el('practiceBtn').disabled = !ok;
    el('startHint').textContent = ok ? '이상한 물건은 × 로 지우고 시작하세요' : `물건이 ${MIN_ITEMS}개 이상 있어야 시작할 수 있어요 (예비 물건으로 채워도 돼요)`;
  }
  else if (st.phase === 'answer') {
    const total = Object.keys(room.players || {}).length;
    const picks = (room.picks && room.picks[r] && room.picks[r][st.step]) || {};
    const done = Object.values(picks).filter(p => p.doneAt).length;
    el('doneCount').textContent = `✅ ${done} / ${total}명 완료`;
  }
  else if (st.phase === 'check') {
    const rd = room.rounds[r], cfg = ROUNDS[r], k = st.step;
    const target = targetOf(rd, k, cfg.reverse);
    const miss = (rd.miss && rd.miss[k]) || {};
    const items = room.items || {};
    const newId = rd.chain[k - 1];
    el('checkBody').innerHTML = target.map((id, i) => `<div class="ans pop${id === newId ? ' new' : ''}"><span class="n">${i + 1}</span>${esc(rd.labels[id])}
      <small>${st.showNames && items[id] ? esc(items[id].author) + ' · ' : ''}${miss[id] ? '😵 ' + miss[id] + '명 깜빡' : '👍 다 맞힘'}</small></div>`).join('');
    const vals = Object.values((rd.steps && rd.steps[k]) || {}).filter(x => !x.absent);

    el('checkInfo').innerHTML = `🌟 순서까지 완벽: <b>${perfect}명</b> / ${vals.length}명` + (k < rd.chain.length ? ' · 다음엔 하나 더!' : ' · 라운드 끝!');
  }
  else if (st.phase === 'result') el('resultBody').innerHTML = T_resultHTML();
  else if (st.phase === 'end') el('endBody').innerHTML = T_endHTML();
}

function T_tick(){
  if (!room || room.state.phase !== 'answer') return;
  const st = room.state, rem = st.answerEndsAt - now(), lim = answerSec(ROUNDS[st.round], st.step) * 1000;
  const t = el('tTimer'), bar = el('tBar');
  if (t) t.textContent = Math.max(0, Math.ceil(rem / 1000));
  if (bar) { bar.firstElementChild.style.width = Math.max(0, Math.min(100, rem / lim * 100)) + '%'; bar.classList.toggle('hurry', rem < 6000); }
}

function makeTraps(seqTexts, usedNorms, k){
  const out = [], used = new Set(usedNorms), cands = [];
  for (const t of shuffle(seqTexts)) { const list = LOOK[norm(t)]; if (list) cands.push(...list); }
  for (const c of shuffle(cands)) { if (out.length >= k) break; const n = norm(c); if (!used.has(n)) { used.add(n); out.push(c); } }
  const pre = ['왕', '미니', '꼬마', '황금', '아기'];
  for (let g = 0; out.length < k && g < 200; g++) {
    const c = pre[Math.floor(Math.random() * pre.length)] + seqTexts[Math.floor(Math.random() * seqTexts.length)];
    const n = norm(c); if (!used.has(n)) { used.add(n); out.push(c); }
  }
  return out;
}

async function T_startRound(r){
  if (starting) return; starting = true;
  try {
    loopGen++; looping = false; Beat.stop();
    const cfg = ROUNDS[r], items = room.items || {}, ids = Object.keys(items);
    const usage = {};
    Object.entries(room.rounds || {}).forEach(([rr, rd]) => { if (+rr > 0) (rd.chain || []).forEach(id => usage[id] = (usage[id] || 0) + 1); });
    const ordered = shuffle(ids).sort((a, b) => (usage[a] || 0) - (usage[b] || 0));
    const len = Math.max(cfg.start, Math.min(cfg.max, ids.length - cfg.others));
    const chain = shuffle(ordered.slice(0, len));
    const labels = {}; chain.forEach(id => labels[id] = items[id].text);
    const others = shuffle(ids.filter(id => !chain.includes(id))).slice(0, cfg.others);
    const traps = makeTraps(chain.map(id => items[id].text), ids.map(id => items[id].norm), cfg.traps);
    const decoys = [...others.map(id => ({ id, text: items[id].text })), ...traps.map((t, i) => ({ id: 'trap' + i, text: t }))];
    const pids = Object.keys(room.players || {});
    const luck = (cfg.practice || cfg.bonus) ? [] : shuffle(pids).slice(0, Math.max(1, Math.round(pids.length / 8)));
    paused = false;
    await update(ref(db, 'rooms/' + code), {
      ['rounds/' + r]: { chain, labels, decoys, luck, start: cfg.start },
      ['picks/' + r]: null,
      'state/phase': 'intro', 'state/round': r, 'state/step': 0, 'state/answerEndsAt': 0,
    });
  } finally { starting = false; }
}

/* 라운드 진행: 보여주기 → 답하기 → 정답 확인 → 하나 더 ... */
async function T_runRound(fromStep){
  const g = ++loopGen; looping = true; forceClose = false;
  const r = room.state.round, cfg = ROUNDS[r];
  Beat.start(cfg.bpm, beatVis);
  tKey = ''; T_render();
  const alive = () => g === loopGen;
  try {
    const len = room.rounds[r].chain.length;
    for (let k = fromStep; k <= len; k++) {
      if (!alive()) return;
      await T_show(r, k, alive);
      if (!alive()) return;
      await T_answer(r, k, alive);
      if (!alive()) return;
      await T_score(r, k);
      await sleep(CHECK_MS);
      while (paused && alive()) await sleep(300);
    }
    if (!alive()) return;
    Beat.stop();
    await update(ref(db, `rooms/${code}/state`), { phase: 'result' });
    Beat.fanfare();
  } finally { if (g === loopGen) { looping = false; tKey = ''; if (room) T_render(); } }
}

async function T_show(r, k, alive){
  const rd = room.rounds[r];
  await update(ref(db, `rooms/${code}/state`), { phase: 'show', step: k });
  const newIds = k === rd.start ? rd.chain.slice(0, k) : [rd.chain[k - 1]];
  const chant = () => el('chant'), slot = () => el('itemSlot');
  if (chant()) chant().textContent = '시장에 가면~';
  if (slot()) slot().innerHTML = k === rd.start ? '<div class="bigEmoji pop">🧺</div>' : `<div class="rule pop">지금까지 물건 ${k - 1}개! 그리고...</div>`;
  await sleep(1500);
  for (let i = 0; i < newIds.length; i++) {
    if (!alive()) return;
    const id = newIds[i], last = (k === rd.chain.length) && i === newIds.length - 1;
    const author = (room.items && room.items[id] && room.items[id].author) || '';
    if (slot()) slot().innerHTML = `<div class="itemCard pop">${esc(rd.labels[id])}<span class="tail">${last ? '도 있다!' : '도 있고~'}</span></div>
      ${room.state.showNames && author ? `<div class="author pop">by ${esc(author)}</div>` : ''}`;
    Beat.ding();
    await sleep(SHOW_MS);
  }
  if (slot()) slot().innerHTML = '<div class="bigEmoji pop">🤔</div><div class="rule">자, 처음부터 기억나니?</div>';
  await sleep(1200);
}

async function T_answer(r, k, alive){
  forceClose = false;
  await update(ref(db, `rooms/${code}/state`), { phase: 'answer', step: k, answerEndsAt: now() + answerSec(ROUNDS[r], k) * 1000 });
  while (alive()) {
    const st = room.state;
    const total = Object.keys(room.players || {}).length;
    const picks = (room.picks && room.picks[r] && room.picks[r][k]) || {};
    const done = Object.values(picks).filter(p => p.doneAt).length;
    if (forceClose || now() > st.answerEndsAt + 600 || (total > 0 && done >= total)) break;
    await sleep(250);
  }
}

async function T_score(r, k){
  const R = (await get(ref(db, 'rooms/' + code))).val();
  const rd = R.rounds[r], cfg = ROUNDS[r];
  if (rd.steps && rd.steps[k]) { await update(ref(db, `rooms/${code}/state`), { phase: 'check', step: k }); return; }
  const items = R.items || {}, players = R.players || {}, picks = (R.picks && R.picks[r] && R.picks[r][k]) || {};
  const target = targetOf(rd, k, cfg.reverse);
  const miss = {}; target.forEach(id => miss[id] = 0);
  const res = {};
  for (const pid of Object.keys(players)) {
    const p = picks[pid];
    if (!p) { res[pid] = { absent: true, score: 0, breaker: 0 }; continue; }
    const list = p.list || [];
    const { flags, inc, pos } = gradeList(target, rd.labels, list, !!cfg.typing);
    const perfect = pos === k;
    flags.forEach((f, i) => { const id = target[i]; if (!f && items[id] && items[id].pid !== pid) miss[id]++; });
    const speed = (perfect && p.doneAt) ? Math.min(SPEED_MAX, Math.max(0, Math.floor((R.state.answerEndsAt - p.doneAt) / 2000))) : 0;
    const base = (inc * PT_ITEM + pos * PT_POS + (perfect ? PT_PERFECT : 0) + speed) * cfg.mult;
    res[pid] = { inc, pos, perfect, speed, base, flags, breaker: 0, lucky: (rd.luck || []).includes(pid), score: 0 };
  }
  if (!cfg.practice) target.forEach(id => { const a = items[id] && items[id].pid; if (a && res[a]) res[a].breaker += miss[id] * BREAKER_PER; });
  const upd = {};
  for (const [pid, x] of Object.entries(res)) {
    x.score = cfg.practice ? 0 : ((x.base || 0) + x.breaker) * (x.lucky ? 2 : 1);
    upd[`rounds/${r}/sum/${pid}`] = ((rd.sum && rd.sum[pid]) || 0) + x.score;
    upd[`rounds/${r}/brk/${pid}`] = ((rd.brk && rd.brk[pid]) || 0) + x.breaker;
    if (!cfg.practice) {
      upd[`players/${pid}/total`] = (players[pid].total || 0) + x.score;
      upd[`players/${pid}/breakerTotal`] = (players[pid].breakerTotal || 0) + x.breaker;
    }
  }
  if (!cfg.practice) for (const id of target) upd['missTotal/' + id] = ((R.missTotal && R.missTotal[id]) || 0) + miss[id];
  upd[`rounds/${r}/steps/${k}`] = res;
  upd[`rounds/${r}/miss/${k}`] = miss;
  upd['state/phase'] = 'check'; upd['state/step'] = k;
  await update(ref(db, 'rooms/' + code), upd);
}

function T_resume(){
  const st = room.state;
  if (st.phase === 'check') {
    const len = room.rounds[st.round].chain.length;
    if (st.step >= len) { update(ref(db, `rooms/${code}/state`), { phase: 'result' }); return; }
    T_runRound(st.step + 1);
  } else T_runRound(Math.max(st.step || 0, room.rounds[st.round].start));
}

function topPlayers(n = 5){
  return Object.entries(room.players || {}).map(([pid, p]) => ({ pid, ...p, total: p.total || 0 }))
    .sort((a, b) => b.total - a.total).slice(0, n);
}
const MEDAL = ['🥇', '🥈', '🥉', '🎀', '🌷'];

function T_resultHTML(){
  const r = room.state.round, cfg = ROUNDS[r], rd = room.rounds[r];
  const players = room.players || {}, items = room.items || {};
  const ans = rd.chain.map((id, i) => `<div class="ans"><span class="n">${i + 1}</span>${esc(rd.labels[id])}${room.state.showNames && items[id] ? `<small>${esc(items[id].author)}</small>` : ''}</div>`).join('');
  if (cfg.practice) {
    return `<div class="stage" style="min-height:auto"><div class="bigEmoji bounce">🧪</div><div class="title">연습 <span>끝!</span></div>
      <div class="rule">이제 진짜로 해 볼까요?</div><div class="chainRow">${ans}</div></div>
      <div class="center" style="margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <button class="btn big lav" data-act="startRound" data-r="0">🧪 한 번 더 연습</button>
        <button class="btn big mint" data-act="startRound" data-r="1">1라운드 시작 ▶</button></div>`;
  }
  const missAll = {}; Object.values(rd.miss || {}).forEach(m => Object.entries(m).forEach(([id, v]) => missAll[id] = (missAll[id] || 0) + v));
  let worst = null; Object.keys(missAll).forEach(id => { if (!worst || missAll[id] > missAll[worst]) worst = id; });
  const lucky = (rd.luck || []).map(pid => players[pid] && players[pid].name).filter(Boolean);
  const ranks = topPlayers().map((p, i) => `<div class="rank"><span class="medal">${MEDAL[i]}</span>${esc(p.name)}<b>${p.total}점</b></div>`).join('');
  const next = ROUNDS[r + 1];
  let buttons;
  if (next && !next.bonus) buttons = `<button class="btn big mint" data-act="startRound" data-r="${r + 1}">${r + 1}라운드 ▶ ${next.emoji} ${esc(next.name)}</button>`;
  else if (next && next.bonus) buttons = `<button class="btn big lav" data-act="startRound" data-r="${r + 1}">${next.emoji} ${esc(next.name)}</button>
      <button class="btn big lemon" data-act="toEnd">🎉 최종 결과 보기</button>`;
  else buttons = `<button class="btn big lemon" data-act="toEnd">🎉 최종 결과 보기</button>`;
  return `<div class="center" style="margin-bottom:14px"><span class="roundBadge">${roundLabel(r, cfg)} 결과 · ${esc(cfg.name)}</span></div>
    <div class="grid2">
      <div class="card"><h3>🧺 이번 시장 물건</h3><div class="chainRow" style="justify-content:flex-start">${ans}</div></div>
      <div class="card"><h3>🏆 TOP 5</h3>${ranks || '<p class="muted">아직 없어요</p>'}
        ${lucky.length ? `<div class="hl">🍀 <b>행운 카드!</b> ${lucky.map(esc).join(', ')} — 이번 라운드 점수 2배!</div>` : ''}
        ${worst && missAll[worst] > 0 && items[worst] ? `<div class="hl lav">💥 <b>기억 브레이커</b> ${room.state.showNames ? esc(items[worst].author) + '의 ' : ''}'${esc(items[worst].text)}' — ${missAll[worst]}번 깜빡했어요!</div>` : ''}
      </div>
    </div>
    <div class="center" style="margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap">${buttons}</div>`;
}

function T_endHTML(){
  const players = room.players || {}, items = room.items || {}, mt = room.missTotal || {};
  const top = topPlayers();
  const brk = Object.values(players).filter(p => (p.breakerTotal || 0) > 0).sort((a, b) => (b.breakerTotal || 0) - (a.breakerTotal || 0))[0];
  const worst3 = Object.entries(mt).filter(([id, v]) => items[id] && v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return `<div class="stage" style="min-height:auto"><div class="bigEmoji bounce">🎉</div><div class="title">시장 <span>폐장!</span></div></div>
    <div class="grid2" style="margin-top:10px">
      <div class="card"><h3>🏆 최종 TOP 5</h3>${top.map((p, i) => `<div class="rank"><span class="medal">${MEDAL[i]}</span>${esc(p.name)}<b>${p.total}점</b></div>`).join('')}</div>
      <div class="card"><h3>✨ 특별상</h3>
        ${brk ? `<div class="hl lav">💥 <b>기억 브레이커 왕</b><br>${esc(brk.name)} — 친구들을 ${brk.breakerTotal}번 헷갈리게 했어요!</div>` : ''}
        ${worst3.length ? `<div class="hl">😵 <b>가장 많이 깜빡한 물건</b><br>${worst3.map(([id, v], i) => `${i + 1}. ${esc(items[id].text)} (${v}번)`).join('<br>')}</div>` : ''}
      </div>
    </div>`;
}

/* =========================================================
   🧒 학생 화면
   ========================================================= */
const S = { code: params.get('room') || '', pid: null, name: '', state: null, me: null, rd: null, rdRound: -9,
            list: [], stepKey: '', opts: [], hintRound: -9, done: false, locked: false, view: '', myItem: null };

function S_init(){
  app.innerHTML = `<div class="s-wrap"><div class="stage">
    <div class="bigEmoji bounce">🧺</div>
    <div class="title">시장에 <span>가면</span></div>
    <div class="card" style="width:min(460px,100%);display:grid;gap:12px">
      <input class="field" id="jCode" inputmode="numeric" maxlength="4" placeholder="입장 코드 4자리" value="${esc(S.code)}">
      <input class="field" id="jName" maxlength="8" placeholder="내 이름" value="${esc(localStorage.getItem('market_name') || '')}">
      <button class="btn big mint" data-act="join">들어가기 🚪</button>
    </div>
  </div></div>`;
}

async function S_join(){
  const c = el('jCode').value.trim(), name = el('jName').value.trim();
  if (!/^\d{4}$/.test(c)) { toast('입장 코드 4자리를 써 주세요'); return; }
  if (!name) { toast('이름을 써 주세요'); return; }
  const st = await get(ref(db, 'rooms/' + c + '/state'));
  if (!st.exists()) { toast('그런 방이 없어요 😢 코드를 확인해 주세요'); return; }
  S.code = c; S.name = name; localStorage.setItem('market_name', name);
  let pid = localStorage.getItem('market_pid_' + c);
  if (!pid) { pid = rid(); localStorage.setItem('market_pid_' + c, pid); }
  S.pid = pid;
  const pref = ref(db, `rooms/${c}/players/${pid}`);
  const ex = await get(pref);
  if (ex.exists()) await update(pref, { name });
  else await set(pref, { name, total: 0, breakerTotal: 0, joinedAt: serverTimestamp() });
  S.myItem = localStorage.getItem(`market_item_${c}_${pid}`);
  onValue(pref, s => { S.me = s.val(); const t = el('myTotal'); if (t && S.me) t.textContent = (S.me.total || 0) + '점'; });
  onValue(ref(db, `rooms/${c}/state`), s => { S.state = s.val(); S_render(); });
  setInterval(S_tick, 200);
}

const S_top = () => `<div class="s-top"><span class="me">🙂 ${esc(S.name)}</span><span class="pill">⭐ <span id="myTotal">${(S.me && S.me.total) || 0}점</span></span></div>`;

async function S_loadRound(r){
  if (S.rdRound === r && S.rd) return;
  S.rd = (await get(ref(db, `rooms/${S.code}/rounds/${r}`))).val(); S.rdRound = r;
}

async function S_render(){
  const st = S.state; if (!st) return;
  const key = st.phase + ':' + st.round + ':' + st.step;
  if (key === S.view) return;
  S.view = key;
  const r = st.round, cfg = ROUNDS[r];
  if (st.phase === 'lobby') {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="min-height:70vh">
      <div class="title" style="font-size:36px">시장에 무엇을 넣을까? 🧺</div>
      <div id="itemZone" style="width:min(560px,100%)"></div></div></div>`;
    S_lobbyZone();
    if (S.myItem) S_watchItem(S.myItem);
    return;
  }
  if (st.phase === 'intro' || st.phase === 'show') {
    if (st.phase === 'intro') S.rdRound = -9;
    S_loadRound(r);
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
      <span class="roundBadge">${roundLabel(r, cfg)} · ${esc(cfg.name)}</span>
      <div class="bigEmoji bounce">👀</div>
      <div class="title" style="font-size:40px">${st.phase === 'intro' ? '곧 시작해요!' : '프로젝터를 봐요!'}</div>
      <div class="rule">${st.phase === 'show' ? `물건 ${st.step}개째! 새 물건을 외워요 🧠` : esc(cfg.desc)}</div>
    </div></div>`;
    return;
  }
  if (st.phase === 'answer') {
    await S_loadRound(r);
    const sk = r + ':' + st.step;
    if (S.stepKey !== sk) {
      S.stepKey = sk; S.done = false; S.locked = false;
      const k = st.step;
      S.opts = shuffle([...S.rd.chain.slice(0, k).map(id => ({ id, text: S.rd.labels[id] })), ...(S.rd.decoys || [])]);
      const ex = (await get(ref(db, `rooms/${S.code}/picks/${r}/${k}/${S.pid}`))).val();
      S.list = (ex && ex.list) || [];
      S.done = !!(ex && ex.doneAt);
      if (!ex) set(ref(db, `rooms/${S.code}/picks/${r}/${k}/${S.pid}/list`), []);
    }
    S_answerShell();
    return;
  }
  if (st.phase === 'check') {
    await S_loadRound(r);
    const res = (await get(ref(db, `rooms/${S.code}/rounds/${r}/steps/${st.step}/${S.pid}`))).val();
    S_checkView(r, st.step, res);
    return;
  }
  if (st.phase === 'result') {
    const rr = (await get(ref(db, `rooms/${S.code}/rounds/${r}`))).val() || {};
    S_resultView(r, rr);
    return;
  }
  if (st.phase === 'end') {
    const ps = (await get(ref(db, `rooms/${S.code}/players`))).val() || {};
    const inTop = Object.entries(ps).sort((a, b) => (b[1].total || 0) - (a[1].total || 0)).slice(0, 5).some(([pid]) => pid === S.pid);
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage">
      <div class="bigEmoji bounce">🎉</div><div class="title">시장 <span>폐장!</span></div>
      <div class="muted" style="font-size:22px">내 최종 점수</div>
      <div class="score">${(S.me && S.me.total) || 0}점</div>
      ${inTop ? '<div class="hl">🏆 TOP 5 안에 들었어요!</div>' : '<div class="hl mint">끝까지 함께해서 최고였어요 🙌</div>'}
      ${(S.me && S.me.breakerTotal) ? `<div class="hl lav">💥 내 물건으로 친구들을 ${S.me.breakerTotal}번 헷갈리게 했어요!</div>` : ''}
    </div></div>`;
  }
}

function S_watchItem(id){
  onValue(ref(db, `rooms/${S.code}/items/${id}`), s => {
    if (!s.exists() && S.myItem === id) {
      S.myItem = null; localStorage.removeItem(`market_item_${S.code}_${S.pid}`);
      if (S.state && S.state.phase === 'lobby') { S_lobbyZone(); toast('선생님이 물건을 지웠어요. 다른 걸로 넣어 볼까요?'); }
    }
  });
}

function S_lobbyZone(){
  const z = el('itemZone'); if (!z) return;
  if (S.myItem) {
    get(ref(db, `rooms/${S.code}/items/${S.myItem}`)).then(s => {
      const it = s.val(); if (!it || !el('itemZone')) return;
      el('itemZone').innerHTML = `<div class="card center"><div class="muted">내가 넣은 물건</div>
        <div class="itemCard pop" style="font-size:54px;padding:20px;margin:14px auto;min-width:0">${esc(it.text)}</div>
        <div class="rule bounce">친구들 기다리는 중... ⏳</div></div>`;
    });
    return;
  }
  z.innerHTML = `<div class="card" style="display:grid;gap:12px">
    <div class="rule">시장에 가면 ___ 도 있고~</div>
    <input class="field" id="itemInput" maxlength="12" placeholder="예) 치킨, 교감선생님, 고무장갑">
    <div class="muted">먹을 거, 물건, 사람 다 OK! 엉뚱할수록 친구들이 헷갈려서 💥브레이커 점수를 받아요</div>
    <button class="btn big" data-act="addItem">시장에 넣기 🧺</button></div>`;
  el('itemInput').addEventListener('keydown', e => { if (e.key === 'Enter') S_addItem(); });
}

async function S_addItem(){
  const inp = el('itemInput'); if (!inp) return;
  const v = inp.value.trim();
  if (!v) { toast('물건을 써 주세요'); return; }
  const n = norm(v);
  if (!n) { toast('다른 걸로 써 볼까요?'); return; }
  if (S.state.phase !== 'lobby') { toast('이미 게임이 시작됐어요!'); return; }
  const id = rid();
  const tx = await runTransaction(ref(db, `rooms/${S.code}/norms/${n}`), cur => cur === null ? id : undefined);
  if (!tx.committed) { toast('앗! 이미 누가 시장에 넣었어요 😮 다른 걸로!'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
  await set(ref(db, `rooms/${S.code}/items/${id}`), { text: v, norm: n, author: S.name, pid: S.pid, at: serverTimestamp() });
  S.myItem = id; localStorage.setItem(`market_item_${S.code}_${S.pid}`, id);
  S_watchItem(id);
  S_lobbyZone();
}

function S_answerShell(){
  const st = S.state, r = st.round, cfg = ROUNDS[r];
  app.innerHTML = `<div class="s-wrap">${S_top()}
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="roundBadge" style="font-size:18px">${roundLabel(r, cfg)} · 물건 ${st.step}개</span>
      <span class="rule" style="font-size:20px">${cfg.reverse ? '⬅️ 마지막 물건부터 거꾸로!' : cfg.typing ? '✍️ 처음부터 순서대로 써요!' : '👆 처음부터 순서대로!'}</span>
      <span style="margin-left:auto;font-size:26px;color:var(--pinkD)" id="sTime"></span>
    </div>
    <div class="bar" id="sBar" style="margin:10px 0"><i></i></div>
    <div id="ansArea"></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn sm lemon" id="hintBtn" data-act="hint">💡 힌트 (라운드에 1번)</button>
      ${cfg.typing ? '' : '<button class="btn sm sky" id="undoBtn" data-act="undo">↩️ 하나 빼기</button>'}
      <button class="btn mint" id="submitBtn" data-act="submit" style="margin-left:auto">다 했어요! ✅</button>
    </div>
    <div class="muted" style="margin-top:8px">${cfg.typing ? '기억나는 칸만 써도 점수를 받아요 · 오타 1글자는 봐줘요' : '채운 칸을 누르면 빠져요 · 순서가 헷갈려도 기억나는 물건은 다 눌러요!'}</div>
    <div id="doneArea"></div></div>`;
  S_drawAnswer();
}

function S_drawAnswer(){
  const st = S.state, area = el('ansArea'); if (!area || !S.rd) return;
  const cfg = ROUNDS[st.round], k = st.step, lock = S.done || S.locked;
  if (cfg.typing) {
    if (area.querySelectorAll('.tin').length !== k) {
      area.innerHTML = `<div class="tgrid">${Array.from({ length: k }, (_, i) => `<div><div class="tlab">${i + 1}번째</div>
        <input class="tin" data-i="${i}" maxlength="14" autocomplete="off" value="${esc(S.list[i] || '')}"></div>`).join('')}</div>`;
      let tm;
      area.querySelectorAll('.tin').forEach(inp => inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { S.list = S_collect(); S_save(); }, 400); }));
    }
    area.querySelectorAll('.tin').forEach(inp => inp.disabled = lock);
  } else {
    const lab = id => (S.opts.find(o => o.id === id) || {}).text || '';
    const slots = Array.from({ length: k }, (_, i) => {
      const v = S.list[i];
      const cls = v ? 'slot f' : i === S.list.length ? 'slot cur' : 'slot';
      return `<div class="${cls}" ${v && !lock ? `data-act="unslot" data-i="${i}"` : ''}><span class="k">${i + 1}번째</span>${v ? esc(lab(v)) : '?'}</div>`;
    }).join('');
    const opts = S.opts.map(o => `<button class="opt${S.list.includes(o.id) ? ' used' : ''}" data-act="pick" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join('');
    area.innerHTML = `<div class="slots">${slots}</div>${lock ? '' : `<div class="opts">${opts}</div>`}`;
  }
  const hb = el('hintBtn'); if (hb) { hb.disabled = S.hintRound === st.round || lock; if (S.hintRound === st.round) hb.textContent = '💡 힌트 사용함'; }
  const ub = el('undoBtn'); if (ub) ub.disabled = lock || S.list.length === 0;
  const sb = el('submitBtn'); if (sb) sb.disabled = lock;
  const da = el('doneArea');
  if (da) da.innerHTML = S.done ? '<div class="doneBox pop">제출 완료! 🎉<br><span style="font-size:20px">프로젝터를 보며 기다려요</span></div>'
                      : S.locked ? '<div class="doneBox pop" style="background:var(--lemon)">시간 끝! ⏰<br><span style="font-size:20px">고른 만큼 점수를 받아요</span></div>' : '';
}

function S_collect(){ const v = []; document.querySelectorAll('.tin').forEach(inp => v[+inp.dataset.i] = inp.value.trim()); return v; }
function S_save(){ set(ref(db, `rooms/${S.code}/picks/${S.state.round}/${S.state.step}/${S.pid}/list`), S.list); }
function S_pick(id){
  if (S.done || S.locked || !S.rd) return;
  if (S.list.includes(id) || S.list.length >= S.state.step) return;
  S.list.push(id); S_save(); S_drawAnswer();
}
function S_unslot(i){ if (S.done || S.locked) return; S.list.splice(i, 1); S_save(); S_drawAnswer(); }
function S_undo(){ if (S.done || S.locked || !S.list.length) return; S.list.pop(); S_save(); S_drawAnswer(); }
function S_submit(){
  if (S.done || S.locked) return;
  const typing = ROUNDS[S.state.round].typing;
  if (typing) S.list = S_collect();
  const filled = S.list.filter(Boolean).length;
  if (!filled) { toast('하나라도 골라 볼까요?'); return; }
  if (filled < S.state.step && !confirm('아직 빈 칸이 있어요. 그래도 낼까요?')) return;
  S_save();
  set(ref(db, `rooms/${S.code}/picks/${S.state.round}/${S.state.step}/${S.pid}/doneAt`), serverTimestamp());
  S.done = true; S_drawAnswer();
}
function S_hint(){
  const st = S.state, cfg = ROUNDS[st.round];
  if (S.hintRound === st.round || S.done || S.locked || !S.rd) return;
  const target = targetOf(S.rd, st.step, cfg.reverse);
  let idx;
  if (cfg.typing) { const v = S_collect(); idx = target.findIndex((_, i) => !v[i]); if (idx < 0) idx = target.length - 1; }
  else idx = S.list.length;
  if (idx >= target.length) return;
  const text = S.rd.labels[target[idx]] || '';
  S.hintRound = st.round;
  toast(`💡 ${idx + 1}번째는 '${text.charAt(0)}'(으)로 시작해요! (${text.length}글자)`);
  S_drawAnswer();
}

function S_tick(){
  const st = S.state; if (!st || st.phase !== 'answer' || !S.rd) return;
  const rem = st.answerEndsAt - now(), lim = answerSec(ROUNDS[st.round], st.step) * 1000;
  const t = el('sTime'), bar = el('sBar');
  if (t) t.textContent = '⏱ ' + Math.max(0, Math.ceil(rem / 1000)) + '초';
  if (bar) { bar.firstElementChild.style.width = Math.max(0, Math.min(100, rem / lim * 100)) + '%'; bar.classList.toggle('hurry', rem < 6000); }
  if (rem <= 0 && !S.locked && !S.done) {
    if (ROUNDS[st.round].typing) { S.list = S_collect(); S_save(); }
    S.locked = true; S_drawAnswer();
  }
}

function S_checkView(r, k, res){
  const cfg = ROUNDS[r], target = targetOf(S.rd, k, cfg.reverse);
  if (!res || res.absent) {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage"><div class="bigEmoji">☕</div>
      <div class="rule">이번 단계는 쉬었어요. 프로젝터로 정답을 봐요!</div></div></div>`;
    return;
  }
  const list = S.list || [];
  const lab = v => cfg.typing ? v : ((S.rd.labels && S.rd.labels[v]) || ((S.rd.decoys || []).find(d => d.id === v) || {}).text || '');
  const slots = target.map((id, i) => {
    const ok = res.flags && res.flags[i];
    return `<div class="slot ${ok ? 'ok' : 'bad'}"><span class="k">${i + 1}번째 ${ok ? '✅' : '❌'}</span>${list[i] ? esc(lab(list[i])) : '—'}${ok ? '' : `<span class="ca">정답: ${esc(S.rd.labels[id])}</span>`}</div>`;
  }).join('');
  app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="gap:10px;min-height:auto;margin-top:20px">
    <div class="title" style="font-size:38px">${res.perfect ? '완벽해요! 🌟' : res.inc ? '좋아요! 👍' : '괜찮아요, 다음에 또! 💪'}</div>
    <div class="rule">기억한 물건 <b style="color:var(--pinkD)">${res.inc}개</b> · 순서까지 <b style="color:var(--pinkD)">${res.pos}개</b></div>
    <div class="slots" style="justify-content:center">${slots}</div>
    ${cfg.practice ? '<div class="muted" style="font-size:20px">연습이라 점수는 없어요</div>' : `<div class="score" style="font-size:44px">+${res.score}점</div>`}
    <div class="muted" style="font-size:20px">${k < S.rd.chain.length ? '다음 단계에선 하나 더 늘어나요!' : '라운드 끝! 프로젝터를 봐요 👀'}</div>
  </div></div>`;
}

function S_resultView(r, rr){
  const cfg = ROUNDS[r];
  if (cfg.practice) {
    app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage"><div class="bigEmoji bounce">🧪</div>
      <div class="title" style="font-size:40px">연습 끝!</div><div class="rule">이제 진짜 시작이에요 💪</div></div></div>`;
    return;
  }
  const sum = (rr.sum && rr.sum[S.pid]) || 0, brk = (rr.brk && rr.brk[S.pid]) || 0;
  const lucky = (rr.luck || []).includes(S.pid);
  app.innerHTML = `<div class="s-wrap">${S_top()}<div class="stage" style="gap:10px">
    <span class="roundBadge">${roundLabel(r, cfg)} 결과</span>
    ${lucky ? `<div class="luck"><div class="in"><div class="fa">🎴 ?</div><div class="ba">🍀 행운 카드!<span style="font-size:20px">이번 라운드 2배</span></div></div></div>` : ''}
    <div class="muted" style="font-size:22px">이번 라운드에서 받은 점수</div>
    <div class="score">+${sum}점</div>
    ${brk ? `<div class="hl lav">💥 내 물건 덕분에 친구들이 ${brk}번 헷갈렸어요! (브레이커 점수 포함)</div>` : ''}
    <div class="muted" style="font-size:20px">프로젝터에서 순위를 확인해요 👀</div>
  </div></div>`;
}

/* ---------------- 클릭 처리 ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'join') return S_join();
  if (a === 'addItem') return S_addItem();
  if (a === 'pick') return S_pick(b.dataset.id);
  if (a === 'unslot') return S_unslot(+b.dataset.i);
  if (a === 'undo') return S_undo();
  if (a === 'submit') return S_submit();
  if (a === 'hint') return S_hint();
  if (a === 'newRoom') return T_newRoom();
  if (a === 'resume') { location.href = location.pathname + '?t=1&room=' + b.dataset.code; return; }
  if (!room) return;
  if (a === 'toggleNames') return update(ref(db, `rooms/${code}/state`), { showNames: !room.state.showNames });
  if (a === 'toggleMute') { Beat.muted = !Beat.muted; b.textContent = Beat.muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐'; return; }
  if (a === 'togglePause') { paused = !paused; b.textContent = paused ? '▶ 다음 단계 진행' : '⏸ 다음 단계 전 멈추기'; return; }
  if (a === 'newGame') { if (confirm('새 게임을 만들까요? (지금 방은 그대로 남아요)')) { loopGen++; Beat.stop(); T_newRoom(); } return; }
  if (a === 'addReserve') {
    const used = new Set(Object.values(room.items || {}).map(i => i.norm));
    const upd = {}; let k = 0;
    for (const t of shuffle(RESERVE)) { const n = norm(t); if (used.has(n)) continue; const id = rid(); upd['items/' + id] = { text: t, norm: n, author: '선생님', pid: 'teacher', at: Date.now() }; upd['norms/' + n] = id; if (++k >= 5) break; }
    return update(ref(db, 'rooms/' + code), upd);
  }
  if (a === 'delItem') {
    const it = room.items && room.items[b.dataset.id]; if (!it) return;
    return update(ref(db, 'rooms/' + code), { ['items/' + b.dataset.id]: null, ['norms/' + it.norm]: null });
  }
  if (a === 'startRound') { Beat.ensure(); return T_startRound(+b.dataset.r); }
  if (a === 'playRound') { Beat.ensure(); return T_runRound(room.rounds[room.state.round].start); }
  if (a === 'resumeLoop') { Beat.ensure(); return T_resume(); }
  if (a === 'closeNow') { forceClose = true; return; }
  if (a === 'toEnd') return update(ref(db, `rooms/${code}/state`), { phase: 'end' });
});

/* ---------------- 시작 ---------------- */
if (isTeacher) T_init(); else S_init();
</script>
