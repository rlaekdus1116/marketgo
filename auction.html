<style>
/* 「떡볶이 시장」과 같은 디자인 */
:root{
  --bg:#FFF9F4; --ink:#5B4B57; --sub:#A3919C; --line:#F2E6EC; --card:#FFFFFF;
  --pink:#FFE3EA; --pinkD:#F4A9BD; --mint:#DDF5EA; --mintD:#8FD5B5;
  --lemon:#FFF5CC; --lemonD:#F2D477; --lav:#ECE5FF; --lavD:#B8A7EE;
  --sky:#E0F0FF; --skyD:#93C4EE; --peach:#FFE9DA; --peachD:#F5B48C; --red:#FFD9D9; --redD:#EE9A9A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua',sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#F6E3EA 1.4px,transparent 1.4px);background-size:22px 22px}

.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.s-wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.muted{color:var(--sub)} .center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
h3{margin:0 0 12px;font-size:22px;font-weight:normal}
.btn{background:var(--pink);border-radius:20px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 var(--pinkD);transition:transform .08s;margin:4px 4px 4px 0}

.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}
.btn.lemon{background:var(--lemon);box-shadow:0 5px 0 var(--lemonD)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lavD)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.peach{background:var(--peach);box-shadow:0 5px 0 var(--peachD)}
.btn.big{font-size:28px;padding:18px 36px}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)}
.title{font-size:44px;margin:6px 0;letter-spacing:1px} .title span{color:var(--peachD)}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topbar .logo{font-size:26px;margin-right:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lemon);border-radius:999px;padding:7px 14px;font-size:18px}
.chip.soft{background:var(--sky)}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;margin:0}
.lobby{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:72px;letter-spacing:8px;color:var(--peachD);line-height:1}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:14px}

/* ===== 🌈 안내문: 일부러 촌스럽고 눈에 확 띄게 ===== */
.ann{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;cursor:pointer;animation:annIn .45s cubic-bezier(.2,1.7,.4,1)}
.ann::before{content:'';position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;
  background:repeating-conic-gradient(#FF9EBB 0 10deg,#FFC48A 10deg 20deg,#FFF08A 20deg 30deg,#A8F0C0 30deg 40deg,#9ED8FF 40deg 50deg,#C9B3FF 50deg 60deg);
  animation:spinbg 14s linear infinite}
.ann::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.95) 0 22%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%)}
.ann > *{position:relative;z-index:1}
.ann .rb{display:block;font-size:min(15vw,150px);line-height:1.08;text-align:center;padding:0 3vw;
  background:linear-gradient(90deg,#FF4F8B,#FF8A3D,#FFC81E,#3DD68C,#3DA9FF,#9B5CFF,#FF4F8B);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:4px #fff;
  filter:drop-shadow(0 7px 0 #5B4B57) drop-shadow(0 0 18px #fff);
  animation:rainbow 2s linear infinite,wobble .55s ease-in-out infinite alternate}
.ann .sub{font-size:min(6.5vw,46px);background:#fff;border:5px solid #5B4B57;border-radius:999px;padding:10px 34px;box-shadow:0 8px 0 #5B4B57;transform:rotate(-3deg);text-align:center;max-width:92vw}
.ann .emo{font-size:min(20vw,150px);line-height:1;animation:hop .5s ease-in-out infinite alternate}
.ann .fl{position:absolute;z-index:1;font-size:56px;animation:floaty 3s ease-in-out infinite alternate;pointer-events:none}
.ann .tap{position:absolute;bottom:18px;z-index:1;font-size:18px;color:#5B4B57;opacity:.7}
@keyframes spinbg{to{transform:rotate(360deg)}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes wobble{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.07)}}
@keyframes hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(8deg)}}
@keyframes floaty{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-40px) rotate(15deg)}}
@keyframes annIn{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.ann,.ann *,.ann::before{animation:none!important}}

/* ===== 경매소 전용 ===== */
.item-hero{display:flex;flex-direction:column;align-items:center;gap:6px}

.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper .btn{font-size:34px;padding:10px 26px;margin:0}
input[type=range]{width:100%;accent-color:#F5B48C;height:36px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick .btn{margin:0}
.lock{background:var(--lav);border-radius:24px;padding:18px;font-size:26px;text-align:center}
.cv-wrap{background:#fff;border:3px solid var(--line);border-radius:22px;padding:6px;touch-action:none}
canvas{display:block;width:100%;touch-action:none;border-radius:16px}
.speech{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:12px 26px;font-size:34px;box-shadow:0 6px 0 var(--ink);max-width:92%}
.speech::after{content:'';position:absolute;left:46px;bottom:-22px;border:12px solid transparent;border-top-color:var(--ink)}
.hammer{font-size:80px;line-height:1;display:inline-block;transform-origin:80% 80%}
.hammer.bang{animation:bang .35s ease-in}
@keyframes bang{0%{transform:rotate(-40deg)}60%{transform:rotate(18deg)}100%{transform:rotate(0)}}
.acc{font-size:110px;line-height:1;color:var(--peachD)}
.acc small{font-size:50px}
.stand{background:var(--mint);border-radius:28px;padding:26px;font-size:40px;text-align:center;box-shadow:0 8px 0 var(--mintD)}
.sit{background:var(--line);border-radius:28px;padding:26px;font-size:32px;text-align:center}
.svgbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:middle;margin-right:4px}
.edit-row{display:grid;grid-template-columns:64px 1fr auto 44px;gap:6px;align-items:center;margin-bottom:6px}
.edit-row.one{grid-template-columns:1fr}
.edit-row label{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--sub)}
.edit-row .sup{flex-direction:row;align-items:center;gap:6px;white-space:nowrap}
.edit-row .sup input{width:70px}
.iedit{border-bottom:2px dashed var(--line);padding:8px 0}
.edit-row input,.edit-row select{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);color:var(--ink);width:100%}
@media (max-width:700px){.edit-row{grid-template-columns:52px 1fr auto 40px}}
.stat-big{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 「시장에 가면」·「떡볶이 시장」과 같은 Firebase 프로젝트 (데이터는 rooms/auction_코드 에 저장) */
const firebaseConfig = {
  apiKey: "AIzaSyDiehLZ1aKv8E3N_pD4bNmw0zgMexau99U",
  authDomain: "marketgo-80ab5.firebaseapp.com",
  databaseURL: "https://marketgo-80ab5-default-rtdb.firebaseio.com",
  projectId: "marketgo-80ab5",
  storageBucket: "marketgo-80ab5.firebasestorage.app",
  messagingSenderId: "666715038541",
  appId: "1:666715038541:web:b0f84a9703aa70aeca4d04"
};
const db = getDatabase(initializeApp(firebaseConfig));
let offset = 0;
onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });

/* ========== 설정 (선생님 화면에서 물건·가격 목록·파는 개수를 바꿀 수 있어요) ==========
   prices: 선생님이 부를 가격 (싼 가격부터 올라가요) / supply: 파는 개수 (0이면 공급선 없음) */
const DEFAULT_ITEMS = [
  { emoji: '📄', name: '기말고사 사회 시험지 (답 없음)', prices: [1000, 5000, 10000, 50000, 100000, 1000000, 10000000, 100000000], supply: 5, pitch: '따끈따끈 인쇄 직후! 단 5명에게만 판매!' },
  { emoji: '🍫', name: '선생님 책상 위 에너지바', prices: [500, 1000, 2000, 3000, 5000, 10000], supply: 1, pitch: '선생님이 아껴 먹던 바로 그 에너지바! 단 1개!' },
];
const SPEEDS = { '손으로 넘기기': 0, '천천히': 8000, '보통': 6000, '빠르게': 4000 };
const COLORS = ['#3B8FD9', '#E8803E', '#2FA67A', '#B44FC9', '#D94F6A'];

const P = new URLSearchParams(location.search);
const isTeacher = P.get('t') === '1';
let code = P.get('room') || '';
const app = document.getElementById('app');
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A = (c = code) => ref(db, 'rooms/auction_' + c);
const AP = p => ref(db, `rooms/auction_${code}/${p}`);
let toastT;
const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast pop'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); };

// 가격 읽기·쓰기: "1억, 1000만, 5천, 0" ↔ 숫자
function kw(n) {
  n = Math.round(n);
  if (n === 0) return '0원';
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4), rest = n % 1e4;
  let s = '';
  if (eok) s += eok + '억';
  if (man) s += (s ? ' ' : '') + man.toLocaleString() + '만';
  if (rest) s += (s ? ' ' : '') + (rest % 1000 === 0 && !eok && !man ? (rest / 1000) + '천' : rest.toLocaleString());
  return s + '원';
}
function parsePrice(t) {
  t = String(t).replace(/[,\s원]/g, '');
  if (t === '') return null;
  let total = 0, m;
  const re = /(\d+(?:\.\d+)?)(억|만|천)?/g;
  while ((m = re.exec(t))) total += parseFloat(m[1]) * ({ '억': 1e8, '만': 1e4, '천': 1e3 }[m[2]] || 1);
  return Math.round(total);
}
const parseList = t => [...new Set(String(t).split(/[,\n→>\/]+/).map(parsePrice).filter(v => v !== null && v >= 0))].sort((a, b) => a - b);
const listText = ps => ps.map(p => kw(p).replace(/원$/, '').replace(/ /g, '')).join(', ');

/* ========== 🌈 안내문 (떡볶이 시장과 같은 스타일) ========== */
let annT;
function announce(big, sub = '', emo = '🌈', ms = 3200) {
  document.querySelectorAll('.ann').forEach(a => a.remove());
  const a = document.createElement('div');
  a.className = 'ann';
  const floaters = ['💸','🔨','✨','⭐','💰','💖','🪙','🌟','🧾','🫧','✨','💸'];
  a.innerHTML = floaters.map((f, i) => `<span class="fl" style="left:${(i * 83) % 92}%;top:${(i * 47) % 85}%;animation-delay:${(i % 5) * .3}s">${f}</span>`).join('')
    + `<div class="emo">${emo}</div><span class="rb">${big}</span>${sub ? `<div class="sub">${sub}</div>` : ''}<div class="tap">화면을 누르면 닫혀요</div>`;
  a.onclick = () => a.remove();
  document.body.appendChild(a);
  clearTimeout(annT); annT = setTimeout(() => a.remove(), ms);
}
const annSeen = new Set(); let firstPass = true;
function maybeAnnounce(key, fn) { if (annSeen.has(key)) return; annSeen.add(key); if (!firstPass) fn(); }

/* ========== 🔊 효과음 (선생님 화면) ========== */
const Snd = {
  ctx: null,
  ensure() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, t0 = 0, d = .18, v = .25, type = 'triangle') {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  noise(t0, d, v, freq) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + t0, len = Math.floor(c.sampleRate * d), b = c.createBuffer(1, len, c.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < len; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  },
  step(hi) { this.tone(hi ? 660 : 440, 0, .12, .18, 'square'); this.noise(0, .05, .25, 3000); },
  stand(n) { [784, 988, 1175].slice(0, Math.min(3, n)).forEach((f, i) => this.tone(f, i * .07, .25, .22)); },
  gavel() { this.noise(0, .18, .9, 900); this.tone(110, 0, .25, .5, 'sine'); this.noise(.28, .18, .9, 900); this.tone(110, .28, .25, .5, 'sine'); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .4, .25, 'square')); },
};


/* ========== 공통 계산 ========== */
const itemsOf = () => ((room && room.items) || DEFAULT_ITEMS).map(x => {
  const prices = Array.isArray(x.prices) && x.prices.length ? [...x.prices].map(Number).sort((a, b) => a - b) : [1000, 5000, 10000];
  return { ...x, prices, supply: Math.max(0, Math.floor(+x.supply || 0)) };
});
// ans[item][pid].last = ✋ 누른 가장 비싼 가격 칸 (0 = 가장 싼 가격). 한 번 안 누르면 탈락!
const ansOf = i => ((room.ans || {})[i]) || {};
const nOf = i => ((((room.meta || {})[i]) || {}).n) || Math.max(1, Object.keys(room.players || {}).length);
const Qat = (ans, lv) => Object.values(ans).filter(a => a.last >= lv).length;    // lv 칸 가격에서 사겠다는 사람 수
const sortedAns = ans => Object.entries(ans).map(([pid, a]) => ({ pid, last: a.last, at: a.at || 0 })).sort((a, b) => b.last - a.last || a.at - b.at);
// 손으로 그린 선 → 가격 칸마다 예측 수요량 (pts = [사람 수, 칸 번호])
function predQ(pts, lv) {
  if (!pts || pts.length < 2) return null;
  const s = [...pts].sort((a, b) => a[1] - b[1]);
  if (lv <= s[0][1]) return s[0][0];
  if (lv >= s[s.length - 1][1]) return s[s.length - 1][0];
  for (let i = 1; i < s.length; i++) if (s[i][1] >= lv) { const [x0, y0] = s[i - 1], [x1, y1] = s[i]; return y1 === y0 ? (x0 + x1) / 2 : x0 + (x1 - x0) * (lv - y0) / (y1 - y0); }
  return s[s.length - 1][0];
}
function accuracy(pts, L, ans, N) {
  if (!pts || pts.length < 2) return null;
  let err = 0;
  for (let lv = 0; lv < L; lv++) err += Math.abs(predQ(pts, lv) - Qat(ans, lv));
  return Math.max(0, Math.round(1000 * (1 - 2 * err / L / Math.max(1, N))) / 10);   // 평균 오차가 반 인원의 절반이면 0%
}
const accComment = a => a >= 95 ? '🔮 신내림 받았다!!' : a >= 85 ? '🧠 경제학자 꿈나무!' : a >= 70 ? '👀 오~ 감 좋은데?' : a >= 50 ? '🤔 반쯤 맞았다!' : '🌀 그래프가 우주로 떠났어요';
function gapText(q, S) {
  if (!S) return '';
  if (q > S) return `🔴 초과 수요 ${q - S}명 (사고 싶은데 못 사요)`;
  if (q < S) return `🔵 초과 공급 ${S - q}개 (안 팔리고 남아요)`;
  return '🎯 딱 맞아요! 사려는 사람 = 파는 개수';
}
// 균형: 가격을 올리다가 사려는 사람이 파는 개수와 같아지는 곳
function equilibrium(ans, prices, S) {
  if (!S) return null;
  let lv = -1; for (let k = 0; k < prices.length; k++) if (Qat(ans, k) >= S) lv = k;
  if (lv < 0) return { short: true, left: S - Qat(ans, 0) };
  const q = Qat(ans, lv);
  return { lv, p: prices[lv], q, exact: q === S, nextP: lv + 1 < prices.length ? prices[lv + 1] : null, winners: q === S ? sortedAns(ans).filter(a => a.last >= lv).map(a => a.pid) : [] };
}

/* ========== 그래프 (SVG): 세로축 = 선생님이 정한 가격 칸, 학생 한 명 = 막대 하나 ========== */
const W = 1000, H = 560, ML = 118, MR = 24, MT = 24, MB = 52;
function axes(prices, N) {
  const L = prices.length, pw = W - ML - MR, ph = H - MT - MB;
  const x = q => ML + q / Math.max(1, N) * pw, y = lv => MT + (1 - (lv + 0.5) / L) * ph;   // 싼 가격이 아래
  let g = `<rect x="${ML}" y="${MT}" width="${pw}" height="${ph}" fill="#FFFDF9" stroke="#F2E6EC" stroke-width="2" rx="8"/>`;
  prices.forEach((p, lv) => { g += `<line x1="${ML}" x2="${W - MR}" y1="${y(lv)}" y2="${y(lv)}" stroke="#F2E6EC"/><text x="${ML - 10}" y="${y(lv) + 6}" text-anchor="end" font-size="18" fill="#A3919C">${kw(p)}</text>`; });
  const qs = N <= 12 ? 1 : N <= 30 ? 2 : 5;
  for (let q = 0; q <= N; q += qs) g += `<text x="${x(q)}" y="${H - MB + 24}" text-anchor="middle" font-size="17" fill="#A3919C">${q}</text>`;
  g += `<text x="${ML - 8}" y="${MT - 6}" text-anchor="end" font-size="15" fill="#A3919C">가격</text><text x="${W - MR}" y="${H - 6}" text-anchor="end" font-size="15" fill="#A3919C">사겠다는 사람 수(명)</text>`;
  return { g, x, y, bottom: MT + (H - MT - MB) };
}
function stairPath(ans, L, x, y, upto) {
  let d = '';
  for (let lv = Math.min(upto, L - 1); lv >= 0; lv--) { const q = Qat(ans, lv); d += d ? ` L${x(Qat(ans, lv + 1))},${y(lv)} L${x(q)},${y(lv)}` : `M${x(0)},${y(lv)} L${x(q)},${y(lv)}`; }
  return d;
}
function predPath(pts, x, y) { return pts && pts.length > 1 ? 'M' + pts.map(([q, lv]) => `${x(q)},${y(lv)}`).join(' L') : ''; }

// li = 지금 부르는 가격 칸 (-1 = 시작 전)
function barsSVG(ans, prices, N, li, names, S, extra = '', showAnn = true) {
  const { g, x, y, bottom } = axes(prices, N), bw = x(1) - x(0), list = sortedAns(ans);
  let bars = '';
  list.forEach((a, k) => {
    const top = Math.min(a.last, li), inNow = showAnn && a.last >= li, over = S && inNow && k >= S;
    bars += `<rect x="${x(k) + 2}" y="${y(top) - 14}" width="${bw - 4}" height="${bottom - y(top) + 14}" rx="6" fill="${over ? '#FFD9D9' : inNow ? '#FFC48A' : '#DDF5EA'}" stroke="${over ? '#EE9A9A' : inNow ? '#F5B48C' : '#8FD5B5'}" stroke-width="${inNow ? 3 : 1.5}"/>`;
    if (names) { const fs = Math.max(11, Math.min(18, bw / 2.4)); bars += `<text transform="translate(${x(k) + bw / 2 + fs / 3},${y(top) - 6}) rotate(90)" font-size="${fs}" fill="#5B4B57">${esc(names(a.pid))}</text>`; }
  });
  const q = li >= 0 ? Qat(ans, li) : 0;
  let ann = '';
  if (li >= 0 && showAnn) {
    ann += `<rect x="${ML}" y="${y(li) - 16}" width="${W - MR - ML}" height="32" fill="#F4A9BD" opacity=".15"/>`;
    if (S && q > S) ann += `<rect x="${x(S)}" y="${y(li) - 16}" width="${x(q) - x(S)}" height="32" rx="8" fill="#EE9A9A" opacity=".45"/><text x="${(x(S) + x(q)) / 2}" y="${y(li) + 7}" text-anchor="middle" font-size="20" fill="#B03A52">초과 수요 ${q - S}</text>`;
    if (S && q < S) ann += `<rect x="${x(q)}" y="${y(li) - 16}" width="${x(Math.min(S, N)) - x(q)}" height="32" rx="8" fill="#93C4EE" opacity=".45"/><text x="${(x(Math.min(S, N)) + x(q)) / 2}" y="${y(li) + 7}" text-anchor="middle" font-size="20" fill="#2A6FB0">초과 공급 ${S - q}</text>`;
  }
  const sx = x(Math.min(S, N));
  const sup = S ? `<line x1="${sx}" x2="${sx}" y1="${MT}" y2="${bottom}" stroke="#3B8FD9" stroke-width="4" stroke-dasharray="12 7"/><text x="${sx + 6}" y="${MT + 20}" font-size="20" fill="#3B8FD9">공급 ${S}개</text>` : '';
  const stair = li >= 0 ? `<path d="${stairPath(ans, prices.length, x, y, li)}" fill="none" stroke="#E8803E" stroke-width="5" stroke-linejoin="round"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}${ann}${bars}${stair}${sup}${extra}</svg>`;
}

async function join(c, name) {
  if (!/^\d{4}$/.test(c)) return toast('입장 코드 4자리를 써 주세요');
  if (!name) return toast('이름을 써 주세요');
  let snap;
  try { snap = await get(A(c)); } catch (e) { return toast('접속을 못 했어요 😢 인터넷을 확인해 주세요'); }
  if (!snap.exists()) return toast('그런 경매소가 없어요 😢 코드를 확인해 주세요');
  let id = localStorage.getItem('auction_pid_' + c);
  if (!id) {
    const ps = snap.val().players || {};
    const hit = Object.entries(ps).find(([, p]) => p.name === name && p.online !== true);   // 다른 기기로 다시 들어와도 이어서
    id = hit ? hit[0] : Math.random().toString(36).slice(2, 10);
    localStorage.setItem('auction_pid_' + c, id);
  }
  await update(ref(db, `rooms/auction_${c}/players/${id}`), { name, joinedAt: Date.now() });
  localStorage.setItem('auction_name', name); localStorage.setItem('auction_last_room', c);
  location.href = `?room=${c}`;
}

        ? `<div class="hl mint">🎯 <b>${kw(eq.p)}</b>일 때 사려는 사람이 딱 ${S}명 → <b>균형 가격</b><br><span style="font-size:19px">🔨 낙찰자: ${st.showNames ? eq.winners.map(id => esc(nameOf(id))).join(', ') : `${S}명 (이름 숨김)`}</span></div>`
        : eq.nextP !== null
          ? `<div class="hl mint">🎯 <b>${kw(eq.p)}</b>에선 🔴 초과 수요(${eq.q}명이 ${S}개를 원함), <b>${kw(eq.nextP)}</b>에선 🔵 초과 공급<br><span style="font-size:19px">→ 균형 가격은 ${kw(eq.p)}와 ${kw(eq.nextP)} 사이! 가격을 더 잘게 부르면 찾을 수 있어요</span></div>`
          : `<div class="hl red">🔴 가장 비싼 ${kw(eq.p)}에서도 ${eq.q}명이 ${S}개를 원해요 → 초과 수요! 가격을 더 올려 봐요</div>`;
    body = `<div class="center" style="margin-bottom:8px"><span class="roundBadge">🔨 ${i + 1}번 물건 낙찰 결과 · ${esc(it.emoji)} ${esc(it.name)}</span></div>
      <div class="card svgbox">${barsSVG(ans, prices, N, L - 1, st.showNames ? nameOf : null, S, extra, false)}
        <div class="legend"><span class="pill"><span class="sw" style="background:#E8803E"></span>진짜 수요 곡선</span>${S ? '<span class="pill"><span class="sw" style="background:#3B8FD9"></span>공급</span>' : ''}<span class="pill"><span class="sw" style="background:#B8A7EE"></span>반 평균 예언</span>
        ${top.map(([id, a], k) => `<span class="pill"><span class="sw" style="background:${COLORS[k]}"></span>${['🥇','🥈','🥉'][k]} ${st.showNames ? esc(nameOf(id)) : `${k + 1}등`} ${a}%</span>`).join('')}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card"><h3>🔮 예언왕 TOP 3</h3>${top.map(([id, a], k) => `<div class="rule">${['🥇','🥈','🥉'][k]} ${esc(nameOf(id))} <b style="color:var(--peachD)">${a}%</b></div>`).join('') || '<p class="muted">예언한 친구가 없어요</p>'}
          <div class="muted" style="font-size:18px;margin-top:8px">반 평균 정확도 ${avgAcc}%</div></div>
        <div class="card"><h3>📢 낙찰 결과</h3>${eqBox}<div class="hl lemon">🤔 가격이 내려갈수록 사려는 사람은?</div></div>
      </div>
      <div class="center">${i + 1 < items.length ? `<button class="btn big mint" id="next">▶ ${i + 2}번 물건: ${esc(items[i + 1].emoji)} ${esc(items[i + 1].name)}</button>` : ''}
        <button class="btn big ${i + 1 < items.length ? 'lemon' : 'mint'}" id="final">🏁 결과 모아 보기</button></div>`;
  }
  else if (st.phase === 'final') {
    maybeAnnounce('final', () => { Snd.fanfare(); announce('경매 끝~!!', '물건마다 곡선을 비교해 볼까? 🧐', '🏁', 3000); });
    const done = items.map((it2, k) => ({ it: it2, k })).filter(o => Object.keys(ansOf(o.k)).length || (room.acc || {})[o.k]);
    const minis = done.map((o, c) => { const NN = nOf(o.k), { g, x, y } = axes(o.it.prices, NN);
      return `<div class="card svgbox"><h3>${esc(o.it.emoji)} ${esc(o.it.name)}${o.it.supply ? ` · 📦 ${o.it.supply}개` : ''}</h3><svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}<path d="${stairPath(ansOf(o.k), o.it.prices.length, x, y, o.it.prices.length - 1)}" fill="none" stroke="${COLORS[c]}" stroke-width="6" stroke-linejoin="round"/>${o.it.supply ? `<line x1="${x(Math.min(o.it.supply, NN))}" x2="${x(Math.min(o.it.supply, NN))}" y1="${MT}" y2="${H - MB}" stroke="#3B8FD9" stroke-width="4" stroke-dasharray="12 7"/>` : ''}</svg></div>`; }).join('');
    const accAll = {};
    done.forEach(o => Object.entries(((room.acc || {})[o.k]) || {}).forEach(([id, a]) => { if (a !== null) (accAll[id] = accAll[id] || []).push(a); }));
    const kings = Object.entries(accAll).map(([id, a]) => [id, a.reduce((s, v) => s + v, 0) / a.length]).sort((a, b) => b[1] - a[1]).slice(0, 3);
    body = `<div class="center" style="margin-bottom:8px"><span class="roundBadge">🏁 물건별 수요 곡선</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px">${minis}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card"><h3>🧐 생각해 볼 질문</h3>
          <div class="q"><p>1. 어느 물건이든 <b>가격이 내려갈수록</b> 사겠다는 사람 수는 어떻게 변했나요?</p></div>
          <div class="q"><p>2. 파는 개수보다 사려는 사람이 많으면(<b>초과 수요</b>) 가격은 어떻게 될까요?</p></div>
          <div class="q"><p>3. 반대로 남으면(<b>초과 공급</b>)? 가게 주인이라면 어떻게 할래요?</p></div></div>
        <div class="card"><h3>👑 오늘의 예언왕</h3>${kings.map(([id, a], k) => `<div class="rule">${['🥇','🥈','🥉'][k]} ${esc(nameOf(id))} <b style="color:var(--peachD)">평균 ${a.toFixed(1)}%</b></div>`).join('') || '<p class="muted">-</p>'}</div>
      </div>`;
  }
  app.innerHTML = `<div class="wrap">${topbar(st)}${body}</div>`;
  if (st.phase === 'lobby' && window.QRCode) new QRCode(el('qr'), { text: location.origin + location.pathname + '?room=' + code, width: 200, height: 200, colorDark: '#5B4B57', colorLight: '#ffffff' });
  wireTeacher(st, items, i, it);
}

function wireTeacher(st, items, i, it) {
  const S = o => update(AP('state'), o);
  el('names').onclick = () => S({ showNames: !st.showNames });
  el('home').onclick = () => { if (confirm('처음 화면으로 갈까요? (경매소는 그대로 남아요)')) location.href = '?t=1'; };
  document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { speed = b.dataset.speed; if (ladderTimer || st.phase === 'ladder') { stopLadder(); if (SPEEDS[speed] && st.phase === 'ladder') autoLadder(); } render.sig = ''; renderTeacher(); });
  if (st.phase === 'lobby') {
    const save = () => {
      const next = itemsOf().map(x => ({ ...x }));
      document.querySelectorAll('.edit-row [data-f]').forEach(f => {
        const k = +f.dataset.k, fl = f.dataset.f;
        if (fl === 'supply') next[k].supply = Math.max(0, Math.floor(+f.value || 0));
        else if (fl === 'prices') { const ps = parseList(f.value); if (ps.length >= 2) next[k].prices = ps; }
        else next[k][fl] = f.value;
      });
      set(AP('items'), next);
    };
    document.querySelectorAll('.edit-row input').forEach(inp => {
      inp.oninput = () => { clearTimeout(editT); editT = setTimeout(save, 800); };
      inp.onblur = () => { clearTimeout(editT); save(); };
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const n = itemsOf().filter((_, k) => k !== +b.dataset.del); if (n.length) set(AP('items'), n); });
    if (el('addItem')) el('addItem').onclick = () => set(AP('items'), [...itemsOf(), { emoji: '🎁', name: '새 물건', prices: [10000, 5000, 1000, 0], supply: 0, pitch: '' }]);
    el('go').onclick = () => { Snd.ensure(); update(A(), { [`meta/0/n`]: Math.max(1, onlineIds().length), 'state/phase': 'predict', 'state/item': 0, 'state/li': -1 }); };
  }
  if (st.phase === 'predict') el('toLadder').onclick = async () => {
    Snd.ensure();
    await update(A(), { [`meta/${i}/n`]: Math.max(1, onlineIds().length, Object.keys(ansOf(i)).length), 'state/phase': 'ladder', 'state/li': -1 });
    nextPrice();
    if (SPEEDS[speed]) autoLadder();
  };
  if (st.phase === 'ladder') {
    el('nextP').onclick = () => { Snd.ensure(); nextPrice(); if (SPEEDS[speed] && !ladderTimer) autoLadder(); };
    if (el('sold')) el('sold').onclick = () => { if (confirm('지금 가격에서 낙찰할까요?')) finishLadder(); };
    if (el('pause')) el('pause').onclick = () => { stopLadder(); render.sig = ''; renderTeacher(); };
  }
  if (st.phase === 'reveal') {
    if (el('next')) el('next').onclick = () => update(A(), { [`meta/${i + 1}/n`]: Math.max(1, onlineIds().length), 'state/phase': 'predict', 'state/item': i + 1, 'state/li': -1 });
    el('final').onclick = () => S({ phase: 'final' });
  }
}

function stopLadder() { clearInterval(ladderTimer); ladderTimer = null; }
function autoLadder() { stopLadder(); ladderTimer = setInterval(nextPrice, SPEEDS[speed]); render.sig = ''; renderTeacher(); }
async function finishLadder() {
  stopLadder();
  const st = room.state, i = st.item, it = itemsOf()[i], L = it.prices.length;
  const preds = ((room.preds || {})[i]) || {}, acc = {}, ans = ansOf(i), N = nOf(i);
  Object.entries(preds).forEach(([id, v]) => { acc[id] = accuracy(v.pts, L, ans, N); });
  await update(A(), { [`acc/${i}`]: acc, 'state/phase': 'reveal' });
}
async function nextPrice() {
  const st = room.state, i = st.item, it = itemsOf()[i], L = it.prices.length, cur = st.li ?? -1, li = cur + 1;
  if (li >= L || (cur >= 0 && Qat(ansOf(i), cur) === 0)) return finishLadder();   // 끝까지 갔거나 다 탈락
  Snd.step(li === 0);
  await update(AP('state'), { li });
  const h = el('ham'); if (h) { h.classList.remove('bang'); void h.offsetWidth; h.classList.add('bang'); }
}

/* =========================================================
   🧒 학생 화면
   ========================================================= */
let stoodKey = '', predKey = '';
function renderStudent() {
  const st = room.state || {}, items = itemsOf(), i = st.item || 0, it = items[i] || items[0], prices = it.prices, S = it.supply;
  const me = (room.players || {})[pid];
  if (!me) { localStorage.removeItem('auction_pid_' + code); return studentForm(code); }
  const my = ansOf(i)[pid], pred = (((room.preds || {})[i]) || {})[pid];
  const top = `<div class="s-top"><span class="me">🙂 ${esc(me.name)}</span><span class="pill">🔨 경매소 ${esc(code)}</span></div>`;
  const sig = [st.phase, i, st.li, my ? my.last : '-', !!pred].join('|');
  if (sig === renderStudent.sig) return;
  renderStudent.sig = sig;

  if (st.phase === 'lobby') {
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="min-height:70vh"><div class="hammer bounce">🔨</div>
      <div class="title" style="font-size:38px">입장 완료!</div><div class="rule">칠판을 보세요 👀<br>곧 경매가 시작돼요</div></div></div>`;
    return;
  }
  if (st.phase === 'predict') {
    const N = nOf(i);
    if (pred && predKey === 'p' + i) return;
    predKey = pred ? 'p' + i : '';
    app.innerHTML = `<div class="s-wrap">${top}
      <div class="center"><span class="roundBadge" style="font-size:18px">🔮 예언 타임 · ${esc(it.emoji)} ${esc(it.name)}</span>${S ? ` <span class="hot" style="font-size:18px">📦 ${S}개만 판매</span>` : ''}</div>
      <div class="rule center" style="font-size:22px;margin:10px 0">선생님이 ${kw(prices[0])}부터 ${kw(prices[prices.length - 1])}까지 가격을 올리면<br>가격마다 <b>우리 반 ${N}명 중 몇 명</b>이 사겠다고 할까? <b>손가락으로 쭉~</b> 그려 봐!</div>
      <div class="cv-wrap"><canvas id="cv"></canvas></div>
      <div class="center" style="margin-top:10px">${pred ? '<div class="doneBox" style="font-size:24px">🔮 예언 제출 완료! 다시 그려서 바꿔도 돼요</div>' : ''}
        <button class="btn sky" id="clr">🧽 다시 그리기</button><button class="btn big mint" id="sendPred">🔮 예언 제출!</button></div></div>`;
    setupCanvas(prices, N, pred ? pred.pts : null, i);
    return;
  }
  if (st.phase === 'ladder') {
    const li = st.li ?? -1, p = li >= 0 ? prices[li] : null;
    const last = my ? my.last : -1;
    const canBid = li >= 0 && last === li - 1, raised = li >= 0 && last >= li, out = li > 0 && last < li - 1;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage">
      <div class="muted" style="font-size:22px">${esc(it.emoji)} ${esc(it.name)}${S ? ` · 📦 ${S}개` : ''}</div>
      <div class="price-big">${p === null ? '두구두구…' : kw(p)}</div>
      ${p === null ? '<div class="rule">곧 첫 가격을 불러요!</div>'
        : raised ? `<div class="stand pop">✋ 살래!<br><span style="font-size:22px">다음 가격이 나오면 또 눌러야 계속 살 수 있어요</span></div>`
        : out ? `<div class="sit">🙅 여기까지!<br><span style="font-size:22px">${last >= 0 ? `나는 ${kw(prices[last])}까지 사겠다고 했어요` : '이번 물건은 안 사기로 했어요'}</span></div>`
        : `<div class="rule">이 가격에도 살래?</div><button class="btn big mint" id="buy" style="font-size:44px;padding:26px 60px">✋ 살래!</button><div class="muted" style="font-size:18px">안 누르고 다음 가격으로 넘어가면 탈락이에요</div>`}
      </div></div>`;
    if (el('buy')) el('buy').onclick = () => { el('buy').disabled = true; set(AP(`ans/${i}/${pid}`), { last: li, at: Date.now() }); };
    void canBid;
    return;
  }
  if (st.phase === 'reveal') {
    const acc = (((room.acc || {})[i]) || {})[pid], N = nOf(i), ans = ansOf(i), eq = equilibrium(ans, prices, S);
    const got = eq && !eq.short && eq.exact && eq.winners.includes(pid);
    const eqLine = !S || !eq ? '' : eq.short ? `<div class="hl sky">🔵 다 사도 ${eq.left}개가 남았어요 (초과 공급)</div>`
      : eq.exact ? `<div class="hl ${got ? 'mint' : 'lemon'}">🎯 균형 가격 ${kw(eq.p)} · ${got ? '🔨 낙찰! 내가 산다~' : my ? '아쉽게 못 샀어요' : '이번엔 안 샀어요'}</div>`
      : `<div class="hl lemon">🎯 ${kw(eq.p)}에선 ${eq.q}명이 ${S}개를 원해요 → 초과 수요!</div>`;
    if (acc === undefined || acc === null) {
      app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="bigEmoji">🔨</div><div class="title" style="font-size:40px">낙찰!</div>${eqLine}<div class="rule">칠판으로 진짜 곡선을 봐요 👀</div></div></div>`;
      return;
    }
    const { g, x, y } = axes(prices, N);
    const svg = `<svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}<path d="${stairPath(ans, prices.length, x, y, prices.length - 1)}" fill="none" stroke="#E8803E" stroke-width="6"/><path d="${predPath(pred && pred.pts, x, y)}" fill="none" stroke="#3B8FD9" stroke-width="5"/></svg>`;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="gap:8px">
      <div class="muted" style="font-size:22px">내 예언 정확도</div>
      <div class="acc"><span id="accN">0.0</span><small>%</small></div>
      <div class="rule" id="accC" style="opacity:0">${accComment(acc)}</div>${eqLine}
      <div class="card svgbox" style="width:100%">${svg}<div class="legend"><span class="pill"><span class="sw" style="background:#E8803E"></span>진짜 곡선</span><span class="pill"><span class="sw" style="background:#3B8FD9"></span>내 예언</span></div></div></div></div>`;
    const t0 = performance.now(), D = 1600;
    const anim = t => { const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); const n = el('accN'); if (!n) return; n.textContent = (acc * e).toFixed(1); if (k < 1) requestAnimationFrame(anim); else { el('accC').style.opacity = 1; el('accC').classList.add('pop'); } };
    requestAnimationFrame(anim);
    return;
  }
  if (st.phase === 'final') {
    const mine = itemsOf().map((_, k) => (((room.acc || {})[k]) || {})[pid]).filter(a => a !== undefined && a !== null);
    const avg = mine.length ? mine.reduce((a, b) => a + b, 0) / mine.length : null;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="bigEmoji bounce">🏁</div><div class="title" style="font-size:40px">경매 끝!</div>
      ${avg !== null ? `<div class="muted" style="font-size:22px">내 평균 예언 정확도</div><div class="acc" style="font-size:80px">${avg.toFixed(1)}<small>%</small></div><div class="rule">${accComment(avg)}</div>` : ''}
      <div class="rule muted">칠판에서 곡선들을 비교해 봐요 🧐</div></div></div>`;
  }
}

/* 손가락으로 곡선 그리기 (세로축 = 선생님이 부를 가격 칸) */
function setupCanvas(prices, N, initPts, i) {
  const cv = el('cv'), ctx = cv.getContext('2d'), Lv = prices.length;
  const dpr = window.devicePixelRatio || 1, cw = cv.clientWidth, ch = Math.min(540, Math.round(cw * 0.8));
  cv.style.height = ch + 'px'; cv.width = cw * dpr; cv.height = ch * dpr; ctx.scale(dpr, dpr);
  const L = 88, R = 14, Tp = 10, B = 40, pw = cw - L - R, ph = ch - Tp - B;
  const X = q => L + q / Math.max(1, N) * pw, Y = lv => Tp + (1 - (lv + 0.5) / Lv) * ph;   // 싼 가격이 아래
  const toData = (px, py) => [Math.max(0, Math.min(N, (px - L) / pw * N)), Math.max(0, Math.min(Lv - 1, (1 - (py - Tp) / ph) * Lv - 0.5))];
  let pts = initPts ? initPts.map(a => [...a]) : [], drawing = false;
  function draw() {
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#FFFDF9'; ctx.fillRect(L, Tp, pw, ph);
    ctx.font = '14px Jua'; ctx.fillStyle = '#A3919C'; ctx.textAlign = 'right';
    prices.forEach((p, lv) => { ctx.strokeStyle = '#F2E6EC'; ctx.beginPath(); ctx.moveTo(L, Y(lv)); ctx.lineTo(L + pw, Y(lv)); ctx.stroke(); ctx.fillText(kw(p), L - 6, Y(lv) + 5); });
    ctx.textAlign = 'center';
    const qs = N <= 12 ? 1 : N <= 30 ? 2 : 5;
    for (let q = 0; q <= N; q += qs) { ctx.strokeStyle = '#F6EEF2'; ctx.beginPath(); ctx.moveTo(X(q), Tp); ctx.lineTo(X(q), Tp + ph); ctx.stroke(); ctx.fillText(q, X(q), Tp + ph + 18); }
    ctx.fillText('사겠다는 사람 수(명) →', L + pw / 2, ch - 4);
    if (pts.length > 1) { ctx.strokeStyle = '#3B8FD9'; ctx.lineWidth = 5; ctx.lineJoin = ctx.lineCap = 'round'; ctx.beginPath(); pts.forEach(([q, lv], k) => k ? ctx.lineTo(X(q), Y(lv)) : ctx.moveTo(X(q), Y(lv))); ctx.stroke(); }
    else { ctx.fillStyle = '#D9C9D2'; ctx.font = '20px Jua'; ctx.fillText('👆 여기에 손가락으로 쭉~ 그려요', L + pw / 2, Tp + ph / 2); }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return toData(e.clientX - r.left, e.clientY - r.top); };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; pts = [pos(e)]; draw(); };
  cv.onpointermove = e => { if (!drawing) return; e.preventDefault(); const p = pos(e), l = pts[pts.length - 1]; if (Math.abs(p[0] - l[0]) / Math.max(1, N) + Math.abs(p[1] - l[1]) / Lv > .008) { pts.push(p); draw(); } };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  el('clr').onclick = () => { pts = []; draw(); };
  el('sendPred').onclick = () => {
    if (pts.length < 2) return toast('먼저 곡선을 그려 주세요 ✍️');
    const step = Math.max(1, Math.ceil(pts.length / 80));
    const slim = pts.filter((_, k) => k % step === 0 || k === pts.length - 1).map(([q, lv]) => [Math.round(q * 100) / 100, Math.round(lv * 100) / 100]);
    set(AP(`preds/${i}/${pid}`), { pts: slim, at: Date.now() }).then(() => toast('🔮 예언 제출 완료!'));
  };
  draw();
}

start();
</script>
</body>
