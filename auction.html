<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>다연샘 경매소 🔨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 「떡볶이 시장」과 같은 디자인 */
:root{
  --bg:#FFF9F4; --ink:#5B4B57; --sub:#A3919C; --line:#F2E6EC; --card:#FFFFFF;
  --pink:#FFE3EA; --pinkD:#F4A9BD; --mint:#DDF5EA; --mintD:#8FD5B5;
  --lemon:#FFF5CC; --lemonD:#F2D477; --lav:#ECE5FF; --lavD:#B8A7EE;
  --sky:#E0F0FF; --skyD:#93C4EE; --peach:#FFE9DA; --peachD:#F5B48C; --red:#FFD9D9; --redD:#EE9A9A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua',sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#F6E3EA 1.4px,transparent 1.4px);background-size:22px 22px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.s-wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.muted{color:var(--sub)} .center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
h3{margin:0 0 12px;font-size:22px;font-weight:normal}
.btn{background:var(--pink);border-radius:20px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 var(--pinkD);transition:transform .08s;margin:4px 4px 4px 0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}
.btn.lemon{background:var(--lemon);box-shadow:0 5px 0 var(--lemonD)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lavD)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.peach{background:var(--peach);box-shadow:0 5px 0 var(--peachD)}
.btn.big{font-size:28px;padding:18px 36px}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)}
.title{font-size:44px;margin:6px 0;letter-spacing:1px} .title span{color:var(--peachD)}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topbar .logo{font-size:26px;margin-right:auto}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lemon);border-radius:999px;padding:7px 14px;font-size:18px}
.chip.soft{background:var(--sky)}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;margin:0}
.lobby{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:72px;letter-spacing:8px;color:var(--peachD);line-height:1}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:14px}
.stage{min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.bigEmoji{font-size:110px;line-height:1}
.rule{font-size:26px;line-height:1.5}
.roundBadge{display:inline-block;background:var(--lemon);border-radius:999px;padding:8px 22px;font-size:24px;box-shadow:0 4px 0 var(--lemonD)}
.timer{font-size:110px;line-height:1;color:var(--peachD)}
.timer.s{font-size:56px}
.timer.hurry{color:var(--redD);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.bar{height:22px;background:var(--line);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mintD),var(--skyD));border-radius:999px;transition:width .3s linear}
.bar.hurry>i{background:linear-gradient(90deg,var(--peachD),var(--pinkD))}
.dur{display:inline-flex;align-items:center;gap:8px;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 6px}
.dur b{color:var(--peachD);font-weight:normal;font-size:24px}
.dur .btn{margin:0}
.hl{background:var(--lemon);border-radius:20px;padding:14px 18px;font-size:22px;line-height:1.5;margin-top:10px}
.hl.mint{background:var(--mint)} .hl.peach{background:var(--peach)} .hl.lav{background:var(--lav)} .hl.sky{background:var(--sky)} .hl.red{background:var(--red)}
/* 결과표 */
table{border-collapse:separate;border-spacing:4px;width:100%;font-size:20px}
th,td{border-radius:12px;padding:8px 6px;text-align:center;font-weight:normal}
thead th{background:var(--lemon)}
tbody th{background:var(--peach)}
td{background:#fff;border:2px solid var(--line);color:var(--line)}
td.on{background:var(--mint);border-color:var(--mintD);color:var(--ink);font-size:28px}
td.sum{background:var(--lav);border-color:var(--lav);color:var(--ink)}
.q{border-top:2px dashed var(--line);padding:14px 0}
.q p{font-size:24px;margin:0 0 8px;line-height:1.45}
.q b{color:var(--peachD);font-weight:normal}
/* 학생 카드 (교과서 카드 모양) */
.tcard{border-radius:28px;padding:22px;text-align:center;border:4px solid;position:relative}
.tcard.buyer{background:var(--sky);border-color:var(--skyD);box-shadow:0 8px 0 var(--skyD)}
.tcard.seller{background:var(--peach);border-color:var(--peachD);box-shadow:0 8px 0 var(--peachD)}
.tcard .role{font-size:34px}
.tcard .amt{display:inline-block;font-size:64px;background:#fff;border-radius:22px;padding:4px 26px;margin:8px 0}
.tcard .desc{font-size:20px;line-height:1.5}
.tcard .rn{position:absolute;top:12px;left:16px;font-size:15px;color:var(--sub)}
.s-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.s-top .me{margin-right:auto;font-size:22px}
.field{width:100%;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:#fff;outline:none;font-family:inherit;color:var(--ink);margin:6px 0}
.field:focus{border-color:var(--peachD)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 6px;font-size:22px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.sel{background:var(--lemon);border-color:var(--lemonD);box-shadow:0 4px 0 var(--lemonD)}
.lab{font-size:20px;margin-top:6px}
.doneBox{background:var(--mint);border-radius:24px;padding:22px;font-size:28px;text-align:center}
.doneBox.wait{background:var(--lemon)} .doneBox.bad{background:var(--red)} .doneBox.none{background:var(--lav)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;border:3px solid var(--peachD);border-radius:20px;padding:14px 22px;font-size:22px;z-index:99;box-shadow:0 6px 0 var(--peachD);max-width:92vw;text-align:center}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ===== 🌈 안내문: 일부러 촌스럽고 눈에 확 띄게 ===== */
.ann{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;cursor:pointer;animation:annIn .45s cubic-bezier(.2,1.7,.4,1)}
.ann::before{content:'';position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;
  background:repeating-conic-gradient(#FF9EBB 0 10deg,#FFC48A 10deg 20deg,#FFF08A 20deg 30deg,#A8F0C0 30deg 40deg,#9ED8FF 40deg 50deg,#C9B3FF 50deg 60deg);
  animation:spinbg 14s linear infinite}
.ann::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.95) 0 22%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%)}
.ann > *{position:relative;z-index:1}
.ann .rb{display:block;font-size:min(15vw,150px);line-height:1.08;text-align:center;padding:0 3vw;
  background:linear-gradient(90deg,#FF4F8B,#FF8A3D,#FFC81E,#3DD68C,#3DA9FF,#9B5CFF,#FF4F8B);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:4px #fff;
  filter:drop-shadow(0 7px 0 #5B4B57) drop-shadow(0 0 18px #fff);
  animation:rainbow 2s linear infinite,wobble .55s ease-in-out infinite alternate}
.ann .sub{font-size:min(6.5vw,46px);background:#fff;border:5px solid #5B4B57;border-radius:999px;padding:10px 34px;box-shadow:0 8px 0 #5B4B57;transform:rotate(-3deg);text-align:center;max-width:92vw}
.ann .emo{font-size:min(20vw,150px);line-height:1;animation:hop .5s ease-in-out infinite alternate}
.ann .fl{position:absolute;z-index:1;font-size:56px;animation:floaty 3s ease-in-out infinite alternate;pointer-events:none}
.ann .tap{position:absolute;bottom:18px;z-index:1;font-size:18px;color:#5B4B57;opacity:.7}
@keyframes spinbg{to{transform:rotate(360deg)}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes wobble{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.07)}}
@keyframes hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(8deg)}}
@keyframes floaty{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-40px) rotate(15deg)}}
@keyframes annIn{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.ann,.ann *,.ann::before{animation:none!important}}

/* ===== 경매소 전용 ===== */
.item-hero{display:flex;flex-direction:column;align-items:center;gap:6px}
.item-hero .ie{font-size:120px;line-height:1;animation:hop .7s ease-in-out infinite alternate}
.item-hero .in{font-size:40px}
.item-hero .ip{font-size:22px;background:var(--lemon);border-radius:999px;padding:6px 20px}
.price-big{font-size:96px;color:var(--peachD);line-height:1}
.price-big.s{font-size:64px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper .btn{font-size:34px;padding:10px 26px;margin:0}
input[type=range]{width:100%;accent-color:#F5B48C;height:36px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick .btn{margin:0}
.lock{background:var(--lav);border-radius:24px;padding:18px;font-size:26px;text-align:center}
.cv-wrap{background:#fff;border:3px solid var(--line);border-radius:22px;padding:6px;touch-action:none}
canvas{display:block;width:100%;touch-action:none;border-radius:16px}
.speech{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:12px 26px;font-size:34px;box-shadow:0 6px 0 var(--ink);max-width:92%}
.speech::after{content:'';position:absolute;left:46px;bottom:-22px;border:12px solid transparent;border-top-color:var(--ink)}
.hammer{font-size:80px;line-height:1;display:inline-block;transform-origin:80% 80%}
.hammer.bang{animation:bang .35s ease-in}
@keyframes bang{0%{transform:rotate(-40deg)}60%{transform:rotate(18deg)}100%{transform:rotate(0)}}
.acc{font-size:110px;line-height:1;color:var(--peachD)}
.acc small{font-size:50px}
.stand{background:var(--mint);border-radius:28px;padding:26px;font-size:40px;text-align:center;box-shadow:0 8px 0 var(--mintD)}
.sit{background:var(--line);border-radius:28px;padding:26px;font-size:32px;text-align:center}
.svgbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:middle;margin-right:4px}
.edit-row{display:grid;grid-template-columns:64px 1fr auto 44px;gap:6px;align-items:center;margin-bottom:6px}
.edit-row.one{grid-template-columns:1fr}
.edit-row label{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--sub)}
.edit-row .sup{flex-direction:row;align-items:center;gap:6px;white-space:nowrap}
.edit-row .sup input{width:70px}
.iedit{border-bottom:2px dashed var(--line);padding:8px 0}
.edit-row input,.edit-row select{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);color:var(--ink);width:100%}
@media (max-width:700px){.edit-row{grid-template-columns:52px 1fr auto 40px}}
.stat-big{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ===== v3: 준비 화면·카운트다운 ===== */
.edit-row{grid-template-columns:30px 64px 1fr auto!important}
.edit-row.one{grid-template-columns:1fr!important}
.iedit{border-bottom:2px dashed var(--line);padding:10px 0}
.cd{font-size:150px;line-height:1;color:var(--peachD);background:#fff;border:8px solid var(--peachD);border-radius:50%;width:230px;height:230px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 var(--peachD)}
.cd.hurry{color:var(--redD);border-color:var(--redD);box-shadow:0 10px 0 var(--redD);animation:beat .5s infinite}
.cdS{color:var(--peachD);font-weight:normal}
/* ===== 🌈 병맛 안내 화면: 무지개가 화면 가득 빙글빙글 ===== */
.ann{animation:annIn .45s cubic-bezier(.2,1.7,.4,1),hueSpin 2.4s linear infinite!important}
.ann::before{animation:spinbg 2.6s linear infinite!important}
.ann::after{background:radial-gradient(circle,rgba(255,255,255,.6) 0 16%,rgba(255,255,255,0) 42%)!important}
.ann .emo{animation:spinEmo 1.1s linear infinite!important}
.ann .rb{animation:rainbow .9s linear infinite,wobble .28s ease-in-out infinite alternate!important}
.ann .sub{animation:wobble .4s ease-in-out infinite alternate}
.ann .fl{animation:floaty 1.4s ease-in-out infinite alternate,spinEmo 2s linear infinite!important}
@keyframes hueSpin{to{filter:hue-rotate(360deg)}}
@keyframes spinEmo{to{transform:rotate(360deg)}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 「시장에 가면」·「떡볶이 시장」과 같은 Firebase 프로젝트 (데이터는 rooms/auction_코드 에 저장) */
const firebaseConfig = {
  apiKey: "AIzaSyDiehLZ1aKv8E3N_pD4bNmw0zgMexau99U",
  authDomain: "marketgo-80ab5.firebaseapp.com",
  databaseURL: "https://marketgo-80ab5-default-rtdb.firebaseio.com",

  appId: "1:666715038541:web:b0f84a9703aa70aeca4d04"
};
const db = getDatabase(initializeApp(firebaseConfig));
let offset = 0;
onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
const now = () => Date.now() + offset;   // 모든 기기가 같은 시계를 보도록 서버 시간 기준

/* ========== 기본 경매 상품 (준비 화면에서 바꿀 수 있어요) ==========
   prices: 부를 가격 (싼 가격부터 올라가요) / supply: 파는 개수 (0이면 공급선 없음) / predict: 🔮 예언하기 */
const DEFAULT_ITEMS = [
  { emoji: '🍫', name: '선생님 책상 위 에너지바', pitch: '선생님이 아껴 먹던 바로 그 에너지바! 단 1개!', prices: [500, 1000, 2000, 3000, 5000, 10000], supply: 1, predict: false },
  { emoji: '📄', name: '기말고사 사회 시험지 (답 없음)', pitch: '따끈따끈 인쇄 직후! 단 5명에게만 판매!', prices: [1000, 5000, 10000, 50000, 100000, 1000000, 10000000, 100000000], supply: 5, predict: true },
];
const SECS = [3, 5, 7, 10];
const COLORS = ['#3B8FD9', '#E8803E', '#2FA67A', '#B44FC9', '#D94F6A'];

const P = new URLSearchParams(location.search);
const isTeacher = P.get('t') === '1';
let code = P.get('room') || '';
const app = document.getElementById('app');
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A = (c = code) => ref(db, 'rooms/auction_' + c);
const AP = p => ref(db, `rooms/auction_${code}/${p}`);
let toastT;
const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast pop'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); };

// 가격 읽기·쓰기: "1천, 5만, 1억" ↔ 숫자
function kw(n) {
  n = Math.round(n);
  if (n === 0) return '0원';
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4), rest = n % 1e4;
  let s = '';
  if (eok) s += eok + '억';
  if (man) s += (s ? ' ' : '') + man.toLocaleString() + '만';
  if (rest) s += (s ? ' ' : '') + (rest % 1000 === 0 && !eok && !man ? (rest / 1000) + '천' : rest.toLocaleString());
  return s + '원';
}
function parsePrice(t) {
  t = String(t).replace(/[,\s원]/g, '');
  if (t === '') return null;
  let total = 0, m;
  const re = /(\d+(?:\.\d+)?)(억|만|천)?/g;
  while ((m = re.exec(t))) total += parseFloat(m[1]) * ({ '억': 1e8, '만': 1e4, '천': 1e3 }[m[2]] || 1);
  return Math.round(total);
}
const parseList = t => [...new Set(String(t).split(/[,\n→>\/]+/).map(parsePrice).filter(v => v !== null && v >= 0))].sort((a, b) => a - b);
const listText = ps => ps.map(p => kw(p).replace(/원$/, '').replace(/[ ,]/g, '')).join(', ');

/* ========== 🌈 병맛 안내 화면 (무지개 빙글빙글) ========== */
let annT;
function announce(big, sub = '', emo = '🌈', ms = 3200) {
  document.querySelectorAll('.ann').forEach(a => a.remove());
  const a = document.createElement('div');
  a.className = 'ann';
  const floaters = ['💸','🔨','✨','⭐','💰','💖','🪙','🌟','🧾','🫧','✨','💸'];
  a.innerHTML = floaters.map((f, i) => `<span class="fl" style="left:${(i * 83) % 92}%;top:${(i * 47) % 85}%;animation-delay:${(i % 5) * .3}s">${f}</span>`).join('')
    + `<div class="emo">${emo}</div><span class="rb">${big}</span>${sub ? `<div class="sub">${sub}</div>` : ''}<div class="tap">화면을 누르면 닫혀요</div>`;
  a.onclick = () => a.remove();
  document.body.appendChild(a);
  clearTimeout(annT); annT = setTimeout(() => a.remove(), ms);
}
const annSeen = new Set(); let firstPass = true;
function maybeAnnounce(key, fn) { if (annSeen.has(key)) return; annSeen.add(key); if (!firstPass) fn(); }

/* ========== 🔊 효과음 (선생님 화면) ========== */
const Snd = {
  ctx: null,
  ensure() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, t0 = 0, d = .18, v = .25, type = 'triangle') {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  noise(t0, d, v, freq) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + t0, len = Math.floor(c.sampleRate * d), b = c.createBuffer(1, len, c.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < len; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  },
  beep(last) { this.tone(last ? 1320 : 880, 0, last ? .6 : .13, .3, 'square'); },          // 띠 · 띠 · 띠—
  call() { this.tone(523, 0, .15, .25, 'square'); this.tone(784, .12, .25, .25, 'square'); },
  roll() { for (let k = 0; k < 22; k++) this.noise(k * .07, .06, .35, 1800); this.noise(1.6, .5, .5, 3000); this.tone(1047, 1.6, .5, .3, 'square'); },
  gavel() { this.noise(0, .18, .9, 900); this.tone(110, 0, .25, .5, 'sine'); this.noise(.28, .18, .9, 900); this.tone(110, .28, .25, .5, 'sine'); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .4, .25, 'square')); },
};

/* ========== 공통 계산 ========== */
const itemsOf = () => ((room && room.items) || DEFAULT_ITEMS).map(x => {
  const prices = Array.isArray(x.prices) && x.prices.length ? [...x.prices].map(Number).sort((a, b) => a - b) : [1000, 5000, 10000];
  return { ...x, prices, supply: Math.max(0, Math.floor(+x.supply || 0)), predict: !!x.predict };
});
// ans[상품][학생] = { last: ✋ 산다고 한 가장 비싼 가격 칸, quit: 안 산다고 한 칸 }  (0 = 가장 싼 가격)
const ansOf = i => ((room.ans || {})[i]) || {};
const nOf = i => ((((room.meta || {})[i]) || {}).n) || Math.max(1, Object.keys(room.players || {}).length);
const Qat = (ans, lv) => Object.values(ans).filter(a => a.last >= lv).length;          // lv 칸 가격에서 사겠다는 사람 수
const sortedAns = ans => Object.entries(ans).map(([pid, a]) => ({ pid, last: a.last ?? -1, at: a.at || 0 })).filter(a => a.last >= 0).sort((a, b) => b.last - a.last || a.at - b.at);
// 점 찍기 예언 → 가격 칸마다 예측 인원 (pts = [[인원, 칸], ...])
function predQ(pts, lv) {
  if (!pts || pts.length < 2) return null;
  const s = [...pts].sort((a, b) => a[1] - b[1]);
  if (lv <= s[0][1]) return s[0][0];
  if (lv >= s[s.length - 1][1]) return s[s.length - 1][0];
  for (let i = 1; i < s.length; i++) if (s[i][1] >= lv) { const [x0, y0] = s[i - 1], [x1, y1] = s[i]; return y1 === y0 ? (x0 + x1) / 2 : x0 + (x1 - x0) * (lv - y0) / (y1 - y0); }
  return s[s.length - 1][0];
}
function accuracy(pts, upto, ans, N) {            // 실제로 부른 칸(0~upto)만 채점
  if (!pts || pts.length < 2 || upto < 0) return null;
  let err = 0;
  for (let lv = 0; lv <= upto; lv++) err += Math.abs(predQ(pts, lv) - Qat(ans, lv));
  return Math.max(0, Math.round(1000 * (1 - 2 * err / (upto + 1) / Math.max(1, N))) / 10);   // 평균 오차가 반 인원의 절반이면 0%
}
const accComment = a => a >= 95 ? '🔮 신내림 받았다!!' : a >= 85 ? '🧠 경제학자 꿈나무!' : a >= 70 ? '👀 오~ 감 좋은데?' : a >= 50 ? '🤔 반쯤 맞았다!' : '🌀 그래프가 우주로 떠났어요';
function gapText(q, S) {
  if (!S) return '';
  if (q > S) return `🔴 초과 수요 ${q - S}명! (사려는 사람 ${q}명 > 파는 개수 ${S}개)`;
  if (q < S) return `🔵 초과 공급 ${S - q}개 (안 팔리고 남아요)`;
  return `🎯 딱 맞아요! 사려는 사람 ${q}명 = 파는 개수 ${S}개`;
}

/* ========== 그래프 (SVG): 세로축 = 부른 가격 칸(싼 가격이 아래), 학생 한 명 = 막대 하나 ========== */
const W = 1000, H = 560, ML = 118, MR = 24, MT = 24, MB = 52;
function axes(prices, N, upto = prices.length - 1) {
  const L = prices.length, pw = W - ML - MR, ph = H - MT - MB;
  const x = q => ML + q / Math.max(1, N) * pw, y = lv => MT + (1 - (lv + 0.5) / L) * ph;
  let g = `<rect x="${ML}" y="${MT}" width="${pw}" height="${ph}" fill="#FFFDF9" stroke="#F2E6EC" stroke-width="2" rx="8"/>`;
  prices.forEach((p, lv) => { g += `<line x1="${ML}" x2="${W - MR}" y1="${y(lv)}" y2="${y(lv)}" stroke="#F2E6EC"/><text x="${ML - 10}" y="${y(lv) + 6}" text-anchor="end" font-size="18" fill="${lv <= upto ? '#A3919C' : '#E6DCE2'}">${lv <= upto ? kw(p) : '?'}</text>`; });
  const qs = N <= 12 ? 1 : N <= 30 ? 2 : 5;
  for (let q = 0; q <= N; q += qs) g += `<text x="${x(q)}" y="${H - MB + 24}" text-anchor="middle" font-size="17" fill="#A3919C">${q}</text>`;
  g += `<text x="${ML - 8}" y="${MT - 6}" text-anchor="end" font-size="15" fill="#A3919C">가격</text><text x="${W - MR}" y="${H - 6}" text-anchor="end" font-size="15" fill="#A3919C">사겠다는 사람 수(명)</text>`;
  return { g, x, y, bottom: MT + ph };
}
function stairPath(ans, x, y, upto) {
  let d = '';
  for (let lv = upto; lv >= 0; lv--) { const q = Qat(ans, lv); d += d ? ` L${x(Qat(ans, lv + 1))},${y(lv)} L${x(q)},${y(lv)}` : `M${x(0)},${y(lv)} L${x(q)},${y(lv)}`; }
  return d;
}
function predPath(pts, x, y) { const s = pts ? [...pts].sort((a, b) => a[1] - b[1]) : []; return s.length > 1 ? 'M' + s.map(([q, lv]) => `${x(q)},${y(lv)}`).join(' L') : ''; }
// upto = 결과를 공개한 마지막 칸, hot = 지금 칸 강조
function barsSVG(ans, prices, N, upto, names, S, extra = '', hot = true) {
  const { g, x, y, bottom } = axes(prices, N, upto), bw = x(1) - x(0), list = sortedAns(ans);
  let bars = '';
  if (upto >= 0) list.forEach((a, k) => {
    const top = Math.min(a.last, upto), inNow = hot && a.last >= upto, over = S && inNow && k >= S;
    bars += `<rect x="${x(k) + 2}" y="${y(top) - 14}" width="${bw - 4}" height="${bottom - y(top) + 14}" rx="6" fill="${over ? '#FFD9D9' : inNow ? '#FFC48A' : '#DDF5EA'}" stroke="${over ? '#EE9A9A' : inNow ? '#F5B48C' : '#8FD5B5'}" stroke-width="${inNow ? 3 : 1.5}"/>`;
    if (names) { const fs = Math.max(11, Math.min(18, bw / 2.4)); bars += `<text transform="translate(${x(k) + bw / 2 + fs / 3},${y(top) - 6}) rotate(90)" font-size="${fs}" fill="#5B4B57">${esc(names(a.pid))}</text>`; }
  });
  const q = upto >= 0 ? Qat(ans, upto) : 0;
  let ann = '';
  if (upto >= 0 && hot) {
    ann += `<rect x="${ML}" y="${y(upto) - 16}" width="${W - MR - ML}" height="32" fill="#F4A9BD" opacity=".15"/>`;
    if (S && q > S) ann += `<rect x="${x(S)}" y="${y(upto) - 16}" width="${x(q) - x(S)}" height="32" rx="8" fill="#EE9A9A" opacity=".5"/><text x="${(x(S) + x(q)) / 2}" y="${y(upto) + 7}" text-anchor="middle" font-size="20" fill="#B03A52">초과 수요 ${q - S}</text>`;
    if (S && q < S) ann += `<rect x="${x(q)}" y="${y(upto) - 16}" width="${x(Math.min(S, N)) - x(q)}" height="32" rx="8" fill="#93C4EE" opacity=".5"/><text x="${(x(Math.min(S, N)) + x(q)) / 2}" y="${y(upto) + 7}" text-anchor="middle" font-size="20" fill="#2A6FB0">초과 공급 ${S - q}</text>`;
  }
  const sx = x(Math.min(S, N));
  const sup = S ? `<line x1="${sx}" x2="${sx}" y1="${MT}" y2="${bottom}" stroke="#3B8FD9" stroke-width="4" stroke-dasharray="12 7"/><text x="${sx + 6}" y="${MT + 20}" font-size="20" fill="#3B8FD9">파는 개수 ${S}개</text>` : '';
  const stair = upto >= 0 ? `<path d="${stairPath(ans, x, y, upto)}" fill="none" stroke="#E8803E" stroke-width="5" stroke-linejoin="round"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}${ann}${bars}${stair}${sup}${extra}</svg>`;
}
// 낙찰 정보: 사려는 사람이 처음으로 파는 개수 이하가 된 칸
function soldInfo(st, ans, it) {
  if (st.sold === null || st.sold === undefined) return null;
  const lv = st.sold, winners = sortedAns(ans).filter(a => a.last >= lv).map(a => a.pid), q = winners.length;
  return { lv, p: it.prices[lv], winners, left: Math.max(0, it.supply - q), tie: q > it.supply, prevP: lv > 0 ? it.prices[lv - 1] : null, prevQ: lv > 0 ? Qat(ans, lv - 1) : null };
}

async function join(c, name) {
  if (!/^\d{4}$/.test(c)) return toast('입장 코드 4자리를 써 주세요');
  if (!name) return toast('이름을 써 주세요');
  let snap;
  try { snap = await get(A(c)); } catch (e) { return toast('접속을 못 했어요 😢 인터넷을 확인해 주세요'); }
  if (!snap.exists()) return toast('그런 경매소가 없어요 😢 코드를 확인해 주세요');
  let id = localStorage.getItem('auction_pid_' + c);
  if (!id) {
    const ps = snap.val().players || {};
    const hit = Object.entries(ps).find(([, p]) => p.name === name && p.online !== true);   // 다른 기기로 다시 들어와도 이어서
    id = hit ? hit[0] : Math.random().toString(36).slice(2, 10);
    localStorage.setItem('auction_pid_' + c, id);
  }
  await update(ref(db, `rooms/auction_${c}/players/${id}`), { name, joinedAt: Date.now() });
  localStorage.setItem('auction_name', name); localStorage.setItem('auction_last_room', c);
  location.href = `?room=${c}`;
}

function wireTeacher(st, items, i, it) {
  const S = o => update(AP('state'), o);
  el('names').onclick = () => S({ showNames: !st.showNames });
  el('home').onclick = () => { if (confirm('처음 화면으로 갈까요? (경매소는 그대로 남아요)')) location.href = '?t=1'; };
  if (st.phase === 'setup') {
    const save = () => {
      const next = itemsOf().map(x => ({ ...x }));
      document.querySelectorAll('.iedit [data-f]').forEach(f => {
        const k = +f.dataset.k, fl = f.dataset.f;
        if (fl === 'supply') next[k].supply = Math.max(0, Math.floor(+f.value || 0));
        else if (fl === 'predict') next[k].predict = f.checked;
        else if (fl === 'prices') { const ps = parseList(f.value); if (ps.length >= 2) next[k].prices = ps; }
        else next[k][fl] = f.value;
      });
      set(AP('items'), next);
      try { localStorage.setItem('auction_last_items', JSON.stringify(next)); } catch (e) {}
    };
    document.querySelectorAll('.iedit input').forEach(inp => {
      if (inp.type === 'checkbox') { inp.onchange = () => { inp.blur(); save(); }; return; }
      inp.oninput = () => { clearTimeout(editT); editT = setTimeout(save, 800); };
      inp.onblur = () => { clearTimeout(editT); save(); };
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const n = itemsOf().filter((_, k) => k !== +b.dataset.del); if (n.length) set(AP('items'), n); });
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const n = itemsOf(), k = +b.dataset.up; [n[k - 1], n[k]] = [n[k], n[k - 1]]; set(AP('items'), n); });
    document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => S({ sec: +b.dataset.sec }));
    if (el('addItem')) el('addItem').onclick = () => set(AP('items'), [...itemsOf(), { emoji: '🎁', name: '새 상품', pitch: '', prices: [1000, 5000, 10000], supply: 1, predict: false }]);
    el('ready').onclick = () => S({ phase: 'lobby' });
  }
  if (st.phase === 'lobby') {
    el('toSetup').onclick = () => S({ phase: 'setup' });
    el('reveal').onclick = () => { Snd.ensure(); update(A(), { [`meta/0/n`]: Math.max(1, onlineIds().length), 'state/phase': 'item', 'state/item': 0, 'state/li': -1, 'state/sub': '', 'state/sold': null }); };
  }
  if (st.phase === 'item') {
    if (el('toPredict')) el('toPredict').onclick = () => { Snd.ensure(); S({ phase: 'predict' }); };
    if (el('toAuction')) el('toAuction').onclick = () => { Snd.ensure(); S({ phase: 'auction', li: -1, sub: '', sold: null }); };
  }
  if (st.phase === 'predict') el('toAuction').onclick = () => { Snd.ensure(); S({ phase: 'auction', li: -1, sub: '', sold: null }); };
  if (st.phase === 'auction') {
    if (el('call')) el('call').onclick = () => { Snd.ensure(); callNext(); };
    if (el('toResult')) el('toResult').onclick = () => finishItem();
  }
  if (st.phase === 'result') {
    if (el('next')) el('next').onclick = () => { Snd.ensure(); update(A(), { [`meta/${i + 1}/n`]: Math.max(1, onlineIds().length), 'state/phase': 'item', 'state/item': i + 1, 'state/li': -1, 'state/sub': '', 'state/sold': null }); };
    el('final').onclick = () => S({ phase: 'final' });
  }
}

function callNext() {
  const st = room.state, it = itemsOf()[st.item], li = (st.li ?? -1) + 1;
  if (li >= it.prices.length) return finishItem();
  lastBeep = null; Snd.call();
  update(AP('state'), { li, sub: 'ask', endsAt: now() + (st.sec || 5) * 1000 });
}
// 시간이 끝나면 선생님 화면이 그 가격 결과를 공개 (사려는 사람 ≤ 파는 개수가 되면 자동 낙찰)
function teacherTick() {
  if (!room) return;
  const st = room.state || {};
  if (st.phase !== 'auction' || st.sub !== 'ask') return;
  const rem = st.endsAt - now(), sec = Math.max(0, Math.ceil(rem / 1000)), cd = el('cd');
  if (cd) { cd.textContent = sec > 0 ? sec : '땡!'; cd.classList.toggle('hurry', sec <= 3); }
  if (sec !== lastBeep && sec >= 1 && sec <= 3) Snd.beep(false);
  if (sec !== lastBeep && sec === 0) Snd.beep(true);
  lastBeep = sec;
  if (rem <= -800 && !closing) {
    closing = true;
    const i = st.item, it = itemsOf()[i], q = Qat(ansOf(i), st.li), upd = { 'state/sub': 'show', [`meta/${i}/upto`]: st.li };
    if (it.supply && (st.sold === null || st.sold === undefined) && q <= it.supply) {
      if (q > 0) upd['state/sold'] = st.li;
      else if (st.li > 0 && Qat(ansOf(i), st.li - 1) > 0) upd['state/sold'] = st.li - 1;   // 한꺼번에 다 빠지면 바로 전 가격에 낙찰
    }
    update(A(), upd).finally(() => { closing = false; });
  }
}
async function finishItem() {
  const st = room.state, i = st.item, it = itemsOf()[i], upto = Math.max(0, st.li ?? 0);
  const acc = {};
  if (it.predict) Object.entries(((room.preds || {})[i]) || {}).forEach(([id, v]) => { acc[id] = accuracy(v.pts, upto, ansOf(i), nOf(i)); });
  await update(A(), { [`acc/${i}`]: acc, [`meta/${i}/upto`]: upto, 'state/phase': 'result' });
}

             <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
               <button class="btn big ${choice === 'buy' ? 'mint' : 'sky'}" id="buy" style="font-size:40px;padding:24px 44px;${choice === 'buy' ? 'outline:5px solid var(--mintD)' : ''}">✋ 살래!</button>
               <button class="btn big ${choice === 'no' ? 'peach' : 'sky'}" id="nope" style="font-size:40px;padding:24px 44px;${choice === 'no' ? 'outline:5px solid var(--peachD)' : ''}">🙅 안 살래</button></div>
             <div class="muted" style="font-size:18px">${choice ? '시간 안에는 바꿔도 돼요' : '안 고르면 안 사는 걸로 쳐요!'}</div>`}
      </div></div>`;
      if (el('buy')) {
        el('buy').onclick = () => { if (st.endsAt - now() <= 0) return; set(AP(`ans/${i}/${pid}`), { last: li, at: Date.now() }); };
        el('nope').onclick = () => { if (st.endsAt - now() <= 0) return; set(AP(`ans/${i}/${pid}`), { last: li - 1, quit: li, at: Date.now() }); };
      }
      return;
    }
    // 결과 공개 (sub === 'show')
    const won1 = st.sold !== null && st.sold !== undefined && last >= st.sold;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage">
      <div class="price-big s">${kw(p)}</div>
      ${choice === 'buy' ? '<div class="stand pop">✋ 살래! 했어요</div>' : out || last < li ? `<div class="sit">🙅 ${last >= 0 ? `나는 ${kw(prices[last])}까지!` : '이번 상품은 패스!'}</div>` : ''}
      ${st.sold !== null && st.sold !== undefined ? `<div class="hl ${won1 ? 'mint' : 'lemon'}" style="font-size:26px">${won1 ? `🔨 낙찰!! ${kw(prices[st.sold])}에 내가 산다~ 🎉` : `🔨 ${kw(prices[st.sold])}에 낙찰됐어요! 이번엔 못 샀어요`}</div>` : ''}
      <div class="rule muted">칠판을 보세요 👀</div></div></div>`;
    return;
  }
  if (st.phase === 'result') {
    const acc = (((room.acc || {})[i]) || {})[pid], N = nOf(i), ans = ansOf(i), upto = Math.max(0, st.li ?? 0);
    const won1 = st.sold !== null && st.sold !== undefined && my && my.last >= st.sold;
    const soldLine = st.sold !== null && st.sold !== undefined ? `<div class="hl ${won1 ? 'mint' : 'lemon'}">🔨 ${kw(prices[st.sold])}에 낙찰 · ${won1 ? '내가 샀다! 🎉' : '이번엔 못 샀어요'}</div>` : '';
    if (!it.predict || acc === undefined || acc === null) return wait('📊', '경매 끝!', `${soldLine}칠판으로 우리 반 수요 곡선을 봐요 👀`);
    const { g, x, y } = axes(prices, N, upto);
    const svg = `<svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}<path d="${stairPath(ans, x, y, upto)}" fill="none" stroke="#E8803E" stroke-width="6"/><path d="${predPath(pred && pred.pts, x, y)}" fill="none" stroke="#3B8FD9" stroke-width="5"/></svg>`;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="gap:8px">
      <div class="muted" style="font-size:22px">내 예언 정확도</div>
      <div class="acc"><span id="accN">0.0</span><small>%</small></div>
      <div class="rule" id="accC" style="opacity:0">${accComment(acc)}</div>${soldLine}
      <div class="card svgbox" style="width:100%">${svg}<div class="legend"><span class="pill"><span class="sw" style="background:#E8803E"></span>진짜 곡선</span><span class="pill"><span class="sw" style="background:#3B8FD9"></span>내 예언</span></div></div></div></div>`;
    const t0 = performance.now(), D = 1600;
    const anim = t => { const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); const n = el('accN'); if (!n) return; n.textContent = (acc * e).toFixed(1); if (k < 1) requestAnimationFrame(anim); else { el('accC').style.opacity = 1; el('accC').classList.add('pop'); } };
    requestAnimationFrame(anim);
    return;
  }
  if (st.phase === 'final') {
    const mine = itemsOf().map((_, k) => (((room.acc || {})[k]) || {})[pid]).filter(a => a !== undefined && a !== null);
    const avg = mine.length ? mine.reduce((a, b) => a + b, 0) / mine.length : null;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="bigEmoji bounce">🏁</div><div class="title" style="font-size:40px">경매 끝!</div>
      ${avg !== null ? `<div class="muted" style="font-size:22px">내 예언 정확도</div><div class="acc" style="font-size:80px">${avg.toFixed(1)}<small>%</small></div><div class="rule">${accComment(avg)}</div>` : ''}
      <div class="rule muted">칠판에서 곡선들을 비교해 봐요 🧐</div></div></div>`;
  }
}
function studentTick() {
  if (!room) return;
  const st = room.state || {}, c = el('cdS');
  if (st.phase !== 'auction' || st.sub !== 'ask') return;
  const rem = st.endsAt - now(), sec = Math.max(0, Math.ceil(rem / 1000));
  if (c) c.textContent = sec > 0 ? `⏱ ${sec}초` : '⏰ 땡!';
  if (rem <= 0) { const b = el('buy'), n = el('nope'); if (b) b.disabled = true; if (n) n.disabled = true; }
}

/* 🔮 점 찍기 예언: 가격 줄마다 "이 가격이면 몇 명?" 점을 콕 → 자동으로 이어져요 */
function setupDots(prices, N, initPts, i) {
  const cv = el('cv'), ctx = cv.getContext('2d'), Lv = prices.length;
  const dpr = window.devicePixelRatio || 1, cw = cv.clientWidth, ch = Math.min(560, Math.max(320, Lv * 54 + 50));
  cv.style.height = ch + 'px'; cv.width = cw * dpr; cv.height = ch * dpr; ctx.scale(dpr, dpr);
  const L = 92, R = 18, Tp = 10, B = 40, pw = cw - L - R, ph = ch - Tp - B;
  const X = q => L + q / Math.max(1, N) * pw, Y = lv => Tp + (1 - (lv + 0.5) / Lv) * ph;
  const dots = {};   // 칸 번호 → 인원
  (initPts || []).forEach(([q, lv]) => { dots[Math.round(lv)] = Math.round(q); });
  let drag = null;
  const updCnt = () => { const c = el('cnt'); if (c) c.textContent = `점 ${Object.keys(dots).length} / ${Lv}`; };
  function draw() {
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#FFFDF9'; ctx.fillRect(L, Tp, pw, ph);
    ctx.font = '15px Jua'; ctx.textAlign = 'right';
    prices.forEach((p, lv) => { ctx.strokeStyle = dots[lv] === undefined ? '#F4D9E2' : '#F2E6EC'; ctx.lineWidth = dots[lv] === undefined ? 2 : 1; ctx.beginPath(); ctx.moveTo(L, Y(lv)); ctx.lineTo(L + pw, Y(lv)); ctx.stroke(); ctx.fillStyle = dots[lv] === undefined ? '#F4A9BD' : '#A3919C'; ctx.fillText(kw(p), L - 8, Y(lv) + 5); });
    ctx.textAlign = 'center'; ctx.fillStyle = '#A3919C'; ctx.lineWidth = 1;
    const qs = N <= 12 ? 1 : N <= 30 ? 2 : 5;
    for (let q = 0; q <= N; q += qs) { ctx.strokeStyle = '#F6EEF2'; ctx.beginPath(); ctx.moveTo(X(q), Tp); ctx.lineTo(X(q), Tp + ph); ctx.stroke(); ctx.fillText(q, X(q), Tp + ph + 18); }
    ctx.fillText('사겠다는 사람 수(명) →', L + pw / 2, ch - 4);
    const ks = Object.keys(dots).map(Number).sort((a, b) => a - b);
    if (ks.length > 1) { ctx.strokeStyle = '#3B8FD9'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath(); ks.forEach((lv, k) => k ? ctx.lineTo(X(dots[lv]), Y(lv)) : ctx.moveTo(X(dots[lv]), Y(lv))); ctx.stroke(); }
    ks.forEach(lv => { ctx.fillStyle = '#3B8FD9'; ctx.beginPath(); ctx.arc(X(dots[lv]), Y(lv), 11, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '13px Jua'; ctx.fillText(dots[lv], X(dots[lv]), Y(lv) + 5); });
    if (!ks.length) { ctx.fillStyle = '#D9C9D2'; ctx.font = '20px Jua'; ctx.fillText('👆 가격 줄마다 점을 콕!', L + pw / 2, Tp + ph / 2); }
    updCnt();
  }
  const hit = e => { const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const lv = Math.max(0, Math.min(Lv - 1, Math.round((1 - (py - Tp) / ph) * Lv - 0.5))), q = Math.max(0, Math.min(N, Math.round((px - L) / pw * N)));
    return { lv, q }; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); const h = hit(e); drag = h.lv; dots[h.lv] = h.q; draw(); };
  cv.onpointermove = e => { if (drag === null) return; e.preventDefault(); const h = hit(e); dots[drag] = h.q; draw(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  el('clr').onclick = () => { Object.keys(dots).forEach(k => delete dots[k]); draw(); };
  el('sendPred').onclick = () => {
    const ks = Object.keys(dots).map(Number);
    if (ks.length < Lv) return toast(`가격 줄마다 점을 다 찍어 주세요 (${ks.length}/${Lv}) 🔮`);
    set(AP(`preds/${i}/${pid}`), { pts: ks.sort((a, b) => a - b).map(lv => [dots[lv], lv]), at: Date.now() }).then(() => toast('🔮 예언 제출 완료!'));
  };
  draw();
}

start();
</script>
