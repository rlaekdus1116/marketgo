<style>
/* 「떡볶이 시장」과 같은 디자인 */

.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}

.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.peach{background:var(--peach);box-shadow:0 5px 0 var(--peachD)}

.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)}

.chip.soft{background:var(--sky)}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;margin:0}

  animation:spinbg 14s linear infinite}
.ann::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.95) 0 22%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%)}

.ann .sub{font-size:min(6.5vw,46px);background:#fff;border:5px solid #5B4B57;border-radius:999px;padding:10px 34px;box-shadow:0 8px 0 #5B4B57;transform:rotate(-3deg);text-align:center;max-width:92vw}

.item-hero{display:flex;flex-direction:column;align-items:center;gap:6px}

input[type=range]{width:100%;accent-color:#F5B48C;height:36px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.lock{background:var(--lav);border-radius:24px;padding:18px;font-size:26px;text-align:center}
.cv-wrap{background:#fff;border:3px solid var(--line);border-radius:22px;padding:6px;touch-action:none}
canvas{display:block;width:100%;touch-action:none;border-radius:16px}
.speech{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:12px 26px;font-size:34px;box-shadow:0 6px 0 var(--ink);max-width:92%}

.hammer{font-size:80px;line-height:1;display:inline-block;transform-origin:80% 80%}
.hammer.bang{animation:bang .35s ease-in}
@keyframes bang{0%{transform:rotate(-40deg)}60%{transform:rotate(18deg)}100%{transform:rotate(0)}}
.acc{font-size:110px;line-height:1;color:var(--peachD)}
.acc small{font-size:50px}
.stand{background:var(--mint);border-radius:28px;padding:26px;font-size:40px;text-align:center;box-shadow:0 8px 0 var(--mintD)}
.sit{background:var(--line);border-radius:28px;padding:26px;font-size:32px;text-align:center}
.svgbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:middle;margin-right:4px}
.edit-row{display:grid;grid-template-columns:70px 1fr 120px 100px 40px;gap:6px;align-items:center;margin-bottom:6px}
.edit-row input{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);color:var(--ink);width:100%}
@media (max-width:700px){.edit-row{grid-template-columns:56px 1fr 90px 80px 36px}}
.stat-big{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>

let annT;
function announce(big, sub = '', emo = '🌈', ms = 3200) {
  document.querySelectorAll('.ann').forEach(a => a.remove());
  const a = document.createElement('div');
  a.className = 'ann';
  const floaters = ['💸','🔨','✨','⭐','💰','💖','🪙','🌟','🧾','🫧','✨','💸'];

const annSeen = new Set(); let firstPass = true;
function maybeAnnounce(key, fn) { if (annSeen.has(key)) return; annSeen.add(key); if (!firstPass) fn(); }

/* ========== 🔊 효과음 (선생님 화면) ========== */
const Snd = {
  ctx: null,
  ensure() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, t0 = 0, d = .18, v = .25, type = 'triangle') {

    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  noise(t0, d, v, freq) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + t0, len = Math.floor(c.sampleRate * d), b = c.createBuffer(1, len, c.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < len; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / len);

const itemsOf = () => ((room && room.items) || DEFAULT_ITEMS).map(x => { const step = Math.max(100, +x.step || 500); return { ...x, step, max: Math.max(step, Math.round((+x.max || 10000) / step) * step) }; });
const pricesOf = it => { it = { ...it, max: Math.max(it.step, Math.round(it.max / it.step) * it.step) }; const out = []; for (let p = it.max; p >= 0; p -= it.step) out.push(p); if (out[out.length - 1] !== 0) out.push(0); return out; };
// 경매 사다리 시작 때 고정한 입찰 목록 (금액 높은 순)
const ladderOf = i => (((room.ladder || {})[i]) || []);
const Qof = (lad, p) => lad.filter(b => b.v >= p).length;
// 손으로 그린 선 → 가격마다 예측 수요량
function predQ(pts, p) {
  if (!pts || pts.length < 2) return null;
  const s = [...pts].sort((a, b) => a[1] - b[1]);

  if (p >= s[s.length - 1][1]) return s[s.length - 1][0];

}
const accComment = a => a >= 95 ? '🔮 신내림 받았다!!' : a >= 85 ? '🧠 경제학자 꿈나무!' : a >= 70 ? '👀 오~ 감 좋은데?' : a >= 50 ? '🤔 반쯤 맞았다!' : '🌀 그래프가 우주로 떠났어요';
function shout(p) { return p === 0 ? '0원! 공짜면 살 사람~?' : `${won(p)}에 살 사람~?`; }

/* ========== 그래프 (SVG) ========== */
const W = 1000, H = 560, ML = 92, MR = 24, MT = 20, MB = 52;
function axes(it, N) {
  const ps = pricesOf(it), pw = W - ML - MR, ph = H - MT - MB;
  const x = q => ML + q / Math.max(1, N) * pw, y = p => MT + (1 - p / it.max) * ph;
  let g = `<rect x="${ML}" y="${MT}" width="${pw}" height="${ph}" fill="#FFFDF9" stroke="#F2E6EC" stroke-width="2" rx="8"/>`;
  const every = ps.length > 14 ? 2 : 1;
  ps.forEach((p, i) => { if (i % every) return; g += `<line x1="${ML}" x2="${W - MR}" y1="${y(p)}" y2="${y(p)}" stroke="#F2E6EC"/><text x="${ML - 10}" y="${y(p) + 6}" text-anchor="end" font-size="17" fill="#A3919C">${Number(p).toLocaleString()}</text>`; });
  const qs = N <= 12 ? 1 : N <= 30 ? 2 : 5;
  for (let q = 0; q <= N; q += qs) g += `<line x1="${x(q)}" x2="${x(q)}" y1="${MT}" y2="${H - MB}" stroke="#F6EEF2"/><text x="${x(q)}" y="${H - MB + 24}" text-anchor="middle" font-size="17" fill="#A3919C">${q}</text>`;
  g += `<text x="${ML - 8}" y="${MT - 4}" text-anchor="end" font-size="15" fill="#A3919C">가격(원)</text><text x="${W - MR}" y="${H - 6}" text-anchor="end" font-size="15" fill="#A3919C">사겠다는 사람 수(명)</text>`;
  return { g, x, y, ps };
}
function stairPath(it, lad, x, y, upto) {
  const ps = pricesOf(it); let d = '';
  ps.forEach((p, i) => { if (i > upto) return; const q = Qof(lad, p); d += (i ? ` L${x(q)},${y(p)}` : `M${x(q)},${y(p)}`); const nx = ps[i + 1]; if (nx !== undefined && i + 1 <= upto) d += ` L${x(q)},${y(nx)}`; });
  return d;
}
function predPath(pts, x, y) { return pts && pts.length > 1 ? 'M' + pts.map(([q, p]) => `${x(q)},${y(p)}`).join(' L') : ''; }

// 경매 사다리: 이름 블록 계단 (upto = 지금까지 내려온 가격 칸)
function ladderSVG(it, lad, upto, names, extra = '') {
  const N = lad.length, { g, x, y, ps } = axes(it, N);
  const rh = (H - MT - MB) / Math.max(1, ps.length - 1), bw = (W - ML - MR) / Math.max(1, N);
  let blocks = '';
  ps.forEach((p, i) => {
    if (i > upto) return;
    const q = Qof(lad, p), prev = i ? Qof(lad, ps[i - 1]) : 0, cur = i === upto;
    for (let k = 0; k < q; k++) {
      const isNew = k >= prev;
      blocks += `<rect x="${x(k) + 1.5}" y="${y(p) - Math.min(rh, 30) / 2}" width="${bw - 3}" height="${Math.min(rh, 30) - 2}" rx="6" fill="${isNew ? (cur ? '#FFC48A' : '#FFE3B8') : '#DDF5EA'}" stroke="${isNew ? '#F5B48C' : '#8FD5B5'}" stroke-width="${isNew && cur ? 3 : 1.5}"/>`;
      if (isNew && names) blocks += `<text x="${x(k) + bw / 2}" y="${y(p) + 6}" text-anchor="middle" font-size="${Math.max(11, Math.min(18, bw / 3.2))}" fill="#5B4B57">${esc(names(lad[k].pid))}</text>`;
    }
  });
  const stair = upto >= 0 ? `<path d="${stairPath(it, lad, x, y, upto)}" fill="none" stroke="#E8803E" stroke-width="5" stroke-linejoin="round"/>` : '';
  const curLine = upto >= 0 && upto < ps.length ? `<line x1="${ML}" x2="${W - MR}" y1="${y(ps[upto])}" y2="${y(ps[upto])}" stroke="#F4A9BD" stroke-width="3" stroke-dasharray="8 6"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}${curLine}${blocks}${stair}${extra}</svg>`;
}

async function join(c, name) {
  if (!/^\d{4}$/.test(c)) return toast('입장 코드 4자리를 써 주세요');
  if (!name) return toast('이름을 써 주세요');
  let snap;
  try { snap = await get(A(c)); } catch (e) { return toast('접속을 못 했어요 😢 인터넷을 확인해 주세요'); }
  if (!snap.exists()) return toast('그런 경매소가 없어요 😢 코드를 확인해 주세요');
  let id = localStorage.getItem('auction_pid_' + c);
  if (!id) {
    const ps = snap.val().players || {};
    const hit = Object.entries(ps).find(([, p]) => p.name === name && p.online !== true);   // 다른 기기로 다시 들어와도 이어서
    id = hit ? hit[0] : Math.random().toString(36).slice(2, 10);
    localStorage.setItem('auction_pid_' + c, id);
  }
  await update(ref(db, `rooms/auction_${c}/players/${id}`), { name, joinedAt: Date.now() });
  localStorage.setItem('auction_name', name); localStorage.setItem('auction_last_room', c);
  location.href = `?room=${c}`;
}

          <div class="q"><p>2. 물건마다 곡선의 <b>위치</b>가 다르죠? 왜 그럴까요?</p></div>
          <div class="q"><p>3. 가격 말고 <b>사고 싶은 마음</b>을 바꾸는 건 또 뭐가 있을까요?</p></div></div>
        <div class="card"><h3>👑 오늘의 예언왕</h3>${kings.map(([id, a], k) => `<div class="rule">${['🥇','🥈','🥉'][k]} ${esc(nameOf(id))} <b style="color:var(--peachD)">평균 ${a.toFixed(1)}%</b></div>`).join('') || '<p class="muted">-</p>'}</div>
      </div>`;
  }
  app.innerHTML = `<div class="wrap">${topbar(st)}${body}</div>`;
  if (st.phase === 'lobby' && window.QRCode) new QRCode(el('qr'), { text: location.origin + location.pathname + '?room=' + code, width: 200, height: 200, colorDark: '#5B4B57', colorLight: '#ffffff' });
  wireTeacher(st, items, i, it, bids, preds);
}

function wireTeacher(st, items, i, it, bids, preds) {
  const S = (o) => update(AP('state'), o);
  el('names').onclick = () => S({ showNames: !st.showNames });
  el('home').onclick = () => { if (confirm('처음 화면으로 갈까요? (경매소는 그대로 남아요)')) location.href = '?t=1'; };
  document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { speed = b.dataset.speed; if (ladderTimer) { stopLadder(); runLadder(); } render.sig = ''; renderTeacher(); });
  if (st.phase === 'lobby') {
    document.querySelectorAll('.edit-row input').forEach(inp => inp.oninput = () => {
      clearTimeout(editT);
      editT = setTimeout(() => {
        const next = itemsOf().map(x => ({ ...x }));
        document.querySelectorAll('.edit-row input').forEach(f => { const k = +f.dataset.k, fl = f.dataset.f; next[k][fl] = (fl === 'max' || fl === 'step') ? Math.max(fl === 'step' ? 100 : 500, Math.round(+f.value / 100) * 100 || 0) : f.value; });
        next.forEach(x => { if (x.step > x.max) x.step = x.max; x.max = Math.max(x.step, Math.round(x.max / x.step) * x.step); });   // 최고 가격은 단위의 배수로
        set(AP('items'), next);
      }, 600);
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const n = itemsOf().filter((_, k) => k !== +b.dataset.del); if (n.length) set(AP('items'), n); });
    if (el('addItem')) el('addItem').onclick = () => set(AP('items'), [...itemsOf(), { emoji: '🎁', name: '새 물건', max: 10000, step: 500, pitch: '' }]);
    el('go').onclick = () => { Snd.ensure(); S({ phase: 'bid', item: 0, li: -1 }); };
  }
  if (st.phase === 'bid') el('toPredict').onclick = () => { Snd.ensure(); S({ phase: 'predict' }); };
  if (st.phase === 'predict') el('toLadder').onclick = async () => {
    Snd.ensure();
    const lad = Object.entries(bids).map(([id, b]) => ({ pid: id, v: Math.min(it.max, Math.max(0, +b.v || 0)) })).sort((a, b) => b.v - a.v || nameOf(a.pid).localeCompare(nameOf(b.pid)));
    await update(A(), { [`ladder/${i}`]: lad, 'state/phase': 'ladder', 'state/li': -1 });
    runLadder();
  };
  if (st.phase === 'ladder') {
    if (el('pause')) el('pause').onclick = () => { stopLadder(); render.sig = ''; renderTeacher(); };
    if (el('resumeL')) el('resumeL').onclick = () => { Snd.ensure(); runLadder(); };
  }
  if (st.phase === 'reveal') {
    if (el('next')) el('next').onclick = () => S({ phase: 'bid', item: i + 1, li: -1 });
    el('final').onclick = () => S({ phase: 'final' });
  }
}

function stopLadder() { clearInterval(ladderTimer); ladderTimer = null; }
function runLadder() {
  stopLadder();
  const tickL = async () => {
    const st = room.state, i = st.item, it = itemsOf()[i], ps = pricesOf(it), lad = ladderOf(i);
    const li = (st.li ?? -1) + 1;
    if (li >= ps.length) {
      stopLadder();
      const preds = ((room.preds || {})[i]) || {}, acc = {};
      Object.entries(preds).forEach(([id, v]) => { acc[id] = accuracy(v.pts, it, lad); });
      await update(A(), { [`acc/${i}`]: acc, 'state/phase': 'reveal' });
      return;
    }
    const prev = li ? Qof(lad, ps[li - 1]) : 0, q = Qof(lad, ps[li]);
    Snd.step(li === 0); if (q > prev) Snd.stand(q - prev);
    await update(AP('state'), { li });
    const h = el('ham'); if (h) { h.classList.remove('bang'); void h.offsetWidth; h.classList.add('bang'); }
  };
  ladderTimer = setInterval(tickL, SPEEDS[speed]);
  tickL();
  render.sig = ''; renderTeacher();
}

/* =========================================================
   🧒 학생 화면
   ========================================================= */
let myBid = null, stoodKey = '', drawPts = [], drawKey = '';
function renderStudent() {
  const st = room.state || {}, items = itemsOf(), i = st.item || 0, it = items[i] || items[0];
  const me = (room.players || {})[pid];
  if (!me) { localStorage.removeItem('auction_pid_' + code); return studentForm(code); }
  const bid = (((room.bids || {})[i]) || {})[pid], pred = (((room.preds || {})[i]) || {})[pid];
  const top = `<div class="s-top"><span class="me">🙂 ${esc(me.name)}</span><span class="pill">🔨 경매소 ${esc(code)}</span></div>`;
  const sig = [st.phase, i, st.li, bid && bid.locked, !!pred].join('|');
  if (sig === renderStudent.sig && st.phase !== 'ladder') return;
  const prevSig = renderStudent.sig; renderStudent.sig = sig;

  if (st.phase === 'lobby') {
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="min-height:70vh"><div class="hammer bounce">🔨</div>
      <div class="title" style="font-size:38px">입장 완료!</div><div class="rule">칠판을 보세요 👀<br>곧 경매가 시작돼요</div></div></div>`;
    return;
  }
  if (st.phase === 'bid') {
    if (bid && bid.locked) {
      app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="item-hero"><div class="ie">${esc(it.emoji)}</div><div class="in">${esc(it.name)}</div></div>
        <div class="lock">🔒 잠금 완료!<br><span style="font-size:20px">내 최대 금액은 <b>${won(bid.v)}</b> (친구들한텐 비밀 🤫)</span></div>
        <div class="rule muted">칠판을 보세요 👀</div></div></div>`;
      return;
    }
    if (myBid === null || drawKey !== 'bid' + i) { myBid = bid ? bid.v : Math.round(it.max / 2 / it.step) * it.step; drawKey = 'bid' + i; }
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="gap:12px">
      <div class="item-hero"><div class="ie">${esc(it.emoji)}</div><div class="in" style="font-size:30px">${esc(it.name)}</div>${it.pitch ? `<div class="ip" style="font-size:18px">${esc(it.pitch)}</div>` : ''}</div>
      <div class="rule">이거 <b>최대 얼마까지</b> 낼래? 🤔</div>
      <div class="price-big" id="pv">${won(myBid)}</div>
      <div class="stepper"><button class="btn sky" id="minus">−</button><button class="btn sky" id="plus">+</button></div>
      <input type="range" id="rng" min="0" max="${it.max}" step="${it.step}" value="${myBid}">
      <div class="quick"><button class="btn sm" data-q="0">0원 (안 사!)</button><button class="btn sm lemon" data-q="${Math.round(it.max / 2 / it.step) * it.step}">반값</button><button class="btn sm peach" data-q="${it.max}">💸 ${won(it.max)} 플렉스</button></div>
      <button class="btn big mint" id="lockBtn">🔒 이 금액으로 잠그기</button>
      <div class="muted" style="font-size:16px">진짜 돈은 안 내요! 솔직하게만 적어 주세요 😉</div></div></div>`;
    const setV = v => { myBid = Math.max(0, Math.min(it.max, Math.round(v / it.step) * it.step)); el('pv').textContent = won(myBid); el('rng').value = myBid; set(AP(`bids/${i}/${pid}`), { v: myBid, locked: false }); };
    el('minus').onclick = () => setV(myBid - it.step); el('plus').onclick = () => setV(myBid + it.step);
    el('rng').oninput = e => setV(+e.target.value);
    document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => setV(+b.dataset.q));
    el('lockBtn').onclick = () => { set(AP(`bids/${i}/${pid}`), { v: myBid, locked: true }); if (myBid === it.max) toast('💸 플렉스 확정!!'); else if (myBid === 0) toast('🪙 짠돌이 확정!'); };
    return;
  }
  if (st.phase === 'predict') {
    if (!bid) { app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="bigEmoji">☕</div><div class="rule">이번 물건은 입찰을 안 했어요<br>칠판을 구경해요 👀</div></div></div>`; return; }
    const N = Object.keys(((room.bids || {})[i]) || {}).length;
    if (pred && prevSig === sig) return;
    app.innerHTML = `<div class="s-wrap">${top}
      <div class="center"><span class="roundBadge" style="font-size:18px">🔮 예언 타임 · ${esc(it.emoji)} ${esc(it.name)}</span></div>
      <div class="rule center" style="font-size:22px;margin:10px 0">가격이 ${won(it.max)}에서 0원까지 내려가면<br><b>우리 반 ${N}명 중 몇 명</b>이 사겠다고 할까? <b>손가락으로 쭉~</b> 그려 봐!</div>
      <div class="cv-wrap"><canvas id="cv"></canvas></div>
      <div class="center" style="margin-top:10px">${pred ? '<div class="doneBox" style="font-size:24px">🔮 예언 제출 완료! 다시 그려서 바꿔도 돼요</div>' : ''}
        <button class="btn sky" id="clr">🧽 다시 그리기</button><button class="btn big mint" id="sendPred">🔮 예언 제출!</button></div></div>`;
    setupCanvas(it, N, pred ? pred.pts : null, i);
    return;
  }
  if (st.phase === 'ladder') {
    const lad = ladderOf(i), ps = pricesOf(it), li = Math.max(0, st.li ?? -1), p = ps[li];
    const mine = lad.find(b => b.pid === pid);
    if (!mine) { app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="price-big s">${won(p)}</div><div class="rule">이번 물건은 구경만! 칠판을 보세요 👀</div></div></div>`; return; }
    const up = st.li >= 0 && mine.v >= p;
    if (up && stoodKey !== 'up' + i) {
      stoodKey = 'up' + i;
      if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]);
      announce('지금이야!!!', '일어나!!! 🙋 (내 금액 ' + won(mine.v) + ')', '🙋', 2600);
    }
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage">
      <div class="muted" style="font-size:22px">지금 가격</div><div class="price-big">${st.li >= 0 ? won(p) : '두구두구…'}</div>
      ${up ? `<div class="stand pop">🙋 일어나 있어요!<br><span style="font-size:22px">이 가격이면 산다! (내 금액 ${won(mine.v)})</span></div>`
           : `<div class="sit">🪑 아직 앉아 있어요…<br><span style="font-size:20px">내 금액 ${won(mine.v)}까지 내려오면 알려줄게!</span></div>`}
      </div></div>`;
    return;
  }
  if (st.phase === 'reveal') {
    const lad = ladderOf(i), acc = (((room.acc || {})[i]) || {})[pid];
    if (acc === undefined || acc === null) {
      app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="bigEmoji">🔨</div><div class="title" style="font-size:40px">낙찰!</div><div class="rule">이번엔 예언을 안 했어요<br>칠판으로 진짜 곡선을 봐요 👀</div></div></div>`;
      return;
    }
    const { g, x, y } = axes(it, lad.length);
    const svg = `<svg viewBox="0 0 ${W} ${H}" font-family="Jua">${g}<path d="${stairPath(it, lad, x, y, pricesOf(it).length - 1)}" fill="none" stroke="#E8803E" stroke-width="6"/><path d="${predPath(pred && pred.pts, x, y)}" fill="none" stroke="#3B8FD9" stroke-width="5"/></svg>`;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage" style="gap:8px">
      <div class="muted" style="font-size:22px">내 예언 정확도</div>
      <div class="acc"><span id="accN">0.0</span><small>%</small></div>
      <div class="rule" id="accC" style="opacity:0">${accComment(acc)}</div>
      <div class="card svgbox" style="width:100%">${svg}<div class="legend"><span class="pill"><span class="sw" style="background:#E8803E"></span>진짜 곡선</span><span class="pill"><span class="sw" style="background:#3B8FD9"></span>내 예언</span></div></div></div></div>`;
    const t0 = performance.now(), D = 1600;
    const anim = t => { const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); const n = el('accN'); if (!n) return; n.textContent = (acc * e).toFixed(1); if (k < 1) requestAnimationFrame(anim); else { el('accC').style.opacity = 1; el('accC').classList.add('pop'); } };
    requestAnimationFrame(anim);
    return;
  }
  if (st.phase === 'final') {
    const mine = itemsOf().map((_, k) => (((room.acc || {})[k]) || {})[pid]).filter(a => a !== undefined && a !== null);
    const avg = mine.length ? mine.reduce((a, b) => a + b, 0) / mine.length : null;
    app.innerHTML = `<div class="s-wrap">${top}<div class="stage"><div class="bigEmoji bounce">🏁</div><div class="title" style="font-size:40px">경매 끝!</div>
      ${avg !== null ? `<div class="muted" style="font-size:22px">내 평균 예언 정확도</div><div class="acc" style="font-size:80px">${avg.toFixed(1)}<small>%</small></div><div class="rule">${accComment(avg)}</div>` : ''}
      <div class="rule muted">칠판에서 곡선들을 비교해 봐요 🧐</div></div></div>`;
  }
}

/* 손가락으로 곡선 그리기 */
function setupCanvas(it, N, initPts, i) {
  const cv = el('cv'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1, cw = cv.clientWidth, ch = Math.min(520, Math.round(cw * 0.78));
  cv.style.height = ch + 'px'; cv.width = cw * dpr; cv.height = ch * dpr; ctx.scale(dpr, dpr);
  const L = 62, R = 14, Tp = 14, B = 40, pw = cw - L - R, ph = ch - Tp - B;
  const X = q => L + q / Math.max(1, N) * pw, Y = p => Tp + (1 - p / it.max) * ph;
  const toData = (px, py) => [Math.max(0, Math.min(N, (px - L) / pw * N)), Math.max(0, Math.min(it.max, (1 - (py - Tp) / ph) * it.max))];
  let pts = initPts ? initPts.map(a => [...a]) : [], drawing = false;
  function draw() {
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#FFFDF9'; ctx.fillRect(L, Tp, pw, ph);
    ctx.font = '13px Jua'; ctx.fillStyle = '#A3919C'; ctx.textAlign = 'right';
    const ps = pricesOf(it), every = ps.length > 11 ? 2 : 1;
    ps.forEach((p, k) => { ctx.strokeStyle = '#F2E6EC'; ctx.beginPath(); ctx.moveTo(L, Y(p)); ctx.lineTo(L + pw, Y(p)); ctx.stroke(); if (!(k % every)) ctx.fillText(Number(p).toLocaleString(), L - 6, Y(p) + 4); });
    ctx.textAlign = 'center';
    const qs = N <= 12 ? 1 : N <= 30 ? 2 : 5;
    for (let q = 0; q <= N; q += qs) { ctx.strokeStyle = '#F6EEF2'; ctx.beginPath(); ctx.moveTo(X(q), Tp); ctx.lineTo(X(q), Tp + ph); ctx.stroke(); ctx.fillText(q, X(q), Tp + ph + 18); }
    ctx.fillText('사겠다는 사람 수(명) →', L + pw / 2, ch - 4);
    ctx.save(); ctx.translate(12, Tp + ph / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('가격(원) →', 0, 0); ctx.restore();
    if (pts.length > 1) { ctx.strokeStyle = '#3B8FD9'; ctx.lineWidth = 5; ctx.lineJoin = ctx.lineCap = 'round'; ctx.beginPath(); pts.forEach(([q, p], k) => k ? ctx.lineTo(X(q), Y(p)) : ctx.moveTo(X(q), Y(p))); ctx.stroke(); }
    else { ctx.fillStyle = '#D9C9D2'; ctx.font = '20px Jua'; ctx.fillText('👆 여기에 손가락으로 쭉~ 그려요', L + pw / 2, Tp + ph / 2); }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return toData(e.clientX - r.left, e.clientY - r.top); };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; pts = [pos(e)]; draw(); };
  cv.onpointermove = e => { if (!drawing) return; e.preventDefault(); const p = pos(e), l = pts[pts.length - 1]; if (Math.abs(p[0] - l[0]) / N + Math.abs(p[1] - l[1]) / it.max > .008) { pts.push(p); draw(); } };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  el('clr').onclick = () => { pts = []; draw(); };
  el('sendPred').onclick = () => {
    if (pts.length < 2) return toast('먼저 곡선을 그려 주세요 ✍️');
    const step = Math.max(1, Math.ceil(pts.length / 80));
    const slim = pts.filter((_, k) => k % step === 0 || k === pts.length - 1).map(([q, p]) => [Math.round(q * 100) / 100, Math.round(p)]);
    set(AP(`preds/${i}/${pid}`), { pts: slim, at: Date.now() }).then(() => toast('🔮 예언 제출 완료!'));
  };
  draw();
}

start();
</script>
