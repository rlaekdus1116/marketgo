<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>고@바 모찌 시장 🍡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 「시장에 가면」과 같은 디자인 */
:root{
  --bg:#FFF9F4; --ink:#5B4B57; --sub:#A3919C; --line:#F2E6EC; --card:#FFFFFF;
  --pink:#FFE3EA; --pinkD:#F4A9BD; --mint:#DDF5EA; --mintD:#8FD5B5;
  --lemon:#FFF5CC; --lemonD:#F2D477; --lav:#ECE5FF; --lavD:#B8A7EE;
  --sky:#E0F0FF; --skyD:#93C4EE; --peach:#FFE9DA; --peachD:#F5B48C; --red:#FFD9D9; --redD:#EE9A9A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background-image:radial-gradient(#F6E3EA 1.4px,transparent 1.4px);background-size:22px 22px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.s-wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.muted{color:var(--sub)} .center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
h3{margin:0 0 12px;font-size:22px;font-weight:normal}
.btn{background:var(--pink);border-radius:20px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 var(--pinkD);transition:transform .08s;margin:4px 4px 4px 0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mintD)}
.btn.lemon{background:var(--lemon);box-shadow:0 5px 0 var(--lemonD)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lavD)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD)}
.btn.peach{background:var(--peach);box-shadow:0 5px 0 var(--peachD)}
.btn.big{font-size:28px;padding:18px 36px}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 var(--pinkD)}
.btn.sm.mint{box-shadow:0 3px 0 var(--mintD)} .btn.sm.lemon{box-shadow:0 3px 0 var(--lemonD)} .btn.sm.sky{box-shadow:0 3px 0 var(--skyD)}
.title{font-size:44px;margin:6px 0;letter-spacing:1px} .title span{color:var(--peachD)}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topbar .logo{font-size:26px;margin-right:auto}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lemon);border-radius:999px;padding:7px 14px;font-size:18px}
.chip.soft{background:var(--sky)}
.chip .x{background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;margin:0}
.lobby{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:72px;letter-spacing:8px;color:var(--peachD);line-height:1}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:14px}
.stage{min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.bigEmoji{font-size:110px;line-height:1}
.rule{font-size:26px;line-height:1.5}
.roundBadge{display:inline-block;background:var(--lemon);border-radius:999px;padding:8px 22px;font-size:24px;box-shadow:0 4px 0 var(--lemonD)}
.timer{font-size:110px;line-height:1;color:var(--peachD)}
.timer.s{font-size:56px}
.bigT{position:fixed;inset:0;z-index:90;background:rgba(255,249,244,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer}
.bigTnum{font-size:min(38vw,62vh);line-height:1;color:var(--peachD);font-variant-numeric:tabular-nums}
.bigT.hurry .bigTnum{color:var(--redD);animation:beat .5s infinite}
.bigTbar{width:80vw;height:34px;background:var(--line);border-radius:999px;overflow:hidden}.bigTbar i{display:block;height:100%;background:var(--mintD);transition:width .3s linear}
.bigT.hurry .bigTbar i{background:var(--redD)}.bigTsub{font-size:20px;color:var(--sub)}
.timer.hurry{color:var(--redD);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.bar{height:22px;background:var(--line);border-radius:999px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mintD),var(--skyD));border-radius:999px;transition:width .3s linear}
.bar.hurry>i{background:linear-gradient(90deg,var(--peachD),var(--pinkD))}
.dur{display:inline-flex;align-items:center;gap:8px;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 6px}
.dur b{color:var(--peachD);font-weight:normal;font-size:24px}
.dur .btn{margin:0}
.hl{background:var(--lemon);border-radius:20px;padding:14px 18px;font-size:22px;line-height:1.5;margin-top:10px}
.hl.mint{background:var(--mint)} .hl.peach{background:var(--peach)} .hl.lav{background:var(--lav)} .hl.sky{background:var(--sky)} .hl.red{background:var(--red)}
/* 결과표 */
table{border-collapse:separate;border-spacing:4px;width:100%;font-size:20px}
th,td{border-radius:12px;padding:8px 6px;text-align:center;font-weight:normal}
thead th{background:var(--lemon)}
tbody th{background:var(--peach)}
td{background:#fff;border:2px solid var(--line);color:var(--line)}
td.on{background:var(--mint);border-color:var(--mintD);color:var(--ink);font-size:28px}
td.sum{background:var(--lav);border-color:var(--lav);color:var(--ink)}
.q{border-top:2px dashed var(--line);padding:14px 0}
.q p{font-size:24px;margin:0 0 8px;line-height:1.45}
.q b{color:var(--peachD);font-weight:normal}
/* 학생 카드 (교과서 카드 모양) */
.tcard{border-radius:28px;padding:22px;text-align:center;border:4px solid;position:relative}
.tcard.buyer{background:var(--sky);border-color:var(--skyD);box-shadow:0 8px 0 var(--skyD)}
.tcard.seller{background:var(--peach);border-color:var(--peachD);box-shadow:0 8px 0 var(--peachD)}
.tcard .role{font-size:34px}
.tcard .amt{display:inline-block;font-size:64px;background:#fff;border-radius:22px;padding:4px 26px;margin:8px 0}
.tcard .desc{font-size:20px;line-height:1.5}
.tcard .rn{position:absolute;top:12px;left:16px;font-size:15px;color:var(--sub)}
.s-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.s-top .me{margin-right:auto;font-size:22px}
.field{width:100%;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:#fff;outline:none;font-family:inherit;color:var(--ink);margin:6px 0}
.field:focus{border-color:var(--peachD)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 6px;font-size:22px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.sel{background:var(--lemon);border-color:var(--lemonD);box-shadow:0 4px 0 var(--lemonD)}
.lab{font-size:20px;margin-top:6px}
.doneBox{background:var(--mint);border-radius:24px;padding:22px;font-size:28px;text-align:center}
.doneBox.wait{background:var(--lemon)} .doneBox.bad{background:var(--red)} .doneBox.none{background:var(--lav)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;border:3px solid var(--peachD);border-radius:20px;padding:14px 22px;font-size:22px;z-index:99;box-shadow:0 6px 0 var(--peachD);max-width:92vw;text-align:center}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ===== 🌈 안내문: 일부러 촌스럽고 눈에 확 띄게 ===== */
.ann{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;cursor:pointer;animation:annIn .45s cubic-bezier(.2,1.7,.4,1)}
.ann::before{content:'';position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;
  background:repeating-conic-gradient(#FF9EBB 0 10deg,#FFC48A 10deg 20deg,#FFF08A 20deg 30deg,#A8F0C0 30deg 40deg,#9ED8FF 40deg 50deg,#C9B3FF 50deg 60deg);
  animation:spinbg 14s linear infinite}
.ann::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.95) 0 22%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%)}
.ann > *{position:relative;z-index:1}
.ann .rb{display:block;font-size:min(15vw,150px);line-height:1.08;text-align:center;padding:0 3vw;
  background:linear-gradient(90deg,#FF4F8B,#FF8A3D,#FFC81E,#3DD68C,#3DA9FF,#9B5CFF,#FF4F8B);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:4px #fff;
  filter:drop-shadow(0 7px 0 #5B4B57) drop-shadow(0 0 18px #fff);
  animation:rainbow 2s linear infinite,wobble .55s ease-in-out infinite alternate}
.ann .sub{font-size:min(6.5vw,46px);background:#fff;border:5px solid #5B4B57;border-radius:999px;padding:10px 34px;box-shadow:0 8px 0 #5B4B57;transform:rotate(-3deg);text-align:center;max-width:92vw}
.ann .emo{font-size:min(20vw,150px);line-height:1;animation:hop .5s ease-in-out infinite alternate}
.ann .fl{position:absolute;z-index:1;font-size:56px;animation:floaty 3s ease-in-out infinite alternate;pointer-events:none}
.ann .tap{position:absolute;bottom:18px;z-index:1;font-size:18px;color:#5B4B57;opacity:.7}
@keyframes spinbg{to{transform:rotate(360deg)}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes wobble{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.07)}}
@keyframes hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(8deg)}}
@keyframes floaty{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-40px) rotate(15deg)}}
@keyframes annIn{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.ann,.ann *,.ann::before{animation:none!important}}
button,input,textarea,select{font-family:inherit}
button,.btn,.speech,.rule,.title,.card{word-break:keep-all;overflow-wrap:break-word}
.stage,.card,.finGrid,.finPop,.s-wrap{min-width:0}
@media(max-width:700px){.price-big{font-size:clamp(44px,12vw,82px)}.speech{font-size:clamp(22px,6vw,34px);max-width:100%;padding:12px 14px}.title{font-size:clamp(28px,8vw,42px)}.btn{max-width:100%;white-space:normal}.finGrid{height:auto;min-height:0;display:block}.finPop{overflow:visible;min-height:300px}}

/* 학습용 그래프: 한 화면에 표+좌표평면, 큰 숫자와 직접 드래그 */
.practiceChart{display:block;width:100%;height:100%;max-height:100%;touch-action:none;user-select:none}
.graphPick{cursor:grab;touch-action:none}
.graphPick:active{cursor:grabbing}
.practiceGrid{stroke:#CCC6CF;stroke-width:1.5}
.practiceTable{width:100%;border-collapse:collapse;border-spacing:0;font-size:clamp(16px,1.7vw,22px);table-layout:fixed}
.practiceTable th,.practiceTable td{padding:10px 7px;border:1px solid #BDB0BC;border-radius:0!important;text-align:center;color:#302A32!important;font-weight:600;background:#fff}
.practiceTable th{background:#F9EFCF;font-weight:700}
.practiceTable tbody tr:nth-child(even) td{background:#FFF9F0}
.practiceTable tr.selected td{background:#FFF0B6}
.practiceChartWrap{height:100%;min-height:0;border:2px solid #BDB0BC;border-radius:18px;background:#fff;padding:6px}
.graphStudentScreen{max-width:none;width:100%;height:100vh;height:100dvh;min-height:0;padding:8px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.graphStudentScreen .s-top{margin:0;flex-shrink:0;min-height:38px}
.graphStudentScreen .card{margin:0;padding:12px;box-shadow:none;border-radius:16px}
.graphStudentPanel{display:grid;grid-template-columns:minmax(218px,29%) minmax(0,1fr);gap:10px;flex:1;min-height:0;overflow:hidden}
.graphDataSide{display:flex;flex-direction:column;gap:8px;min-height:0}
.graphPlotSide{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.graphPlotArea{min-height:0;flex:1;overflow:hidden}
.graphCompactTitle{font-size:clamp(21px,2.3vw,30px);line-height:1.2;margin:0;font-weight:normal}
.graphShort{font-size:clamp(14px,1.3vw,19px);line-height:1.3;margin:0}
.graphStrong{color:#302A32!important;font-weight:bold}
.graphBtnRow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.graphStudentScreen .btn{margin:0;padding:10px 14px;font-size:clamp(16px,1.5vw,21px);border-radius:14px}
.graphStudentScreen .btn.big{font-size:clamp(18px,1.7vw,24px);padding:10px 18px}
.graphProgress{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.graphFeedback{padding:8px 12px;background:#FFE9DA;border-radius:12px;font-size:clamp(14px,1.2vw,17px)}
.graphTableHorizontal{display:none}
.seesawScene{width:100%;max-width:850px;display:block;margin:4px auto;overflow:visible}
.seesawArm{transform-origin:420px 222px;transform:rotate(var(--tilt));transition:transform 800ms cubic-bezier(.2,.7,.2,1)}
@keyframes seesawMove{0%{transform:rotate(0deg)}65%{transform:rotate(var(--tilt))}82%{transform:rotate(calc(var(--tilt)*.93))}100%{transform:rotate(var(--tilt))}}
@media(max-width:700px){
 .graphStudentScreen{padding:5px 7px;gap:4px;min-height:0}
 .graphStudentPanel{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:6px}
 .graphStudentScreen .card{padding:8px;border-radius:13px}
 .graphDataSide{gap:4px}
 .graphTableVertical{display:none}
 .graphTableHorizontal{display:block}
 .graphTableHorizontal th,.graphTableHorizontal td{font-size:clamp(11px,2.8vw,15px);padding:5px 1px}
 .graphPlotSide{gap:5px}
 .graphStudentScreen .s-top{min-height:30px}
 .graphStudentScreen .s-top .me{font-size:17px}
 .graphStudentScreen .btn{font-size:15px;padding:7px 10px}
 .graphStudentScreen .btn.big{font-size:16px;padding:8px 12px}
}
@media(max-height:650px){
 .graphStudentScreen{min-height:0}
 .graphDataSide .graphShort{font-size:13px}
 .graphStudentScreen .card{padding:8px}
 .practiceTable th,.practiceTable td{padding:5px 4px;font-size:15px}
}
@media(prefers-reduced-motion:reduce){.seesawArm{transition:none}}
/* 결과 화면에서는 시소와 그래프를 나란히 보여주며, 이전 손익·가격 제안 화면은 숨깁니다. */
.seesawComparison{width:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.seesawIntro{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(19px,2.3vw,30px);padding:2px 6px}
.seesawIntro span{font-size:clamp(13px,1.3vw,17px);color:#645567}
.seesawColumns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;min-height:0;flex:1;align-items:stretch}
.seesawHalf{min-width:0;min-height:0;display:flex;flex-direction:column}
.seesawHalf>.card{flex:1;min-height:0;margin:0;padding:14px;box-shadow:none}
.seesawHalf>h3,.seesawHalf>.card>h3{font-size:clamp(21px,2vw,27px)}
.seesawHalf .seesawScene{max-width:100%;height:auto;max-height:38vh;flex:1;min-height:120px}
.seesawHalf .btn.sm{font-size:clamp(14px,1.2vw,18px);padding:8px 11px;margin:3px}
.seesawHalf .hl{margin-top:8px;padding:9px 11px}
.seesawGraphArea{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.seesawGraphArea .practiceChartWrap{width:100%;min-height:0;height:auto;max-height:100%;padding:2px;display:flex;justify-content:center}
.seesawGraphArea .practiceChart{height:auto;max-height:53vh}
.seesawStat{background:#F8F1FF;border-radius:12px;padding:9px;font-size:clamp(14px,1.55vw,21px);display:flex;gap:9px;justify-content:space-around;flex-wrap:wrap}
.seesawLegend{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:7px 0;font-size:clamp(14px,1.35vw,19px)}
.seesawLegend strong{color:#7845AB}
.graphFinishedScreen{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:10px 14px;max-width:none}
.graphFinishedScreen .card{margin:0}
.graphFinishedScreen .s-top{flex-shrink:0}
@media(max-width:760px){
 .seesawIntro{flex-direction:column;align-items:flex-start;gap:1px}
 .seesawColumns{grid-template-columns:1fr;grid-template-rows:auto auto}
 .graphFinishedScreen{height:auto;min-height:100dvh;overflow:visible}
 .seesawHalf .seesawScene{max-height:240px}
 .seesawGraphArea .practiceChart{max-height:340px}
}

/* 학생과 교사의 시소/그래프 비교 화면에 같은 레이아웃을 사용합니다. */
.teacherSeesawMode{width:100%;max-width:1480px;margin:auto;padding:8px 14px 24px;display:flex;flex-direction:column;gap:10px}
.teacherSeesawMode>.topbar{margin-bottom:2px}
.teacherSeesawMode>.seesawComparison{min-height:min(600px,calc(100dvh - 160px));}
.teacherSeesawMode .seesawColumns{min-height:490px}
.teacherSeesawMode>.teacherExtras{margin-top:12px}
.teacherExtras summary{font-size:21px;cursor:pointer;padding:8px 0}
.teacherExtras .teacherOverview{padding:10px 0}
.teacherExtras .teacherOverview .chip{font-size:16px}
.teacherSeesawMode .seesawLegend strong{background:#752FC5;color:#fff;border-radius:12px;padding:8px 14px;font-size:clamp(18px,1.8vw,26px)}
.graphFinishedScreen .seesawLegend strong{background:#752FC5;color:#fff;border-radius:12px;padding:8px 14px;font-size:clamp(18px,1.8vw,26px)}
@media(max-width:760px){.teacherSeesawMode .seesawColumns{min-height:0}}

.classReview{width:100%;max-width:1370px;margin:auto;display:flex;flex-direction:column;gap:12px}
.classReview .card{margin:0}
.classReview h2{font-size:clamp(24px,3vw,35px);margin:0}
.classReview p{font-size:clamp(16px,1.7vw,22px);margin:6px 0}
.reviewSummary{font-size:clamp(22px,2.5vw,30px);font-weight:bold;background:#eee2f9;padding:12px;border-radius:15px;text-align:center}
.reviewTradeTable{border-collapse:separate;border-spacing:4px;width:100%;font-size:clamp(15px,1.6vw,22px)}
.reviewTradeTable th,.reviewTradeTable td{border:1px solid #c4b5c4;padding:9px 6px;border-radius:9px;text-align:center;background:#fff;color:#322b34}
.reviewTradeTable thead th{background:#fcecc5}
.reviewQuestionGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reviewQuestionGrid h3{font-size:clamp(21px,2.25vw,29px)}
.reviewEvidence{background:#ece2fa;padding:13px;border-radius:12px;font-size:clamp(18px,1.9vw,26px);font-weight:700}
.reviewNote{background:#fff0ce;border-radius:12px;padding:11px;font-size:clamp(14px,1.4vw,18px)}
.reviewAction{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.reviewPage{max-width:1480px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
@media(max-width:760px){.reviewQuestionGrid{grid-template-columns:1fr}.reviewTradeTable{font-size:12px;border-spacing:2px}.reviewTradeTable th,.reviewTradeTable td{padding:5px 2px}.reviewPage{padding:6px}}

/* 시소 정리 표: 교사·학생 공통, 표의 가격을 누르면 시소·그래프가 함께 바뀝니다. */
.seesawDataTableWrap{flex-shrink:0;border:2px solid #d9c4e5;background:#fff;border-radius:16px;padding:5px 10px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { hubSeen, hubFollow, getStudentName, saveStudentName, requireStudentRoom, patchHTML } from './hub.js';   // 3단원 허브 연결

/* 「시장에 가면」과 같은 Firebase 프로젝트 사용 (데이터는 rooms/trade_코드 에 저장 → 기존 보안 규칙 그대로 통과) */
const firebaseConfig = {
  apiKey: "AIzaSyDiehLZ1aKv8E3N_pD4bNmw0zgMexau99U",
  authDomain: "marketgo-80ab5.firebaseapp.com",
  databaseURL: "https://marketgo-80ab5-default-rtdb.firebaseio.com",
  projectId: "marketgo-80ab5",
  storageBucket: "marketgo-80ab5.firebasestorage.app",
  messagingSenderId: "666715038541",
  appId: "1:666715038541:web:b0f84a9703aa70aeca4d04"
};
const db = getDatabase(initializeApp(firebaseConfig));
let offset = 0;
onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
const now = () => Date.now() + offset;   // 모든 기기가 같은 시계를 보도록 서버 시간 기준

/* 갤럭시탭 크롬: 학생이 직접 탭해 브라우저의 주소·도구 모음을 숨기는 전체화면 모드. */
function setStudentFullscreenLabel(){
  const active=!!document.fullscreenElement;
  document.documentElement.classList.toggle('lessonFullscreen',active);
  document.querySelectorAll('[data-fullscreen-toggle]').forEach(button=>{
    button.textContent=active?'↙ 전체화면 종료':'⛶ 전체화면';
    button.setAttribute('aria-label',active?'전체화면 종료':'수업 화면 전체화면으로 보기');
    button.setAttribute('aria-pressed',String(active));
  });
}
document.addEventListener('fullscreenchange',setStudentFullscreenLabel);
document.addEventListener('click',async event=>{
  const b=event.target.closest?.('[data-fullscreen-toggle]');
  if(!b||isTeacher)return;
  event.preventDefault();
  if(b.disabled)return;
  b.disabled=true;
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen({navigationUI:'hide'});
    }else{
      toast('이 브라우저에서는 전체화면 버튼을 지원하지 않아요. 크롬 메뉴에서 전체화면으로 전환해 주세요.');
    }
  }catch(error){
    console.warn('Student fullscreen not available',error);
    toast('전체화면을 열 수 없어요. 크롬에서 직접 열고 다시 눌러 주세요.');
  }finally{
    b.disabled=false;
    setStudentFullscreenLabel();
  }
});

/* ========== 설정 ========== */
const BUYER_VALUES  = [3000, 4500, 6000, 7500, 9000, 10500, 12000, 13500, 15000]; // 9,000원 전후로 협상할 수 있는 가상 카드
const SELLER_VALUES = [3000, 4500, 6000, 7500, 9000, 10500, 12000, 13500, 15000];
const ROUNDS = 3;
const DEFAULT_SEC = 180;   // 회차당 기본 3분
const lessonCode=()=>localStorage.getItem('marketgo_lesson_room')||'';

const P = new URLSearchParams(location.search);
const demoMode = P.get('demo') === '1';
const isTeacher = P.get('t') === '1' || demoMode;
const code = P.get('room') || (demoMode ? '가상예시' : '');
const app = document.getElementById('app');
let pid = null, room = null, lastSig = '', closing = false;
let showNames = false;          // 선생님 화면 전용
const hintOpen = new Set();     // 결과 질문에서 힌트 펼친 번호
let sel = { r: 0, partner: '', price: 0 };   // 학생이 고르는 중인 상대·가격
let editing = false;            // 학생이 기록을 고치는 중
let nameEditorOpen = false;      // 학생 이름 수정 패널
let nameDraft = '';              // 실시간 화면 갱신에도 입력값 유지
let nameSaving = false;
let chartRound = 0;             // 그래프: 0 = 전체, 1~3 = 회차만
let resultChartRoom='';
let chartMode = 'sd';           // 'sd' 수요·공급 그래프 / 'bar' 가격별 건수 / 'table' 표
let scenarioPrice=9000, revealScenario=false, scenarioStep=0;
let tradePresence={};
let teachingStage=1, exampleMode=false;
let showEq = demoMode;             // 균형 가격 표시 (정답이라 기본은 숨김)
const ROUND_COLORS = ['#3B8FD9', '#E8803E', '#2FA67A'];   // 1·2·3회차 (색각이상 검사 통과, 범례·숫자와 함께 사용)
const annSeen = new Set();      // 이미 띄운 안내문
let firstPass = true;           // 처음 접속·새로고침 땐 안내문 안 띄움

const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + won(Math.abs(n));
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const T = (c = code) => ref(db, 'rooms/trade_' + c);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastT;
const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast pop'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); };

/* ========== 🌈 안내문 (화면 가득, 3초 뒤 또는 터치하면 닫힘) ========== */
let annT;
function announce(big, sub = '', emo = '🌈', ms = 3200) {
  document.querySelectorAll('.ann').forEach(a => a.remove());
  const a = document.createElement('div');
  a.className = 'ann';
  const floaters = ['☁️','🌈','✨','⭐','🍡','💖','☁️','🌟','🍢','🫧','✨','🌈'];
  a.innerHTML = floaters.map((f, i) => `<span class="fl" style="left:${(i * 83) % 92}%;top:${(i * 47) % 85}%;animation-delay:${(i % 5) * .3}s">${f}</span>`).join('')
    + `<div class="emo">${emo}</div><span class="rb">${big}</span>${sub ? `<div class="sub">${sub}</div>` : ''}<div class="tap">화면을 누르면 닫혀요</div>`;
  a.onclick = () => a.remove();
  document.body.appendChild(a);
  clearTimeout(annT); annT = setTimeout(() => a.remove(), ms);
}
// 상태가 바뀔 때마다 한 번씩만 안내문
function maybeAnnounce(key, fn) {
  if (annSeen.has(key)) return;
  annSeen.add(key);
  if (firstPass) return;
  fn();
}

/* ========== 거래 규칙 ========== */
// 손익 = 수요자: 카드 금액 − 거래가 / 공급자: 거래가 − 카드 금액 (손해 거래도 그대로 기록됨)
const profitOf = (card, price) => card.role === 'buyer' ? card.limit - price : price - card.limit;

// 거래 성사 조건: 서로 상대를 지목 + 같은 가격 + 역할이 반대
function matchRound(cards, subs) {
  const pairs = [], seen = new Set();
  for (const [a, sa] of Object.entries(subs || {})) {
    if (!sa || !sa.partner || sa.partner === 'none') continue;
    const b = sa.partner, sb = (subs || {})[b], ca = (cards || {})[a], cb = (cards || {})[b];
    if (!sb || sb.partner !== a || !ca || !cb || ca.role === cb.role) continue;
    if (sa.price !== sb.price) continue;
    const key = [a, b].sort().join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    pairs.push({ a, b, price: sa.price, buyer: ca.role === 'buyer' ? a : b });

const Snd = {
  ctx: null,
  ensure() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(f, t0 = 0, d = .15, v = .3, type = 'square') {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  tick(n) { this.tone(n <= 3 ? 1175 : 880, 0, n <= 3 ? .22 : .12, .3); },
  siren(sec = 4) {   // 🚨 위이잉~ 위이잉~
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth'; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.28, t + .05);
    for (let k = 0; k < sec * 2; k++) { o.frequency.setValueAtTime(650, t + k * .5); o.frequency.linearRampToValueAtTime(1350, t + k * .5 + .25); o.frequency.linearRampToValueAtTime(650, t + k * .5 + .5); }
    g.gain.setValueAtTime(.28, t + sec - .1); g.gain.exponentialRampToValueAtTime(.0001, t + sec);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + sec + .05);
  },
};

/* ========== 타이머 (0.3초마다) ========== */
function tick() {
  if (!room) return;
  const st = room.state || {};
  const left = secLeft(st);
  const dur = st.dur || DEFAULT_SEC;
  const t = el('timer'), bar = el('tbar');
  if (t) {
    t.textContent = left === null ? '' : left > 0 ? fmt(left) : '끝!';
    t.classList.toggle('hurry', left !== null && left <= 30);
  }
  if (bar && left !== null) {
    bar.classList.toggle('hurry', left <= 30);
    bar.firstElementChild.style.width = Math.min(100, left / dur * 100) + '%';
  }
  if (!isTeacher && left === 0) { const b = el('submit'); if (b) b.disabled = true; }
  if (isTeacher && left !== null && left <= 10 && left > 0) {
    maybeAnnounce(`ten-${st.round}`, () => announce('10초 남았다!!', '얼른얼른 기록해~~ 🏃', '⏰', 2200));
  }
  if (isTeacher) {
    // ⛶ 큰 타이머 (마지막 10초에는 저절로 크게 + 째깍)
    if (st.phase === 'trading' && left !== null && left <= 10 && left > 0 && !bigTimer && lastTickSec !== null && lastTickSec > 10) bigTimer = true;
    const d = st.phase === 'trading' && left !== null ? bigTimerEl() : (bigTimer = false, bigTimerEl());
    if (d) { const n = el('bigTnum'), b = el('bigTbar'); n.textContent = left > 10 ? fmt(left) : left > 0 ? left : '그만!'; d.classList.toggle('hurry', left <= 10); b.style.width = Math.min(100, left / dur * 100) + '%'; }
    if (st.phase === 'trading' && left !== null && left !== lastTickSec && left > 0 && left <= 10) Snd.tick(left);
    if (st.phase === 'trading' && left === 0 && sirenDone !== String(st.round)) {
      sirenDone = String(st.round); Snd.siren(4);
      announce('🚨 그만!! 자리에 앉아요!!', '🪑 모두 제자리로~ 거래 끝!', '🚨', 4000);
    }
    lastTickSec = left;
  }
  // 시간이 끝나면 선생님 화면이 자동으로 회차 마감
  if (isTeacher && left === 0 && !closing) {
    closing = true;
    update(T(), { 'state/phase': 'closed' }).finally(() => { closing = false; });
  }
}

/* 성사된 거래만 집계한 순위. 0건도 포함하되 실제 카드를 받은 회차가 있는 학생만 비교. */
function tradeRanking(st){
  const finished=completedRounds(st),players=room.players||{},counts={};
  for(let r=1;r<=finished;r++){
    const cardIds=Object.keys(cardsOf(r));
    for(const id of cardIds){
      if(!players[id])continue;
      if(!counts[id])counts[id]={id,name:players[id].name||'학생',deals:0,rounds:0,profit:0};
      counts[id].rounds++;
    }
    for(const pair of pairsOf(r))for(const id of [pair.a,pair.b]){
      if(counts[id]){counts[id].deals++;counts[id].profit+=profitOf(cardsOf(r)[id],pair.price);}
    }
  }
  const rows=Object.values(counts).sort((a,b)=>b.deals-a.deals||a.name.localeCompare(b.name,'ko'));
  if(!rows.length)return {rows:[],top:[],bottom:[],same:true,profitLeaders:[],lossLeaders:[]};
  const high=rows[0].deals,low=rows[rows.length-1].deals;
  const bestProfit=Math.max(0,...rows.map(x=>x.profit));
  const worstProfit=Math.min(0,...rows.map(x=>x.profit));
  return {rows,top:rows.filter(x=>x.deals===high),bottom:rows.filter(x=>x.deals===low),same:high===low,profitLeaders:bestProfit>0?rows.filter(x=>x.profit===bestProfit):[],lossLeaders:worstProfit<0?rows.filter(x=>x.profit===worstProfit):[]};
}

      avg:amounts.length?Math.round(amounts.reduce((a,b)=>a+b,0)/amounts.length):null,
      min:amounts.length?Math.min(...amounts):null,max:amounts.length?Math.max(...amounts):null});
    for(const [id,x] of Object.entries(sub)){
      const c=cards[id],p=Number(x?.price);
      if(!c||!x?.partner||x.partner==='none'||!Number.isFinite(p)||p<=0)continue;
      const group=c.role==='seller'&&p>=12000?high:c.role==='buyer'&&p<=6000?low:null;
      if(!group)continue;
      group.attempts++;
      if(ids.has(id)&&pairs.some(a=>(a.a===id||a.b===id)&&Number(a.price)===p))group.success++;
    }
  }
  return {rounds,high,low,count,avg:count?Math.round(priceSum/count):null};
}

function bindStudentPractice(kind){
  const svg=app.querySelector('.graphStudentScreen svg.practiceChart');
  if(svg){
    let dragging=null,dragQuantity=null;
    const preview=svg.querySelector('#graphDragPreview');
    const x=q=>100+49*q,y=p=>458-360*p/15000;
    const pos=e=>{
      const m=svg.getScreenCTM();
      if(m&&m.inverse&&svg.createSVGPoint){
        const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
        return p.matrixTransform(m.inverse());
      }
      const r=svg.getBoundingClientRect();
      return {x:(e.clientX-r.left)*790/r.width,y:(e.clientY-r.top)*535/r.height};
    };
    const getQuantity=e=>Math.max(0,Math.min(12,Math.round((pos(e).x-100)/49)));
    const drawAt=(row,q)=>{
      if(!preview)return;
      preview.setAttribute('visibility','visible');
      preview.setAttribute('cx',String(x(q)));
      preview.setAttribute('cy',String(y(PRACTICE_PRICES[row])));
      preview.setAttribute('aria-label','선택한 수량 '+q+'개');
    };
    svg.addEventListener('pointerdown',e=>{
      const hit=e.target.closest('[data-editrow]');
      if(!hit||e.button>0)return;
      e.preventDefault();
      dragging=Number(hit.dataset.editrow);
      dragQuantity=getQuantity(e);
      drawAt(dragging,dragQuantity);
      try{svg.setPointerCapture(e.pointerId);}catch(error){}
    });
    svg.addEventListener('pointermove',e=>{
      if(dragging===null)return;
      e.preventDefault();
      dragQuantity=getQuantity(e);
      drawAt(dragging,dragQuantity);
    });
    async function finishDrag(e,save=true){
      if(dragging===null)return;
      const row=dragging,q=dragQuantity;
      dragging=null;dragQuantity=null;
      if(preview)preview.setAttribute('visibility','hidden');
      try{if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);}catch(error){}
      if(!save||!Number.isInteger(q))return;
      // 다른 가격의 점은 그대로 두고 현재 가격의 수량 위치만 갱신합니다.
      try{
        await set(ref(db,'rooms/trade_'+code+'/graphDraft/'+pid+'/'+kind+'/'+row),q);
      }catch(error){console.error(error);toast('점 저장에 실패했어요. 다시 시도해 주세요.');}
    }
    svg.addEventListener('pointerup',e=>finishDrag(e,true));
    svg.addEventListener('pointercancel',e=>finishDrag(e,false));
    svg.querySelectorAll('[data-editrow]').forEach(hit=>{
      hit.addEventListener('keydown',async e=>{
        if(!['ArrowRight','ArrowLeft','Enter',' '].includes(e.key))return;
        e.preventDefault();
        const row=Number(hit.dataset.editrow),current=Number(room.graphDraft?.[pid]?.[kind]?.[row]??0);
        const q=e.key==='ArrowRight'?Math.min(12,current+1):e.key==='ArrowLeft'?Math.max(0,current-1):current;
        try{await set(ref(db,'rooms/trade_'+code+'/graphDraft/'+pid+'/'+kind+'/'+row),q);}catch(error){toast('점 저장 실패');}
      });
    });
  }
  if(el('clearCurve'))el('clearCurve').onclick=async()=>{
    if(!confirm('지금 그리고 있는 '+(kind==='demand'?'수요곡선':'공급곡선')+'의 점 5개를 모두 지울까요?'))return;
    const button=el('clearCurve');button.disabled=true;
    try{
      await set(ref(db,'rooms/trade_'+code+'/graphDraft/'+pid+'/'+kind),null);
      toast('지웠어요. 그래프를 다시 그려 보세요.');
    }catch(error){console.error(error);toast('다 지우기에 실패했어요. 연결을 확인해 주세요.');button.disabled=false;}
  };
  if(el('submitCurve'))el('submitCurve').onclick=async()=>{
    const draft=room.graphDraft?.[pid]?.[kind]||{},target=graphVals(kind);
    if(PRACTICE_PRICES.some((_,i)=>draft[i]===undefined||draft[i]===null))return toast('표의 다섯 가격을 모두 그래프에 표시해 주세요.');
    const correct=target.filter((v,i)=>Number(draft[i])===v).length;
    const prev=room.graphWork?.[pid]?.[kind]||{},passed=correct===5;
    const btn=el('submitCurve');btn.disabled=true;
    try{
      await set(ref(db,'rooms/trade_'+code+'/graphWork/'+pid+'/'+kind),{passed,correct,tries:(Number(prev.tries)||0)+1,points:target.map((_,i)=>Number(draft[i])),at:Date.now()});
      if(passed)toast(kind==='demand'?'수요곡선 완성! 이제 같은 좌표평면에 공급곡선을 그려요.':'두 곡선을 완성했어요! 시소로 균형을 확인해 봐요.');
      else{toast(correct+'개 정답이에요. 틀린 점을 다시 고쳐 보세요.');btn.disabled=false;}
    }catch(error){console.error(error);toast('제출 실패. 연결을 확인해 주세요.');btn.disabled=false;}
  };
}

// 모찌 가상 카드(3,000~15,000원)를 학생에게 무작위로 나눠 줌
// 회차마다 새로 호출 → 역할(수요자/공급자)과 금액이 매번 다시 섞임
function makeCards(ids) {
  const order = shuffle(ids);
  const buyerN = Math.ceil(order.length / 2), sellerN = order.length - buyerN;
  // 금액을 골고루: 전체 세트를 반복해서 채우고, 남는 자리는 금액을 무작위로 뽑음 (인원이 적어도 한쪽으로 쏠리지 않게)
  const spread = (vals, n) => {
    const out = [];
    while (out.length + vals.length <= n) out.push(...vals);
    out.push(...shuffle(vals).slice(0, n - out.length));
    return shuffle(out);
  };
  const bv = spread(BUYER_VALUES, buyerN), sv = spread(SELLER_VALUES, sellerN);
  const cards = {};
  order.forEach((id, i) => {
    cards[id] = i < buyerN ? { role: 'buyer', limit: bv[i] } : { role: 'seller', limit: sv[i - buyerN] };
  });
  return cards;
}


/* ========== 수요·공급 그래프 ==========
   수요 곡선: 그 가격 이상을 낼 수 있는 수요자 수 (카드 금액 높은 순으로 계단)
   공급 곡선: 그 가격 이하로 팔 수 있는 공급자 수 (카드 금액 낮은 순으로 계단)
   '전체'는 회차들의 카드를 모두 합친 시장 */
function sdHTML(rs) {
  const cs = rs.flatMap(r => Object.values(cardsOf(r)));
  const D = cs.filter(c => c.role === 'buyer').map(c => c.limit).sort((a, b) => b - a);
  const Sp = cs.filter(c => c.role === 'seller').map(c => c.limit).sort((a, b) => a - b);
  if (!D.length || !Sp.length) return `<div class="stage" style="min-height:220px"><div class="rule muted">카드가 나오면 그래프가 그려져요</div></div>`;
  const deals = rs.flatMap(r => pairsOf(r));
  const pMin = Math.min(2000, BUYER_VALUES[0], ...deals.map(d => d.price - 500)), pMax = Math.max(16000, SELLER_VALUES[SELLER_VALUES.length-1], ...deals.map(d => d.price + 500));
  const qMax = Math.max(D.length, Sp.length);
  const W = 1000, H = 470, L = 86, Rr = 120, Tp = 24, B = 64;
  const pw = W - L - Rr, ph = H - Tp - B;
  const x = q => L + q / qMax * pw, y = p => Tp + (pMax - p) / (pMax - pMin) * ph;
  const BLUE = '#3B8FD9', ORANGE = '#E8803E', GREEN = '#2FA67A';
  let g = '';
  // 색 영역은 실제 카드에 따른 가격별 수요량·공급량으로 판단합니다.
  // 성사된 거래가 없어도 항상 색칠되며 수요·공급 직선은 모식도입니다.
  for (let low=pMin; low<pMax; low+=500) {
    const high=Math.min(pMax,low+500), price=(low+high)/2;
    const qd=D.filter(v=>v>=price).length, qs=Sp.filter(v=>v<=price).length;
    const fill=qd>qs?'#CDEBFF':qs>qd?'#FFE0CA':'#D6F2DD';
    g += `<rect x="${L}" y="${y(high)}" width="${pw}" height="${Math.max(0,y(low)-y(high))}" fill="${fill}" opacity=".58"/>`;
  }
  // 눈금: 값이 겹치지 않도록 2천원 단위
  for (let p = Math.ceil(pMin / 2000) * 2000; p <= pMax; p += 2000) g += `<line x1="${L}" x2="${W - Rr}" y1="${y(p)}" y2="${y(p)}" stroke="#F2E6EC"/><text x="${L - 10}" y="${y(p) + 6}" text-anchor="end" font-size="17" fill="#A3919C">${p.toLocaleString('ko-KR')}</text>`;
  const qStep = qMax <= 12 ? 1 : qMax <= 30 ? 5 : 10;
  for (let q = 0; q <= qMax; q += qStep) g += `<text x="${x(q)}" y="${H - B + 24}" text-anchor="middle" font-size="16" fill="#A3919C">${q}</text>`;
  g += `<line x1="${L}" x2="${L}" y1="${Tp}" y2="${Tp + ph}" stroke="#A3919C" stroke-width="1.5"/><line x1="${L}" x2="${W - Rr}" y1="${Tp + ph}" y2="${Tp + ph}" stroke="#A3919C" stroke-width="1.5"/>`;
  g += `<text x="${L - 10}" y="${Tp - 4}" text-anchor="end" font-size="16" fill="#5B4B57">가격(원)</text><text x="${W - Rr + 10}" y="${H - B + 24}" font-size="16" fill="#5B4B57">수량(개)</text>`;

  // 균형: 높은 수요자 q번째 ≥ 낮은 공급자 q번째 인 가장 큰 q = 균형 거래량, 두 곡선이 겹치는 가격 = 균형 가격
  let eqQ = 0;
  while (eqQ < Math.min(D.length, Sp.length) && D[eqQ] >= Sp[eqQ]) eqQ++;
  const eqLo = eqQ ? Math.max(Sp[eqQ - 1], D[eqQ] ?? -Infinity) : Sp[0];
  const eqHi = eqQ ? Math.min(D[eqQ - 1], Sp[eqQ] ?? Infinity) : D[0];
  
  // 교과서와 같은 직선형 모식도: 균형을 나타내는 교점은 실제 카드 자료로 산출함.
  // 거래 가격대·균형 수치는 원자료를 그대로 사용하고, 두 곡선의 모양만 단순화함.
  const eqP=(eqLo+eqHi)/2;
  const qE=eqQ;
  const nL=Math.max(1,qE),nR=Math.max(1,qMax-qE);
  const dSlope=Math.max(1,Math.min((pMax-eqP)/nL,(eqP-pMin)/nR)*0.88);
  const sSlope=Math.max(1,Math.min((eqP-pMin)/nL,(pMax-eqP)/nR)*0.88);
  const dAt=q=>eqP+dSlope*(qE-q);
  const sAt=q=>eqP+sSlope*(q-qE);

  // 균형가격 근처의 가로 띠만 사선 빗금 처리합니다. 배경 전체를 빗금 처리하지 않습니다.
  // 실제 거래 가격이 균형대 근처에서 집중되었는지 비교하기 위한 강조 표시입니다.
  if(showEq && Number.isFinite(eqLo) && Number.isFinite(eqHi) && eqHi>=eqLo){
    const lower=Math.max(pMin,eqLo-500),upper=Math.min(pMax,eqHi+500);
    if(upper>lower){
      const bandTop=y(upper),bandHeight=y(lower)-bandTop;
      g+=`<defs><pattern id="eqHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#7B55B2" stroke-width="5" opacity=".43"/></pattern></defs>`;
      g+=`<rect x="${L}" y="${bandTop}" width="${pw}" height="${bandHeight}" fill="#EADFF7" opacity=".22"/><rect x="${L}" y="${bandTop}" width="${pw}" height="${bandHeight}" fill="url(#eqHatch)" opacity=".55"/>`;
    }
  }
  // 실제 성사된 거래의 최빈 500원 구간을 곡선과 함께 표시해요.
  // 균형 가격은 별도의 교사 공개 버튼으로만 나타냅니다.
  const binSize=500, bins=new Map();
  deals.forEach(d=>{const v=Math.floor(d.price/binSize)*binSize;bins.set(v,(bins.get(v)||0)+1);});
  const highest=Math.max(0,...bins.values());
  const peaks=[...bins.entries()].filter(([p,n])=>n===highest).sort((a,b)=>a[0]-b[0]);
  const hasPeak=highest>=2&&peaks.length<=2;
  // 실제 거래 집중 가격은 별도 막대그래프로 확인합니다.
  // 학생용 그래프는 꺾임 없이 곧은 수요선·공급선으로 표현.
  g += `<line x1="${x(0)}" y1="${y(dAt(0))}" x2="${x(qMax)}" y2="${y(dAt(qMax))}" stroke="${BLUE}" stroke-width="5" stroke-linecap="round"/>`;
  g += `<line x1="${x(0)}" y1="${y(sAt(0))}" x2="${x(qMax)}" y2="${y(sAt(qMax))}" stroke="${ORANGE}" stroke-width="5" stroke-linecap="round"/>`;
  g += `<text x="${x(qMax)+10}" y="${y(dAt(qMax))+6}" font-size="21" fill="${BLUE}">수요곡선</text>`;
  g += `<text x="${x(qMax)+10}" y="${y(sAt(qMax))+6}" font-size="21" fill="${ORANGE}">공급곡선</text>`;
  if(showEq){
    g += `<line x1="${L}" x2="${x(qE)}" y1="${y(eqP)}" y2="${y(eqP)}" stroke="#9470B8" stroke-width="2.5" stroke-dasharray="7 6"/>`;
    g += `<line x1="${x(qE)}" x2="${x(qE)}" y1="${y(eqP)}" y2="${Tp+ph}" stroke="#9470B8" stroke-width="2.5" stroke-dasharray="7 6"/>`;
    g += `<circle cx="${x(qE)}" cy="${y(eqP)}" r="10" stroke="#fff" stroke-width="3" fill="#9470B8"/>`;
    g += `<text x="${x(qE)+15}" y="${y(eqP)-16}" font-size="20" fill="#72548B">균형</text>`;
  }

  let note = '<span class="muted">아직 성사된 거래가 없어요</span>';
  if (deals.length) {
    const n=deals.length;
    const peakLabels=peaks.map(([p])=>won(p)+' ~ '+won(p+499));
    const peakRatio=Math.round(highest/n*100);
    note=hasPeak
      ? '실제 거래 '+n+'건 중 <b>'+peakLabels.join(' / ')+'</b>에서 가장 많이 거래됐어요. ('+highest+'건 · '+peakRatio+'%)'
      : '실제 거래 '+n+'건 · 여러 가격대에 분산됐거나 거래가 적어 집중 가격대를 정하기 어려워요.';
    if(showEq && hasPeak){
      const overlaps=peaks.some(([p])=>p<=eqHi&&p+499>=eqLo);
      note+='<br><b>'+(overlaps?'실제로 거래가 많이 이루어진 가격대가 균형 가격대와 겹쳐요.':'실제 거래 집중 가격대와 균형 가격대가 달라요.')+'</b>';
    }
  }
  const legend = `<div class="chips" style="justify-content:center;margin-top:4px">
    <span class="pill"><span style="display:inline-block;width:22px;height:4px;background:${BLUE};vertical-align:4px;border-radius:2px"></span> 수요 곡선 (수요자 ${D.length}명)</span>
    <span class="pill"><span style="display:inline-block;width:22px;height:4px;background:${ORANGE};vertical-align:4px;border-radius:2px"></span> 공급 곡선 (공급자 ${Sp.length}명)</span>
    <span class="pill"><span style="display:inline-block;width:12px;height:12px;background:#CDEBFF;border-radius:3px;vertical-align:-1px"></span> 초과수요</span>
    <span class="pill"><span style="display:inline-block;width:12px;height:12px;background:#D6F2DD;border-radius:3px;vertical-align:-1px"></span> 수요량=공급량</span>
    <span class="pill"><span style="display:inline-block;width:12px;height:12px;background:#FFE0CA;border-radius:3px;vertical-align:-1px"></span> 초과공급</span>${showEq ? '<span class="pill"><span style="display:inline-block;width:22px;height:13px;background:repeating-linear-gradient(45deg,#DAC7F2 0 4px,#fff 4px 9px);border:1px solid #9B79BD;vertical-align:-2px"></span> 균형가격 부근(빗금)</span>' : ''}</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:Jua,sans-serif" role="img" aria-label="수요 공급 그래프">${g}</svg>${legend}
    <p class="muted center" style="font-size:16px;margin:10px 0">배경색은 가격별 초과수요·초과공급 영역이에요. 균형가격을 공개하면 그 주변만 사선 빗금으로 표시해요. 직선은 방향을 이해하기 위한 모식도예요.${rs.length>1?" 여러 회차 합계는 비교용 자료예요.":""}</p>
    <div class="hl lemon center" style="font-size:22px">${note}${showEq ? `<br>⚖️ 균형 가격 <b>${eqLo === eqHi ? won(eqLo) : won(eqLo) + ' ~ ' + won(eqHi)}</b> · 균형 거래량 약 <b>${eqQ}개</b>` : ''}</div>`;
}

/* ========== 거래 가격 그래프 (가격별 거래 건수, 회차별로 쌓기) ========== */
function chartHTML(rs) {
  const deals = rs.flatMap(r => pairsOf(r).map(x => ({ r, price: x.price })));
  if (!deals.length) return `<div class="stage" style="min-height:220px"><div class="bigEmoji">🍡</div><div class="rule muted">아직 성사된 거래가 없어요</div></div>`;
  // 가격이 없는 빈 칸은 제거하고 실제 거래만 1,000원 구간에 합산
  const STEP=1000,groups=new Map();
  deals.forEach(d=>{const v=Math.floor(d.price/STEP)*STEP;if(!groups.has(v))groups.set(v,[]);groups.get(v).push(d);});
  const bins=[...groups.keys()].sort((a,b)=>a-b).map(v=>{
    const at=groups.get(v);
    return {v,n:at.length,by:rs.map(r=>at.filter(d=>d.r===r).length),prices:[...new Set(at.map(d=>d.price))].sort((a,b)=>a-b)};
  });
  const maxN = Math.max(...bins.map(b => b.n));
  const W = 1000, H = 400, L = 44, Rr = 12, Tp = 46, B = bins.length > 8 ? 86 : 62;
  const pw = W - L - Rr, ph = H - Tp - B, slot = pw / bins.length, bw = Math.min(64, slot * 0.62);
  const y = n => Tp + ph - (n / maxN) * ph;
  const step = maxN <= 6 ? 1 : Math.ceil(maxN / 6);
  let g = '';
  for (let n = 0; n <= maxN; n += step) {
    g += `<line x1="${L}" x2="${W - Rr}" y1="${y(n)}" y2="${y(n)}" stroke="#F2E6EC" stroke-width="1"/>
      <text x="${L - 10}" y="${y(n) + 6}" text-anchor="end" font-size="17" fill="#A3919C">${n}</text>`;
  }
  // 위쪽만 둥근 막대 조각
  const topRounded = (x, yTop, w, h, r) => `M${x},${yTop + h}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + w - r}Q${x + w},${yTop} ${x + w},${yTop + r}V${yTop + h}Z`;
  bins.forEach((b, i) => {
    const cx = L + slot * i + slot / 2, x = cx - bw / 2;
    let acc = 0;
    const segs = b.by.map((n, k) => ({ n, k })).filter(s => s.n);
    segs.forEach((s, j) => {
      const y0 = y(acc + s.n), h = y(acc) - y0 - (acc ? 2 : 0);   // 조각 사이 2px 틈
      const top = j === segs.length - 1;
      g += top ? `<path d="${topRounded(x, y0, bw, h, Math.min(6, h / 2))}" fill="${ROUND_COLORS[rs[s.k] - 1]}"/>`
               : `<rect x="${x}" y="${y0}" width="${bw}" height="${h}" fill="${ROUND_COLORS[rs[s.k] - 1]}"/>`;
      acc += s.n;
    });
    const isTop = b.n && b.n === maxN;
    if (b.n) g += `<text x="${cx}" y="${y(b.n) - 10}" text-anchor="middle" font-size="22" fill="#5B4B57">${isTop ? '👑 ' : ''}${b.n}건</text>`;
    g += `<text x="${cx}" y="${H - B + 26 + (bins.length > 8 && i%2 ? 19 : 0)}" text-anchor="middle" font-size="${bins.length>8?14:17}" fill="${isTop ? '#5B4B57' : '#A3919C'}">${b.v.toLocaleString('ko-KR')}원대</text>`;
    // 마우스 올리면 회차별 건수
    g += `<rect x="${L + slot * i}" y="${Tp}" width="${slot}" height="${ph}" fill="transparent"><title>${won(b.v)}~${won(b.v+999)}: ${b.n}건 | 실제 가격 ${b.prices.map(won).join(', ')}${rs.length > 1 ? '\n' + rs.map((r, k) => `${r}회차 ${b.by[k]}건`).join('\n') : ''}</title></rect>`;
  });
  g += `<line x1="${L}" x2="${W - Rr}" y1="${Tp + ph}" y2="${Tp + ph}" stroke="#A3919C" stroke-width="1.5"/>`;
  const topBins = bins.filter(b => b.n === maxN).map(b => won(b.v) + '대');
  const legend = rs.length > 1 ? `<div class="chips" style="justify-content:center;margin-top:4px">${rs.map(r => `<span class="pill"><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${ROUND_COLORS[r - 1]};vertical-align:-1px"></span> ${r}회차</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:Jua,sans-serif" role="img" aria-label="거래 가격별 거래 건수 그래프">${g}</svg>${legend}
    <div class="hl lemon center" style="font-size:24px">${maxN===1&&bins.length>1?"거래가 여러 가격대에 분산돼 뚜렷한 집중 가격대는 없어요.":`👑 가장 많이 거래된 가격대: <b>${topBins.join(', ')}</b> (${maxN}건)`}</div>`;
}

/* 수업용 가상 수요·공급 사례: 실제 거래 및 학급 인원과는 별도입니다. */
function scenarioChart(price){
 const values=[{p:3000,d:20,s:10},{p:9000,d:15,s:15},{p:15000,d:10,s:20}];
 const W=930,H=430,L=100,R=96,T=35,B=84;
 const x=q=>L+(q-7)/16*(W-L-R), y=p=>T+(17000-p)/16000*(H-T-B);
 const data=values.find(v=>v.p===price),xD=x(data.d),xS=x(data.s),level=y(price);
 const line=k=>values.map(v=>x(v[k])+','+y(v.p)).join(' ');
 const dots='<line x1="'+L+'" x2="'+Math.max(xD,xS)+'" y1="'+level+'" y2="'+level+'" stroke="#7D679F" stroke-dasharray="9 7" stroke-width="3"/>'+
   [data.d,data.s].map((q,i)=>'<line x1="'+x(q)+'" x2="'+x(q)+'" y1="'+level+'" y2="'+(H-B)+'" stroke="'+(i?'#E8803E':'#3B8FD9')+'" stroke-dasharray="7 7" stroke-width="2.5"/>').join('')+
   '<circle cx="'+xD+'" cy="'+level+'" r="10" fill="#3B8FD9" stroke="white" stroke-width="3"/>'+
   '<circle cx="'+xS+'" cy="'+level+'" r="8" fill="#E8803E" stroke="white" stroke-width="2"/>'+
   '<text x="'+xD+'" y="'+(H-B+31)+'" font-size="21" fill="#3B8FD9" text-anchor="middle">'+data.d+'</text>'+
   '<text x="'+xS+'" y="'+(H-B+56)+'" font-size="21" fill="#E8803E" text-anchor="middle">'+data.s+'</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:white;border-radius:18px" role="img" aria-label="가격 '+price+'원일 때 수요량 '+data.d+'개 공급량 '+data.s+'개를 점선으로 표시한 수요 공급 직선 그래프">'+
 '<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#8A7384" stroke-width="2"/>'+
 '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="#8A7384" stroke-width="2"/>'+

 '<text x="'+(L-14)+'" y="'+(level+7)+'" text-anchor="end" font-size="22" fill="#72548B">'+price.toLocaleString('ko-KR')+'</text>'+
 '<text x="'+(W-R+12)+'" y="'+(y(3000)+6)+'" fill="#3B8FD9" font-size="23">수요곡선</text>'+

 '<text x="'+L+'" y="'+(T-11)+'" fill="#5B4B57" font-size="19">가격(원)</text>'+
 '<text x="'+(W-R)+'" y="'+(H-10)+'" fill="#5B4B57" text-anchor="end" font-size="19">수량(개)</text></svg>';

    {q:eq?'⑤ 균형 상태에서는 가격을 꼭 바꿔야 할까요?':v.s>v.d?'⑤ 물건을 팔고 돈을 벌려면 판매자는 가격을 어떻게 해야 할까요?':'⑤ 물건이 부족하다면 가격은 어떻게 변하려 할까요?',
     a:eq?'수요량과 공급량이 같으므로 가격을 바꿀 압력이 작아요.':v.s>v.d?'가격을 낮춰야 해요. 가격이 내려가면 수요량이 늘고 공급량은 줄어들어 남는 물건이 줄어들 수 있어요.':'가격이 올라갈 압력이 생겨요. 가격이 오르면 수요량이 줄고 공급량이 늘어 부족한 물건이 줄어들 수 있어요.'}
  ];
  const item=questionSteps[scenarioStep]||questionSteps[0];
  return '<div class="card" id="priceChangeLesson"><h3>가격이 너무 높다면 왜 못 팔까?</h3><div class="muted" style="font-size:17px">학급 실제 거래가 아닌 별도 가상 시장 · 한 사람당 한 개씩 거래한다고 가정</div>'+
    '<div class="chips" style="margin:12px 0">'+[15000,9000,3000].map(p=>
      '<button class="btn '+(scenarioPrice===p?'lemon':'sky')+'" data-scenario="'+p+'">'+won(p)+'</button>').join('')+'</div>'+
    '<div class="hl lemon center" style="font-size:24px;margin-bottom:14px">모찌 가격 <b>'+won(scenarioPrice)+'</b> · '+label+'</div>'+
    scenarioChart(scenarioPrice)+
    '<div class="q" style="margin:16px 0"><p>'+item.q+'</p></div>'+
    '<div class="center"><button class="btn mint" id="scenarioReveal">'+(revealScenario?'정답 숨기기':'정답 확인')+'</button></div>'+
    (revealScenario?'<div class="hl mint" style="font-size:23px;text-align:center;margin:12px 0"><b>'+item.a+'</b></div>':'')+

    '<div class="muted center" style="margin-top:10px">가격이 높을수록 공급량은 많고 수요량은 적어져 팔지 못하는 물건이 생길 수 있어요. 실제 거래량은 수요량과 공급량 중 작은 값 이하예요.</div></div>';

/* ========== 결과표 정리 질문 (마지막 회차 후 선생님 화면) ========== */
function questionsHTML(cols) {
  const all = cols.flatMap(r => pairsOf(r));
  const byPrice = {};
  all.forEach(x => byPrice[x.price] = (byPrice[x.price] || 0) + 1);
  const top = Object.entries(byPrice).sort((a, b) => b[1] - a[1])[0];
  const avg = r => { const ps = pairsOf(r); return ps.length ? won(Math.round(ps.reduce((s, x) => s + x.price, 0) / ps.length)) : '거래 없음'; };
  // 극단 카드(가장 낮은 수요자 / 가장 높은 공급자)의 거래 성공 횟수
  const ext = { b: [0, 0], s: [0, 0] };
  cols.forEach(r => {
    const traded = new Set(pairsOf(r).flatMap(x => [x.a, x.b]));
    Object.entries(cardsOf(r)).forEach(([id, c]) => {
      const k = c.role === 'buyer' && c.limit === BUYER_VALUES[0] ? 'b' : c.role === 'seller' && c.limit === SELLER_VALUES[SELLER_VALUES.length - 1] ? 's' : null;
      if (k) { ext[k][0]++; if (traded.has(id)) ext[k][1]++; }
    });
  });
  const totalCards = cols.reduce((s, r) => s + Object.keys(cardsOf(r)).length, 0);
  const noTrade = totalCards - all.length * 2;
  if (!all.length) return `<div class="card"><h3>📋 결과표 보며 이야기해 봐요</h3>
    <div class="hl peach">이번 게임에서는 성사된 거래가 한 건도 없어서 질문을 만들 수 없어요.<br><span class="muted" style="font-size:18px">학생들이 서로 같은 상대·같은 가격을 기록해야 거래로 잡혀요.</span></div></div>`;

  const Q = [
    [`가장 많이 거래된 가격은 <b>${won(top[0])}</b> (${top[1]}건)이에요. 왜 이 가격 근처에서 거래가 많았을까요?`,
     '사려는 사람 수(수요량)와 팔려는 사람 수(공급량)가 비슷한 가격대에서는 서로 조건이 맞는 상대를 찾기 쉬워요. 다음 시간에는 이 관계를 그래프로 살펴봐요.'],
    [`평균 거래 가격: ${cols.map(r => `${r}회차 <b>${avg(r)}</b>`).join(' → ')}. 회차가 거듭될수록 가격은 어떻게 변했나요?`,
     '거래하면서 가격 정보를 알 수 있지만 반드시 하나의 가격으로 모이지는 않아요. 실제 결과를 비교해 보세요.'],
    [(() => {
      const parts = [];
      if (ext.b[0]) parts.push(`수요자 ${won(BUYER_VALUES[0])} 카드는 ${ext.b[0]}번 중 <b>${ext.b[1]}번</b>`);
      if (ext.s[0]) parts.push(`공급자 ${won(SELLER_VALUES[SELLER_VALUES.length - 1])} 카드는 ${ext.s[0]}번 중 <b>${ext.s[1]}번</b>`);
      return parts.length ? `${parts.join(', ')} 거래에 성공했어요. 이 카드들은 왜 거래가 어려웠을까요?`
        : `수요자 ${won(BUYER_VALUES[0])} 카드나 공급자 ${won(SELLER_VALUES[SELLER_VALUES.length - 1])} 카드를 받았다면 거래하기 쉬웠을까요?`;
    })(),
     '시장 가격보다 훨씬 싸게 사려 하거나 비싸게 팔려 하면 상대를 찾기 어려워요. 시장 가격에서 사고팔 의사가 있는 사람끼리만 거래가 이루어져요.'],
    [`${ROUNDS}회차 동안 거래를 하지 않은 경우가 <b>${noTrade}번</b> 있었어요. 거래를 못 한 친구는 손해를 본 걸까요?`,
     '이익은 0원이지만 손해는 아니에요. 나에게 손해가 되는 거래를 하지 않은 것도 <b>합리적 선택</b>이에요.'],
    ['가장 많이 거래된 가격대가 수요·공급 곡선이 만나는 균형 가격대와 같았나요?',
     '같을 수도 다를 수도 있어요. 실제 거래 횟수와 학생들의 협상 결과를 함께 확인해 보세요.']
  ];
  return `<div class="card"><h3>📋 결과표 보며 이야기해 봐요</h3>${Q.map(([q, h], i) => `
    <div class="q">
      <p>Q${i + 1}. ${q}</p>
      <button class="btn sm ${hintOpen.has(String(i)) ? 'mint' : 'lemon'}" data-hint="${i}">${hintOpen.has(String(i)) ? '힌트 접기' : '💡 힌트 보기'}</button>
      ${hintOpen.has(String(i)) ? `<div class="hl mint pop">${h}</div>` : ''}
    </div>`).join('')}</div>`;
}

/* 이름 수정은 학생 ID를 그대로 두고 이름 필드만 바꿉니다. 거래·점수·제출 기록은 유지됩니다. */
function bindNameEditor() {
  const editButton = el('editNameBtn');
  if (editButton) editButton.onclick = () => {
    nameDraft = String((room.players || {})[pid]?.name || getStudentName() || '');
    nameEditorOpen = true;
    lastSig = '';
    renderStudent();
    el('editNameInput')?.focus();
  };
  const input = el('editNameInput');
  if (input) {
    input.oninput = () => { nameDraft = input.value; };
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); el('saveNameBtn')?.click(); } };
  }
  const cancel = el('cancelNameBtn');
  if (cancel) cancel.onclick = () => { nameEditorOpen = false; nameDraft = ''; lastSig = ''; renderStudent(); };
  const save = el('saveNameBtn');
  if (save) save.onclick = async () => {
    if (nameSaving) return;
    const next = (el('editNameInput')?.value || '').trim();
    if (!next) return toast('이름을 입력해 주세요.');
    if (next.length > 8) return toast('이름은 8자까지 입력할 수 있어요.');
    const old = (room.players || {})[pid]?.name || getStudentName() || '';
    if (next === old) { nameEditorOpen = false; lastSig = ''; renderStudent(); return; }
    nameSaving = true;
    save.disabled = true;
    try {
      await update(ref(db, `rooms/trade_${code}/players/${pid}`), { name: next });
      saveStudentName(next);
      localStorage.setItem('trade_name', next);
      // 허브의 현재 접속 학생 표시도 즉시 갱신합니다.
      const presenceId = localStorage.getItem('marketgo_presence_id');
      if (presenceId) update(ref(db, `rooms/hub_main/presence/trade_${code}/${presenceId}`), { name: next }).catch(() => {});
      nameEditorOpen = false;
      nameDraft = '';
      lastSig = '';
      renderStudent();
      toast('이름을 바꿨어요! 기존 거래·점수는 그대로예요 ✅');
    } catch(e) {
      console.error(e);
      toast('이름 저장에 실패했어요. 인터넷을 확인해 주세요.');
    } finally {
      nameSaving = false;
      const stillSave = el('saveNameBtn');
      if (stillSave) stillSave.disabled = false;
    }
  };
}
/* ========== 학생 화면 ========== */
function renderStudent() {
  const players = room.players || {}, rounds = room.rounds || {};
  const st = room.state || { phase: 'lobby', round: 0 };
  const cards = st.round ? cardsOf(st.round) : {};
  const card = cards[pid];
  const name = (players[pid] || {}).name || localStorage.getItem('trade_name') || '';
  const nameOf = id => esc((players[id] || {}).name || '?');
  const subs = st.phase === 'trading' ? ((rounds[st.round] || {}).subs || {}) : {};
  const curSub = subs[pid] || null;
  const myPair = st.phase === 'trading' ? pairsOf(st.round).find(x => x.a === pid || x.b === pid) : null;
  const partnerSub = curSub && curSub.partner !== 'none' ? subs[curSub.partner] || null : null;
  // 나를 거래 상대로 적은 친구들 (아직 내가 그 친구와 맞춰 적지 않은 경우)
  const claims = card ? Object.entries(subs).filter(([id, s]) => s.partner === pid && cards[id] && cards[id].role !== card.role
    && !(curSub && curSub.partner === id)) : [];   // 이미 내가 고른 친구는 위 '가격이 달라요'에서 보여 줌
  const isEnd = st.phase === 'closed' && st.round >= ROUNDS;
  const graphFinished=!!room.graphWork?.[pid]?.demand?.passed&&!!room.graphWork?.[pid]?.supply?.passed;
  if(isEnd){const newStage=currentSeesawReveal();if(newStage!==studentLastSeesawStage){studentSeesawPrice=null;studentLastSeesawStage=newStage;}}
  if (myPair) editing = false;   // 성사되면 잠금

  // 안내문
  if (st.phase === 'trading' && card) maybeAnnounce(`start-${st.round}`, () => announce(
    card.role === 'buyer' ? '너는 수요자!!' : '너는 공급자!!',
    `${st.round}회차 내 카드: ${card.role === 'buyer' ? '🛒' : '🏷️'} ${won(card.limit)}`,
    card.role === 'buyer' ? '🛒' : '🏷️'));
  else if (st.phase === 'closed') maybeAnnounce(`close-${st.round}`, () => isEnd
    ? announce('거래 정리 시간!', '3회차 실제 거래 결과를 먼저 살펴보세요.', '🍡', 1800)
    : announce('그만~~!!', `${st.round}회차 끝! 결과를 확인해 봐`, '🛑'));
  else maybeAnnounce(`${st.phase}-${st.round}`, () => {});
  if (myPair) maybeAnnounce(`deal-${st.round}`, () => announce('거래 성사!!', '🪑 이제 자리에 가서 앉아요!', '🤝', 6000));

  // 같은 상태면 다시 그리지 않음 (입력 중인 내용이 날아가지 않게)
  const sig = JSON.stringify([st.phase, st.round, card, Object.entries(players).map(([id, p]) => [id, p?.name || '']), nameEditorOpen, curSub, !!myPair, partnerSub, claims, editing, isEnd ? (room.recommendations||{})[pid]||null : null, isEnd?room.graphDraft?.[pid]||null:null, isEnd?room.graphWork?.[pid]||null:null, isEnd?currentFlowStep():null, isEnd?currentSeesawReveal():null, isEnd?room.presentation?.seesawPrice:null, isEnd?postSurveyOf()[pid]||null:null]);
  if (sig === lastSig) return;
  lastSig = sig;
  if (sel.r !== st.round) { sel = { r: st.round, partner: '', price: 0 }; editing = false; }

  const head = `<div class="s-top" style="flex-wrap:wrap"><span class="me">🙂 ${esc(name)}</span><button type="button" class="btn sm lemon studentFullscreenBtn" data-fullscreen-toggle aria-label="수업 화면 전체화면으로 보기">⛶ 전체화면</button><button type="button" class="btn sm sky" id="editNameBtn">✏️ 이름 수정</button><span class="pill">⭐ 총 손익 ${signed(totalProfit(st))}</span></div>
    ${nameEditorOpen ? `<div class="card" style="margin-bottom:12px"><label for="editNameInput" class="lab">바꿀 이름을 입력하세요 (최대 8자)</label>
      <input class="field" id="editNameInput" maxlength="8" autocomplete="name" value="${esc(nameDraft)}">
      <div class="chips"><button type="button" class="btn sm mint" id="saveNameBtn">✅ 이름 저장</button><button type="button" class="btn sm" id="cancelNameBtn">취소</button></div>
      <p class="muted" style="font-size:15px;margin:8px 0 0">이름만 바뀌고 지금까지의 거래·점수는 유지돼요.</p></div>` : ''}`;

  if (!card && !isEnd) {
    app.innerHTML = `<div class="s-wrap">${head}<div class="stage" style="min-height:60vh"><div class="bigEmoji bounce">🍡</div><div class="rule">${st.phase === 'lobby'
      ? '선생님이 시작하면<br>카드가 나와요 ⏳'
      : '이번 회차가 끝나면<br>다음 회차부터 카드를 받아요 ⏳'}</div></div></div>`;
    bindNameEditor();
    return;
  }

  if(isEnd && currentFlowStep()==='recap'){
    app.innerHTML='<div class="reviewPage">'+head+myTradeRecapHTML(pid)+tradeRecapHTML()+
      '<div class="hl lemon center">선생님과 거래 결과를 정리해 보세요. 다음 화면은 선생님이 열어 줘요.</div></div>';
    bindNameEditor();return;
  }
  if(isEnd && currentFlowStep()==='postSurvey'){
    const savedAnswer=postSurveyOf()[pid];
    if(!savedAnswer?.answer&&postSurveyDraftLoadedFor!==code+'_'+pid){postSurveyDraft='';postSurveyDraftLoadedFor=code+'_'+pid;}
    app.innerHTML='<div class="reviewPage">'+head+postSurveyStudentHTML(pid)+'</div>';
    bindNameEditor();bindPostSurveyStudent();return;
  }
  if(isEnd && currentFlowStep()==='seesaw'){
    app.innerHTML='<div class="graphFinishedScreen">'+head+stagedSeesawHTML()+'</div>';
    bindNameEditor();bindSeeSaw();return;
  }
  if(isEnd && currentFlowStep()==='drawing' && !graphFinished){
    app.innerHTML=`<div class="graphStudentScreen">${head}${studentPracticeHTML()}</div>`;
    bindNameEditor();bindStudentPractice(room.graphWork?.[pid]?.demand?.passed?'supply':'demand');return;
  }
  if(isEnd && currentFlowStep()==='drawing' && graphFinished){
    app.innerHTML=`<div class="graphFinishedScreen">${head}${seesawComparisonHTML(studentSeesawPrice??9000,true)}</div>`;
    bindNameEditor();bindSeeSaw();return;
  }

  const cardHTML = !card ? '' : card.role === 'buyer'
    ? `<div class="tcard buyer"><span class="rn">${st.round}회차 내 카드</span>
        <div class="role">🛒 수요자 카드</div><div class="amt">${won(card.limit)}</div>
        <div class="desc">고@바 모찌 1개을 최대한 <b>낮은 가격</b>으로 사세요.<br>고@바 모찌는 나에게 ${won(card.limit)}만큼의 만족을 줘요.<br>이보다 비싸게 사면 손해!</div></div>`
    : `<div class="tcard seller"><span class="rn">${st.round}회차 내 카드</span>
        <div class="role">🏷️ 공급자 카드</div><div class="amt">${won(card.limit)}</div>
        <div class="desc">고@바 모찌 1개을 최대한 <b>높은 가격</b>으로 파세요.<br>고@바 모찌 1개 만드는 데 ${won(card.limit)}의 비용이 들었어요.<br>이보다 싸게 팔면 손해!</div></div>`;

  let body = '';
  const roster = ['buyer','seller'].map(role=>{
    const ids=Object.entries(cards).filter(([,x])=>x?.role===role).map(([id])=>id);
    return '<div class="hl '+(role==='buyer'?'sky':'peach')+'" style="flex:1;min-width:200px"><b>'+(role==='buyer'?'🛒 수요자':'🏷️ 공급자')+' '+ids.length+'명</b><div class="chips">'+ids.map(id=>'<span class="chip soft">'+nameOf(id)+'</span>').join('')+'</div></div>';
  }).join('');
  const done = completedRounds(st);
  const lastResult = () => {
    if (done < 1) return '';
    const pair = pairsOf(done).find(x => x.a === pid || x.b === pid);
    const dc = cardsOf(done)[pid];
    return pair && dc
      ? `<div class="doneBox pop">🤝 ${done}회차 거래 성사!<br>${won(pair.price)}에 ${dc.role === 'buyer' ? '샀어요' : '팔았어요'} · 손익 <b>${signed(profitOf(dc, pair.price))}</b></div>`
      : `<div class="doneBox none pop">${done}회차는 거래 없음 🙂<br><span style="font-size:20px">손익 0원</span></div>`;
  };

  if (st.phase === 'trading') {
    body += `<div class="card center studentTimerPanel"><div class="timer s" id="timer"></div><div class="bar" id="tbar"><i></i></div></div>`;
    body += `<details class="card studentRosterPanel" open><summary style="cursor:pointer;font-size:23px">👥 이번 회차 수요자·공급자 명단</summary><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">${roster}</div></details><div class="card studentOwnCard">${cardHTML}</div>`;

    // 나랑 거래했다고 적은 친구가 있으면 한 번에 맞출 수 있게
    if (!myPair && claims.length) {
      body += `<div class="card studentClaimsPanel"><h3>📨 나에게 온 거래 요청 · 가격 확인 후 확정</h3>${claims.map(([id, s]) =>
        `<div class="hl sky" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="margin-right:auto">${nameOf(id)} · ${won(s.price)}</span>
          <button class="btn sm mint" data-fix="${id}" data-fixprice="${s.price}">✅ 이 가격으로 거래 확정</button></div>`).join('')}</div>`;
    }

    if (myPair) {
      body += `<div class="card studentActionPanel"><div class="doneBox">✅ ${nameOf(curSub.partner)} 친구와 거래 성사!<br>${won(myPair.price)} · 손익 <b>${signed(profitOf(card, myPair.price))}</b></div>
        <div class="hl peach center pop" style="font-size:30px;margin-top:12px">🪑 자리에 가서 앉아요!<br><span style="font-size:18px">다음 회차를 기다려 주세요</span></div></div>`;
    } else if (curSub && !editing) {
      // 기록은 했는데 아직 짝이 안 맞음 → 무엇이 다른지 보여 주고 바로 고칠 수 있게
      let box, fix = '';
      if (curSub.partner === 'none') {
        box = `<div class="doneBox none">이번 회차는 거래 안 함 🙂</div>`;
      } else {
        const who = nameOf(curSub.partner);
        const mine = `<span style="font-size:20px">내 기록: ${who} · ${won(curSub.price)}</span>`;
        if (!partnerSub) box = `<div class="doneBox wait">기록 완료 ✅<br>${mine}<br><span style="font-size:20px">${who} 친구가 적기를 기다리는 중... ⏳</span></div>`;
        else if (partnerSub.partner === 'none') box = `<div class="doneBox bad">${who} 친구는 '거래 안 함'으로 적었어요<br>${mine}</div>`;
        else if (partnerSub.partner !== pid) box = `<div class="doneBox bad">${who} 친구는 다른 친구와 거래했다고 적었어요<br>${mine}</div>`;
        else {
          box = `<div class="doneBox bad">가격이 달라요!<br><span style="font-size:20px">나: ${won(curSub.price)} · ${who}: ${won(partnerSub.price)}</span></div>`;
          fix = `<button class="btn big mint" style="width:100%" data-fix="${curSub.partner}" data-fixprice="${partnerSub.price}">${who} 친구처럼 ${won(partnerSub.price)}으로 맞추기</button>`;
        }
      }
      body += `<div class="card studentActionPanel">${box}${fix}<button class="btn lemon" id="edit" style="width:100%;margin-top:10px">✏️ 내 기록 고치기</button></div>`;
    } else {
      const opp = Object.keys(cards).filter(id => id !== pid && cards[id].role !== card.role);
      if (curSub && editing && !sel.partner) sel = { r: st.round, partner: curSub.partner === 'none' ? '' : curSub.partner, price: curSub.price || 0 };
      body += `<div class="card studentActionPanel">
        <h3>✍️ 거래 기록하기</h3>
        <p class="muted" style="font-size:17px;margin-top:-6px">${card.role === 'buyer' ? '🏷️ 공급자' : '🛒 수요자'} 친구를 찾아 말로 흥정! 둘 다 서로를 고르고 같은 가격을 적어야 성사돼요.</p>
        <div class="lab">누구랑 거래했나요?</div>
        <div class="opts">${opp.map(id => `<button class="opt${sel.partner === id ? ' sel' : ''}" data-partner="${id}">${nameOf(id)}</button>`).join('') || '<span class="muted">거래할 친구가 없어요</span>'}</div>
        <div class="lab">얼마에 거래했나요? <span class="muted" style="font-size:16px">(100원 단위)</span></div>
        <input class="field" id="price" type="number" inputmode="numeric" min="100" step="100" placeholder="예: 9000" value="${sel.price || ''}">
        <div id="pl" class="muted center" style="font-size:20px;min-height:28px"></div>
        <button class="btn big mint" id="submit" style="width:100%">거래 기록하기 ✅</button>
        <p class="muted center" style="font-size:15px">상대와 기록이 맞으면 거래 성사! 성사되면 더 못 고쳐요.</p>
        <button class="btn sm lemon" id="none">이번 회차는 거래 안 할래요</button>
        ${editing ? '<button class="btn sm sky" id="cancelEdit">← 고치기 취소</button>' : ''}
      </div>`;
    }

    body += lastResult();
  } else if (isEnd) {
    body += seesawComparisonHTML(seesawPrice);
  } else {
    body += lastResult() + `<div class="stage" style="min-height:30vh"><div class="bigEmoji bounce">🎲</div><div class="rule">다음 회차엔 카드가 새로 섞여요!<br><span class="muted">선생님이 시작할 때까지 기다려요 ⏳</span></div></div>`;
  }

  app.innerHTML = `<div class="s-wrap studentMarketScreen">${head}<div class="studentMarketBody">${body}</div></div>`;
  bindNameEditor();
  if(isEnd)bindSeeSaw();

  // 가격 입력하면 손익 미리 보기
  const showPL = () => {
    const v = Number(el('price').value);
    const box = el('pl'); if (!box) return;
    if (!v) { box.textContent = ''; return; }
    const pl = profitOf(card, v);
    box.innerHTML = pl > 0 ? `이 가격이면 <b style="color:#3BB37A">${signed(pl)} 이익</b> 😆` : pl < 0 ? `이 가격이면 <b style="color:#E0607E">${signed(pl)} 손해</b> 😱` : '이 가격이면 손익 0원';
  };
  if (el('price')) { el('price').oninput = () => { sel.price = Number(el('price').value) || 0; showPL(); }; showPL(); }
  app.querySelectorAll('[data-partner]').forEach(b => b.onclick = () => { sel.partner = b.dataset.partner; app.querySelectorAll('[data-partner]').forEach(x => x.classList.toggle('sel', x === b)); });
  app.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => submit(b.dataset.fix, Number(b.dataset.fixprice)));
  if (el('edit')) el('edit').onclick = () => { editing = true; sel.partner = ''; render(); };
  if (el('cancelEdit')) el('cancelEdit').onclick = () => { editing = false; render(); };
  if (el('submit')) el('submit').onclick = () => {
    const v = Number(el('price').value);
    if (!sel.partner) return toast('누구랑 거래했는지 골라 주세요 👆');
    if (!v || v < 100 || v % 100) return toast('가격을 100원 단위로 써 주세요 (예: 9000)');
    if (v > 100000) return toast('가격이 너무 커요! 다시 확인해 주세요');
    submit(sel.partner, v);
  };
  if (el('none')) el('none').onclick = () => submit('none', 0);
  if (el('saveRec')) el('saveRec').onclick=async()=>{
    const p=Number(el('recPrice').value),reason=(el('recReason').value||'').trim();
    if(!Number.isInteger(p)||p<100||p>100000||p%100)return toast('가격을 100원 단위로 적어 주세요.');
    if(reason.length<5)return toast('거래 결과를 근거로 한 문장 이상 적어 주세요.');
    try{await set(ref(db,`rooms/trade_${code}/recommendations/${pid}`),{price:p,reason,at:Date.now()});toast('가격 제안과 근거를 저장했어요 ✅');}
    catch(e){toast('저장에 실패했어요. 연결을 확인해 주세요.');}
  };
}

function totalProfit(st) {
  let sum = 0;
  for (let r = 1; r <= completedRounds(st); r++) {
    const card = cardsOf(r)[pid];
    const p = pairsOf(r).find(x => x.a === pid || x.b === pid);
    if (card && p) sum += profitOf(card, p.price);
  }
  return sum;
}

// 짝이 맞기 전까지는 몇 번이든 고칠 수 있고, 성사된 거래는 잠김 (장난으로 바꾸기 방지)
async function submit(partner, price) {
  const st = room.state;
  if (st.phase !== 'trading' || secLeft(st) === 0) return toast('시간이 끝나서 기록할 수 없어요');
  const base = `rooms/trade_${code}/rounds/${st.round}`;
  const fresh = (await get(ref(db, base))).val() || {};
  if (matchRound(fresh.cards, fresh.subs).some(x => x.a === pid || x.b === pid)) return toast('이미 성사된 거래라 못 고쳐요 🔒');
  if(partner !== 'none') {
    const own=(fresh.cards||{})[pid],other=(fresh.cards||{})[partner];
    if(!own||!other||own.role===other.role)return toast('거래 상대를 다시 확인해 주세요');
    if(!Number.isInteger(price)||price<=0)return toast('정확한 가격을 입력해 주세요');
  }
  await set(ref(db, `${base}/subs/${pid}`), { partner, price, at: Date.now() });
  editing = false; sel.partner = '';
  toast(partner === 'none' ? '거래 안 함으로 기록했어요' : '기록했어요 ✅');
}

/* 가상 데이터 미리보기: 서버에 방/학생/거래 기록을 생성하지 않음. */
function renderDemo(){
  const buyerLimits=[18000,16000,15000,13500,12000,10500,9000,8500,7500,6500];
  const sellerLimits=[3000,4500,5500,6500,7500,8500,9000,10500,12000,13500];
  const samplePrices=[9500,9700,8500,8800,9000,9000,9000];
  const players={},rounds={};
  for(let i=0;i<20;i++)players['demo'+i]={name:(i<10?'구매자 ':'판매자 ')+(i<10?i+1:i-9),joinedAt:Date.now()-100000};
  for(let r=1;r<=3;r++){
    const cards={},subs={};
    buyerLimits.forEach((limit,i)=>cards['demo'+i]={role:'buyer',limit});
    sellerLimits.forEach((limit,i)=>cards['demo'+(i+10)]={role:'seller',limit});
    samplePrices.forEach((p,i)=>{
      const buyer='demo'+i,seller='demo'+(i+10);
      subs[buyer]={partner:seller,price:p,at:Date.now()};
      subs[seller]={partner:buyer,price:p,at:Date.now()};
    });
    rounds[r]={cards,subs};
  }
  room={createdAt:Date.now(),players,rounds,state:{phase:'closed',round:ROUNDS,dur:180}};
  chartMode='sd';chartRound=0;showEq=true;
  renderTeacher();
  const disabled=['backStep','names','durSave','next','close','plus','minus','remainSave'];
  disabled.forEach(id=>{const x=el(id);if(x){x.disabled=true;x.title='가상 데이터 화면에서는 사용할 수 없어요';}});
  app.querySelectorAll('[data-reset],[data-kick],[data-dur]').forEach(b=>{b.disabled=true;b.title='가상 데이터 화면';});
}

/* ========== 실행 ========== */
function render() { if (isTeacher) renderTeacher(); else renderStudent(); if (el('bigT')) el('bigT').onclick = () => { Snd.ensure(); bigTimer = true; tick(); }; tick(); firstPass = false; }
if (demoMode) renderDemo(); else start();
</script>
</body>
</html>
