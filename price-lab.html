const fmt=t=>t?new Date(t).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";

const studentPath=()=> "students/"+myId;
function nav(){return '<div class="row between"><span class="pill">학습방 '+esc(code)+'</span><span class="pill">'+esc(name)+'</span></div>';}
function steps(n){return '<div class="gridSteps">'+Array.from({length:5},(_,i)=>'<span class="step '+(i===n?'on':'')+'">'+(i+1)+'단계</span>').join('')+'</div>';}
function progress(){if(!me)return 0;return me.revision&&me.revision.submittedAt?5:me.final&&me.final.submittedAt?4:me.lab&&me.lab.completedAt?3:me.baseline&&me.baseline.completedAt?(me.practice&&me.practice.completedAt?2:1):0;}
const draftFields=new Set(['baselineWhy','revLow','revHigh','revEq','revTerm','revWhy']);
let draftSaveTimer=null;
function draftTextKey(){return 'marketgo_textDraft_'+code+'_'+myId;}
function readTextDraft(){
 try{return JSON.parse(localStorage.getItem(draftTextKey())||'{}')||{};}catch{return {};}
}
function captureTextDraft(){
 if(!myId||isTeacher)return;
 const values=readTextDraft();
 for(const node of app.querySelectorAll('textarea[id]')){
  if(draftFields.has(node.id))values[node.id]=node.value;
 }
 localStorage.setItem(draftTextKey(),JSON.stringify(values));
}
function restoreTextDraft(){
 if(isTeacher||!myId)return;
 const local=readTextDraft(),remote=val(me,'drafts.writing')||{};
 for(const field of draftFields){
  const el=app.querySelector('#'+field);
  if(el)el.value=Object.prototype.hasOwnProperty.call(local,field)?local[field]:remote[field]||'';
 }
}
function render(force){
 if(!force&&document.activeElement&&["TEXTAREA","INPUT","SELECT"].includes(document.activeElement.tagName))return;
 if(!isTeacher)captureTextDraft();
 if(isTeacher)renderTeacher();else renderStudent();
 if(!isTeacher)restoreTextDraft();
}
app.addEventListener('input',e=>{
 if(!e.target||!draftFields.has(e.target.id)||!myId)return;
 captureTextDraft();
 if(draftSaveTimer)clearTimeout(draftSaveTimer);
 draftSaveTimer=setTimeout(async()=>{
  const values=readTextDraft();
  try{await update(R(studentPath()+'/drafts/writing'),values);}
  catch(err){
   const status=app.querySelector('#draftStatus');
   if(status)status.textContent='임시 저장에 실패했어요. 입력 내용은 이 기기에 보관되어 있어요.';
  }
 },1000);
});

function studentEntry(){const from=localStorage.getItem("marketgo_lesson_room")||"";app.innerHTML=card('<h1>시장 가격</h1><label class="label">학습방 코드 4자리</label><input class="field" id="joinCode" inputmode="numeric" maxlength="4" value="'+esc(code||from)+'" placeholder="선생님이 알려 준 코드"><label class="label">이름 또는 학급별명 (8자 이내)</label><input class="field" id="joinName" maxlength="8" value="'+esc(getStudentName())+'" placeholder="예: 20305"><div class="row" style="margin-top:16px">'+btn("학습방 입장하기","studentJoin","primary")+'</div>','hero');}
function quizPage(items,answers,baseline){
 const kind=baseline?'baseline':'practice';
 const next=items.findIndex(q=>!Object.prototype.hasOwnProperty.call(answers,q.id)||(baseline?false:!answers[q.id]?.done));
 if(next<0)return "";
 const idx=viewingQuiz[kind]===null?next:Math.max(0,Math.min(next,viewingQuiz[kind]));
 const q=items[idx],saved=answers[q.id],answered=Object.prototype.hasOwnProperty.call(answers,q.id)&&(baseline||saved?.done);
 const choice=answered?(baseline?saved:(saved?.choices||[])[(saved?.choices||[]).length-1]):selected;
 let body=nav()+steps(baseline?0:1)+'<div class="eyebrow">'+(baseline?'1단계':'2단계')+' · '+(idx+1)+' / '+items.length+'</div>'+
 '<div class="track"><div style="width:'+((idx+1)/items.length*100)+'%"></div></div><h2>'+esc(q.q)+'</h2>'+
 '<p class="muted">'+(answered?'이미 제출한 문제입니다. 답은 바꿀 수 없어요.':'')+'</p>';
 body+=q.opts.map((o,j)=>'<button class="opt '+(choice===j?'chosen':'')+'" '+(answered?'disabled':'')+' data-act="select" data-v="'+j+'">'+esc(o)+'</button>').join("");
 if(answered&& !baseline)body+='<div class="feedback">'+esc(q.why)+'</div>';
 body+='<div class="row" style="margin-top:18px">'+
 (idx>0?btn("이전 문제","quizBack","lav"):'')+
 (answered?btn("다음 문제","quizForward","primary"):btn("답 제출하기",baseline?"quizSubmit":"practiceSubmit","primary"))+'</div>';
 if(screenError)body+='<p class="errorText">'+esc(screenError)+'</p>';
 return card(body,"hero");
}
function baselineDraft(){return card(nav()+steps(0)+'<div class="eyebrow">1단계</div><h2>가격이 왜 바뀌어야 할까?</h2><p>고@바 모찌가 3,000원일 때 사려는 양은 20개, 팔려는 양은 10개입니다. <b>이 시장에서 가격이 어떻게 변할지</b> 이유와 함께 자유롭게 설명해 보세요.</p><textarea id="baselineWhy" maxlength="600" placeholder="내 생각을 2문장 이상 써 보세요."></textarea><div class="row" style="margin-top:15px">'+btn("다음 단계로 넘어가기","baselineDone","primary")+'</div>'+ (screenError?'<p class="errorText">'+esc(screenError)+'</p>':"")); }
function practicePage(){
 const answers=val(me,"practice.answers")||{},next=PRACT.findIndex(q=>!answers[q.id]||!answers[q.id].done);
 if(next<0){if(!val(me,"practice.completedAt")){markPracticeDone();return card("기록을 저장하는 중이에요…");}return "";}
 if(viewingQuiz.practice!==null&&viewingQuiz.practice<next)return quizPage(PRACT,answers,false);

   btn(feedback.done?"다음 문제":"다시 풀기","practiceNext","primary");

async function markPracticeDone(){try{await update(R(studentPath()+"/practice"),{completedAt:stamp()});}catch(e){alertMsg("기록 저장에 실패했어요.");}}
function chart(price){
 const W=620,H=390,L=86,R=110,T=25,B=65,xx=q=>L+(q-8)/16*(W-L-R),yy=p=>T+(16000-p)/14000*(H-T-B);
 const i=prices.indexOf(price),xd=xx(demand[i]),xs=xx(supply[i]),yp=yy(price);
 const line=k=>prices.map((p,i)=>xx(k==="d"?demand[i]:supply[i])+","+yy(p)).join(" ");
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="선택한 가격의 수요량과 공급량을 점선으로 표시한 그래프">'+
 '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="#8A7384" stroke-width="2"/>'+
 '<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="#8A7384" stroke-width="2"/>'+
 '<polyline points="'+line("d")+'" stroke="#3B8FD9" stroke-width="5" fill="none"/>'+
 '<polyline points="'+line("s")+'" stroke="#E8803E" stroke-width="5" fill="none"/>'+
 '<line x1="'+L+'" y1="'+yp+'" x2="'+Math.max(xd,xs)+'" y2="'+yp+'" stroke="#72548B" stroke-width="2" stroke-dasharray="8 6"/>'+
 '<line x1="'+xd+'" y1="'+yp+'" x2="'+xd+'" y2="'+(H-B)+'" stroke="#3B8FD9" stroke-width="2" stroke-dasharray="8 6"/>'+
 '<line x1="'+xs+'" y1="'+yp+'" x2="'+xs+'" y2="'+(H-B)+'" stroke="#E8803E" stroke-width="2" stroke-dasharray="8 6"/>'+
 '<circle cx="'+xd+'" cy="'+yp+'" r="8" fill="#3B8FD9" stroke="white" stroke-width="2"/>'+
 '<circle cx="'+xs+'" cy="'+yp+'" r="7" fill="#E8803E" stroke="white" stroke-width="2"/>'+
 '<text x="'+(L-12)+'" y="'+(yp+7)+'" text-anchor="end" font-size="19" fill="#72548B">'+comma(price)+'</text>'+
 '<text x="'+xd+'" y="'+(H-B+26)+'" text-anchor="middle" font-size="19" fill="#3B8FD9">'+demand[i]+'</text>'+
 '<text x="'+xs+'" y="'+(H-B+49)+'" text-anchor="middle" font-size="19" fill="#E8803E">'+supply[i]+'</text>'+
 '<text x="'+(W-R+8)+'" y="'+(yy(3000)+6)+'" font-size="20" fill="#3B8FD9">수요 D</text>'+
 '<text x="'+(W-R+8)+'" y="'+(yy(15000)+6)+'" font-size="20" fill="#E8803E">공급 S</text>'+
 '<text x="'+L+'" y="'+(T-8)+'" font-size="18" fill="#5B4B57">가격(원)</text>'+
 '<text x="'+(W-R)+'" y="'+(H-6)+'" font-size="18" fill="#5B4B57" text-anchor="end">수량(개)</text></svg>';
}
function tablePrice(current){return '<div class="tablewrap"><table style="min-width:460px"><thead><tr><th>가격</th><th>수요량</th><th>공급량</th><th>차이</th></tr></thead><tbody>'+prices.map((p,i)=>'<tr style="'+(current===p?"background:#ebf8f1;font-weight:800":"")+'"><td>'+comma(p)+'원</td><td>'+demand[i]+'개</td><td>'+supply[i]+'개</td><td>'+(demand[i]===supply[i]?"일치":Math.abs(demand[i]-supply[i])+"개")+'</td></tr>').join("")+'</tbody></table></div>';}

return card(nav()+steps(2)+'<div class="eyebrow">3단계 · 자료 분석</div><h2>📈 가격을 직접 바꿔 보세요</h2><p>다른 조건을 그대로 두고 <b>상품의 가격만</b> 바꿉니다. 선택한 가격에서 수요량과 공급량을 비교해 보세요.</p><div class="choiceGrid">'+prices.map(p=>'<button class="btn '+(priceChoice===p?"mint":"")+'" data-act="price" data-v="'+p+'">'+comma(p)+'원</button>').join("")+'</div><div class="cols" style="margin-top:15px"><div>'+chart(priceChoice)+'</div><div><div class="tri" style="grid-template-columns:1fr 1fr"><div class="stat"><strong>'+demand[i]+'</strong><span>수요량 (개)</span></div><div class="stat"><strong>'+supply[i]+'</strong><span>공급량 (개)</span></div></div><div class="feedback"><b>'+kind+'</b><div>'+(delta===0?"사려는 양과 팔려는 양이 같아 더 이상 가격이 움직일 이유가 없어요.":"수요량과 공급량의 차이 "+Math.abs(delta)+"개. 균형 가격을 향한 가격 "+change+".")+'</div></div></div></div>'+tablePrice(priceChoice)+'<div class="row" style="margin-top:16px">'+btn("다음 단계로 넘어가기","labFinish","primary")+'</div>','hero');
}

function blankDraftKey(){return "marketgo_blankDraft_"+code+"_"+myId;}
function loadBlankDrafts(){
 let local={};try{local=JSON.parse(localStorage.getItem(blankDraftKey())||"{}")||{};}catch{}
 const remote=val(me,"drafts.finalBlanks")||{};
 for(const k of blankOrder){
  if(Array.isArray(blankSelections[k]))continue;
  const from=Array.isArray(local[k])?local[k]:Array.isArray(remote[k])?remote[k]:[];
  blankSelections[k]=[0,1].map(i=>Number.isInteger(from[i])&&from[i]>=0&&from[i]<BLANKS[k].options[i].length?from[i]:null);
 }
}
async function saveBlankDraft(key){
 // 먼저 같은 기기에 보존하고, Firebase 저장은 따로 확인합니다.
 localStorage.setItem(blankDraftKey(),JSON.stringify(blankSelections));
 await set(R(studentPath()+"/drafts/finalBlanks/"+key),blankSelections[key]);
}

function completedPage(){const b=me.baseline||{},pr=me.practice||{},arr=Object.values(pr.answers||{}),first=arr.filter(v=>v.firstCorrect).length;return card(nav()+'<h1>시장 가격 · 학습 완료</h1><div class="tri"><div class="stat"><strong>'+BASE.filter(q=>val(b,"answers."+q.id)===q.a).length+' / '+BASE.length+'</strong><span>1단계</span></div><div class="stat"><strong>'+first+' / '+PRACT.length+'</strong><span>2단계</span></div><div class="stat"><strong>2</strong><span>5단계 완료</span></div></div><div class="cols"><div><h3>첫 생각</h3><div class="quote">'+esc(b.why||"")+'</div></div><div><h3>수정 후 생각</h3><div class="quote">'+esc(val(me,"revision.low")||"")+'</div></div></div><div class="row">'+btn("시장경제 허브로 돌아가기","hubStudent","mint")+'</div>','hero');}

/* 정형화된 피드백: 외부 생성형 AI를 호출하지 않고 개념별 누락 사항을 확인합니다. */
function explainFeedback(kind,answer){
 const text=answer.replace(/\s+/g,'');
 const has=(a)=>a.some(w=>text.includes(w));
 const missing=[];
 if(kind==='low'||kind==='high'){
  if(!has(['초과수요','초과공급','부족','남','많']))missing.push('사려는 양과 팔려는 양을 먼저 비교해 보세요');
  if(kind==='low'&&!has(['가격상승','가격이상승','가격이오','가격을올']))missing.push('왜 가격이 올라갈 압력이 생기는지 설명해 보세요');
  if(kind==='high'&&!has(['가격하락','가격이하락','가격이내','가격을낮']))missing.push('왜 가격이 내려갈 압력이 생기는지 설명해 보세요');
  if(!has(['수요량']))missing.push('수요가 아닌 수요량이 어떻게 변하는지 명확히 써 보세요');
  if(!has(['공급량']))missing.push('공급량의 변화도 연결해 보세요');
  if(!has(['균형','같아','일치']))missing.push('마지막에 두 수량이 어떻게 되는지 정리해 보세요');
 }else if(kind==='eq'){
  if(!has(['균형가격']))missing.push('균형 가격의 의미를 정의해 보세요');
  if(!has(['균형거래량']))missing.push('균형 거래량의 의미를 따로 정의해 보세요');
  if(!has(['수요량','공급량']))missing.push('수요량과 공급량이 일치하는 조건을 설명해 보세요');
  if(!has(['원','가격']))missing.push('가격과 거래량이 서로 다른 개념이라는 점을 확인해 보세요');
 }else{
  if(!has(['수요량','공급량']))missing.push('가격 변화에 따른 수요량·공급량 변화를 정확한 용어로 작성해 보세요');
  if(!has(['가격']))missing.push('이번 문제에서 변한 조건이 무엇인지 밝혀 보세요');
 }
 return missing.length?missing.join(' · '):'핵심 개념을 모두 언급했어요. 원인 → 가격 변화 → 수요량과 공급량의 변화가 논리적으로 이어지는지 다시 확인해 보세요.';
}
function validWriting(value,minimum=25){
 const s=String(value||'').trim(),hangul=(s.match(/[가-힣]/g)||[]).length;
 const words=s.split(/\s+/).filter(Boolean),uniq=new Set(words.map(w=>w.replace(/[.,!?]/g,'')));
 if(s.length<minimum||hangul<Math.max(14,Math.floor(minimum*.55)))return '자신의 생각을 문장으로 조금 더 자세히 써 주세요.';
 if(words.length<5||uniq.size<4)return '단어 나열보다 원인과 결과를 연결한 문장으로 작성해 주세요.';
 if(/(.{2,12})\1{3,}/u.test(s)||/(.)\1{6,}/u.test(s))return '같은 말이나 글자를 반복하지 말고 이유를 설명해 주세요.';
 if(!/[.?!]|때문|따라|그래서|그러|하여|해서|므로|면|되/g.test(s))return '왜 그렇게 되는지 원인과 결과를 연결해 설명해 주세요.';
 return '';
}

if(act==="baselineDone"){const why=document.getElementById("baselineWhy").value.trim();if(why.length<12)throw Error("생각을 한두 문장으로 써 보세요 (12자 이상).");await update(R(studentPath()+"/baseline"),{why,completedAt:stamp()});selected=null;me={...me,baseline:{...(me.baseline||{}),why,completedAt:stamp()}};render(true);return;}

if(selected===null)throw Error("답을 하나 선택해 주세요.");
const answers=val(me,"practice.answers")||{},q=PRACT.find(v=>!answers[v.id]||!answers[v.id].done);
if(!q)return;const prev=answers[q.id]||{},choices=[...(prev.choices||[]),selected],correct=selected===q.a,done=correct||choices.length>=2;
const a={choices,attempts:choices.length,firstCorrect:choices.length===1?correct:prev.firstCorrect===true,correct,done,at:stamp()};
feedback={id:q.id,correct,done};selected=null;await set(R(studentPath()+"/practice/answers/"+q.id),a);render(true);return;}
if(act==="practiceNext"){feedback=null;selected=null;render(true);return;}
if(act==="labGuess"){
const s=document.getElementById("labState").value,d=document.getElementById("labDirection").value;if(!s||!d)throw Error("시장 상태와 가격 변동 방향을 모두 선택해 주세요.");
const low=!!val(me,"lab.low"),k=low?"high":"low",ok=s===(low?"excessS":"excessD")&&d===(low?"down":"up");
await set(R(studentPath()+"/lab/"+k),{state:s,direction:d,correct:ok,at:stamp()});return;}
if(act==="price"){priceChoice=Number(t.dataset.v);render(true);return;}
if(act==="labFinish"){await update(R(studentPath()+"/lab"),{completedAt:stamp(),lastPrice:priceChoice});return;}
if(act==="finalSubmit"){
 if(submitBusy)return;
 const incomplete=blankOrder.some(k=>!Array.isArray(blankSelections[k])||blankSelections[k].some(v=>!Number.isInteger(v)));
 if(incomplete)throw Error("모든 빈칸을 선택해 주세요.");
 submitBusy=true;
 const submitBtn=app.querySelector('[data-act="finalSubmit"]');
 if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="저장 중…";}
 const answers=Object.fromEntries(blankOrder.map(key=>[key,buildAnswer(key)]));
 const generated=Object.fromEntries(blankOrder.map(k=>[k,explainFeedback(k,answers[k])]));
 const savedAt=stamp(),payload={...answers,feedback:generated,feedbackType:"rule-based",
  blankSelections:JSON.parse(JSON.stringify(blankSelections)),format:"fill-in-blanks",submittedAt:savedAt};
 try{
   await set(R(studentPath()+"/final"),payload);
   const confirmed=await get(R(studentPath()+"/final"));
   if(!confirmed.exists()||confirmed.val().submittedAt!==savedAt)throw Error("저장을 확인하지 못했어요. 다시 제출해 주세요.");
   me={...me,final:confirmed.val()};submitBusy=false;screenError="";render(true);
   if(aiConfigured)await requestAIFeedback();
 }catch(err){
   submitBusy=false;
   if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="다시 제출하기";}
   screenError=err.message||"저장이 완료되지 않았어요. 빈칸 선택은 보존되어 있어요.";
   const node=app.querySelector(".errorText")||document.createElement("p");
   node.className="errorText";node.textContent=screenError;
   if(!node.parentNode)app.querySelector(".panel")?.appendChild(node);
 }
 return;
}
if(act==="requestAI"){await requestAIFeedback();return;}
if(act==="revisionSubmit"){
 const low=document.getElementById("revLow").value.trim(),high=document.getElementById("revHigh").value.trim(),
 eq=document.getElementById("revEq").value.trim(),term=document.getElementById("revTerm").value.trim(),
 why=document.getElementById("revWhy").value.trim();
 [low,high,eq].forEach(v=>checkWritten(v,35));checkWritten(term,25);checkWritten(why,25);
 const submittedAt=stamp();
 const revisionPayload={low,high,eq,term,why,submittedAt};
 await set(R(studentPath()+"/revision"),revisionPayload);
 const stored=(await get(R(studentPath()+"/revision"))).val();
 if(!stored||stored.submittedAt!==submittedAt)throw Error("저장 확인에 실패했습니다. 답안은 이 기기에 남아 있어요.");
 me={...me,revision:stored};render(true);
 try{localStorage.removeItem(draftTextKey());}catch{}
 return;
}
}catch(err){console.error(err);screenError=String(err&&err.message||"저장에 실패했어요. 인터넷을 확인해 주세요.");if(document.activeElement&&["TEXTAREA","INPUT"].includes(document.activeElement.tagName)){const old=document.querySelector(".errorText");if(old)old.textContent=screenError;else{const p=document.createElement("p");p.className="errorText";p.textContent=screenError;app.querySelector(".panel")?.appendChild(p);}}else render(true);}
});
async function start(){
try{

if(isTeacher&&!code){teacherHome();return;}
if(!code){studentEntry();return;}
if(!isTeacher&&!requireStudentRoom(code))return;
const s=await get(R());if(!s.exists()){if(isTeacher){teacherHome();return;}studentEntry();screenError="학습방이 아직 열리지 않았어요.";return;}
if(isTeacher){room=s.val();hubSeen("priceLab",code);onValue(R(),snap=>{room=snap.val()||{};render();});return;}
const n=getStudentName();if(!n){studentEntry();return;}await joinStudent(code,n);
}catch(e){app.innerHTML=card('<h2>연결 확인이 필요해요</h2><p class="errorText">'+esc(e.message||e)+'</p><p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>'+btn("다시 연결","retry","primary"));}}
start();
app.addEventListener("click",e=>{if(e.target.closest('[data-act="retry"]'))location.reload();});
</script>
