ound:#fafcff;border-radius:16px}.quote{background:#f3f8fc;border-radius:13px;padding:13px;margin:8px 0;white-space:pre-wrap}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#3db49c;margin-right:6px}.gridSteps{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.step{background:#edf2f6;padding:7px 10px;border-radius:9px;color:#6b7d8b;font-size:12px;font-weight:700}.step.on{background:var(--mint);color:#1b6555}.errorText{color:#a33b2c;font-weight:700}.status{background:#e8f4fc;border-radius:12px;padding:10px 13px;font-size:14px}.hidden{display:none}.footer{font-size:12px;color:#8a99a6;text-align:center;margin-top:28px}

{id:"a2",q:"가격이 하락하면 수요량은?",opts:["증가","감소"],a:0,why:"가격이 내려가면 같은 상품을 사려는 수량(수요량)은 증가해요.",tag:"수요 법칙"},

{id:"a5",q:"수요량이 공급량보다 더 많으면?",opts:["초과 수요","초과 공급"],a:0,why:"사려는 양이 팔려는 양보다 많아 상품이 부족한 상태, 초과 수요예요.",tag:"초과 수요"},
{id:"a6",q:"공급량이 수요량보다 더 많으면?",opts:["초과 수요","초과 공급"],a:1,why:"팔려는 양이 사려는 양보다 많아 상품이 남는 상태, 초과 공급이에요.",tag:"초과 공급"},

{id:"a9",q:"'가격이 올라서 수요가 감소했다'를 이번 시간에 더 정확히 표현하면?",opts:["수요량이 감소했다","수요 곡선이 이동했다"],a:0,why:"상품 자체의 가격 변화만 생각할 때는 수요·공급이 아니라 수요량·공급량 변화로 말해요.",tag:"개념 구분"},
{id:"a10",q:"가격이 변해도 그대로라고 가정한 조건은?",opts:["소득·취향·생산비 등 다른 조건","상품 자체의 가격"],a:0,why:"이번 시간에는 다른 조건이 같다고 가정하고 가격만 변하게 했어요.",tag:"개념 구분"}];
let code=P.get("room")||"",room=null,me=null,myId="",name="",state={},selected=null,feedback=null,priceChoice=3000,screenError="",lastLog="";
const R=p=>ref(db,"rooms/priceLab_"+code+(p?"/"+p:""));
const val=(obj,path)=>path.split(".").reduce((a,k)=>a&&a[k],obj);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?new Date(t).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const comma=n=>Number(n).toLocaleString("ko-KR");

const idFor=s=>Array.from(new TextEncoder().encode(s.trim().normalize("NFC"))).map(b=>b.toString(16).padStart(2,"0")).join("");
const csv=v=>{let s=String(v==null?"":v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};

function nav(){return '<div class="row between"><span class="pill">학습방 '+esc(code)+'</span><span class="pill">'+esc(name)+'</span></div>';}

function render(force){if(!force&&document.activeElement&&["TEXTAREA","INPUT","SELECT"].includes(document.activeElement.tagName))return; if(isTeacher)renderTeacher();else renderStudent();}
function teacherHome(){const old=localStorage.getItem("marketgo_lesson_room")||"";app.innerHTML=card('<div class="eyebrow">MarketGo · 탐구·평가 통합</div><h1>🔎 가격 탐정 성장 실험실</h1><p>시장 개념 → 가격에 따른 수요량·공급량 → 초과 수요·초과 공급 → 균형 가격 → 서술 수정. 학생의 처음 생각과 수정한 생각을 같은 방에 저장합니다.</p><div class="note">기존 시장경제 허브의 4자리 방 코드를 그대로 사용해요. 학생은 기존 허브 QR로 입장합니다.</div><label class="label" for="teacherRoom">이어 사용할 4자리 방 코드</label><input class="field" id="teacherRoom" inputmode="numeric" maxlength="4" value="'+esc(old)+'" placeholder="예: 2588"><div class="row" style="margin-top:14px">'+btn("이 방 열기 / 이어 하기","teacherOpen","primary")+btn("새 코드 만들기","teacherNew","mint")+'</div><p class="small">교사용 주소는 별도 인증이 적용되지 않았습니다. 학생 이름 대신 별명을 사용하고 공개 공유를 피하세요.</p>','hero');}
function studentEntry(){const from=localStorage.getItem("marketgo_lesson_room")||"";app.innerHTML=card('<div class="eyebrow">MarketGo 학습 활동</div><h1>🕵️ 시장 가격의 비밀을 찾아라!</h1><p>정답보다 중요한 건 <b>왜 가격이 바뀌는지</b> 설명하는 힘이에요.</p><label class="label">학습방 코드 4자리</label><input class="field" id="joinCode" inputmode="numeric" maxlength="4" value="'+esc(code||from)+'" placeholder="선생님이 알려 준 코드"><label class="label">이름 또는 학급별명 (8자 이내)</label><input class="field" id="joinName" maxlength="8" value="'+esc(getStudentName())+'" placeholder="예: 20305"><div class="row" style="margin-top:16px">'+btn("학습방 입장하기","studentJoin","primary")+'</div>','hero');}
function quizPage(items,answers,baseline){
const i=items.findIndex(q=>!Object.prototype.hasOwnProperty.call(answers,q.id)||(baseline?false:!answers[q.id]?.done));
if(i===-1)return "";
const q=items[i];const heading=baseline?"첫 생각을 진단해요":"가격 변동을 훈련해요";
let body=nav()+steps(baseline?0:1)+'<div class="eyebrow">'+heading+' · '+(i+1)+' / '+items.length+'</div><div class="track"><div style="width:'+(i/items.length*100)+'%"></div></div><h2>'+esc(q.q)+'</h2><p class="muted">'+(baseline?"힌트 없는 사전 진단입니다. 지금 생각대로 답하세요.":"다른 조건은 같고, 상품 자체의 가격만 변한다고 생각해요.")+'</p>';
body+=q.opts.map((o,j)=>'<button class="opt '+(selected===j?"chosen":"")+'" data-act="select" data-v="'+j+'">'+esc(o)+'</button>').join("");
body+='<div class="row" style="margin-top:18px">'+btn("답 제출하기","quizSubmit","primary")+'</div>';
if(screenError)body+='<p class="errorText">'+esc(screenError)+'</p>';
return card(body,"hero");
}
function baselineDraft(){return card(nav()+steps(0)+'<div class="eyebrow">사전 진단 · 내 생각 기록</div><h2>가격이 왜 바뀌어야 할까?</h2><p>과일모찌가 2,000원일 때 사려는 양은 22개, 팔려는 양은 6개입니다. <b>이 시장에서 가격이 어떻게 변할지</b> 이유와 함께 자유롭게 설명해 보세요.</p><div class="note">정답 힌트 없이 처음 생각을 남기는 단계예요. 나중에 수정한 설명과 비교합니다.</div><textarea id="baselineWhy" maxlength="600" placeholder="내 생각을 2문장 이상 써 보세요."></textarea><div class="row" style="margin-top:15px">'+btn("첫 생각 저장하고 훈련 시작","baselineDone","primary")+'</div>'+ (screenError?'<p class="errorText">'+esc(screenError)+'</p>':"")); }
function practicePage(){
const answers=val(me,"practice.answers")||{};
const ix=PRACT.findIndex(q=>!answers[q.id]||!answers[q.id].done);
if(ix<0){if(!val(me,"practice.completedAt")){markPracticeDone();return card("훈련 결과를 저장하고 있어요…");}return "";}
const q=PRACT[ix],prev=answers[q.id]||{},attempts=Number(prev.attempts||0);
let body=nav()+steps(1)+'<div class="eyebrow">가격의 변화가 원인이에요 · '+(ix+1)+' / '+PRACT.length+'</div><div class="track"><div style="width:'+(ix/PRACT.length*100)+'%"></div></div><h2>'+esc(q.q)+'</h2><p class="small">정답을 맞히거나 2번 시도하면 다음 문제로 넘어가요. 첫 응답과 수정 여부가 기록됩니다.</p>';
if(feedback&&feedback.id===q.id){
body+='<div class="feedback '+(feedback.correct?"":"error")+'"><b>'+(feedback.correct?"✅ 정답이에요!":"🔁 다시 생각해 봐요.")+'</b><div>'+esc(q.why)+'</div></div>'+btn(feedback.done?"다음 문제 →":"한 번 더 풀어 보기 →","practiceNext","primary");
}else{
body+=q.opts.map((o,j)=>'<button class="opt '+(selected===j?"chosen":"")+'" data-act="select" data-v="'+j+'">'+esc(o)+'</button>').join("")+btn(attempts?"두 번째 답 제출":"답 확인하기","practiceSubmit","primary");
}
if(screenError)body+='<p class="errorText">'+esc(screenError)+'</p>';
return card(body,"hero");
}

const blob=new Blob(["\ufeff"+[header,...body].map(r=>r.map(csv).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=klass+"_가격탐정_학습성장_"+code+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
const logRows=body.map(r=>[r[2],r[5],r[7],r[11],r[12],r[15],r[16],r[18],r[19]]);
const sig=JSON.stringify(logRows);if(sig!==lastLog){lastLog=sig;hubLog("priceLab",code,["이름","사전점수","훈련첫정답","독립초과수요","독립초과공급","수정초과수요","수정초과공급","수정시각","교사평가"],logRows,"사전→독립→수정 성장 기록");}
}
async function openTeacher(c){code=c;localStorage.setItem("marketgo_lesson_room",c);const s=await get(R());if(!s.exists())await set(R(),{createdAt:stamp(),state:{phase:"open"},students:{}});location.href="price-lab.html?t=1&room="+encodeURIComponent(c);}
async function joinStudent(c,n){
code=c;const s=await get(R());if(!s.exists())throw Error("선생님이 아직 이 학습방을 열지 않았어요.");
if(val(s.val(),"state.phase")==="closed")throw Error("마감된 학습방이에요.");
name=saveStudentName(n);myId=idFor(name);localStorage.setItem("marketgo_lesson_room",code);
const existing=await get(R(studentPath()));if(!existing.exists())await set(R(studentPath()),{name,joinedAt:stamp(),baseline:{answers:{}},practice:{answers:{}},lab:{}});
const u=new URL(location.href);u.searchParams.set("room",code);history.replaceState(null,"",u);
hubFollow("priceLab",code);
onValue(R("state"),s=>{state=s.val()||{};render();},e=>alertMsg("연결이 끊겼어요. 인터넷을 확인해 주세요."));
onValue(R(studentPath()),s=>{me=s.val();if(!me){alertMsg("진도 기록을 찾을 수 없어요. 선생님께 알려 주세요.");return;}render();},e=>alertMsg("학생 기록을 읽지 못했어요."));
}
let detailId="";
app.addEventListener("click",async e=>{
const t=e.target.closest("[data-act]");if(!t)return;const act=t.dataset.act;screenError="";
try{
if(act==="teacherOpen"){const c=(document.getElementById("teacherRoom").value||"").trim();if(!/^\d{4}$/.test(c))throw Error("4자리 방 코드를 입력해 주세요.");await openTeacher(c);return;}
if(act==="teacherNew"){for(let i=0;i<30;i++){let c=String(Math.floor(1000+Math.random()*9000));code=c;if(!(await get(R())).exists()){await openTeacher(c);return;}}throw Error("새 코드 생성에 실패했어요.");}
if(act==="studentJoin"){const c=(document.getElementById("joinCode").value||"").trim(),n=(document.getElementById("joinName").value||"").trim();if(!/^\d{4}$/.test(c)||!n||n.length>8)throw Error("방 코드 4자리와 이름/별명(8자 이내)을 확인하세요.");await joinStudent(c,n);return;}
if(act==="teacherToggle"){await update(R("state"),{phase:val(room,"state.phase")==="closed"?"open":"closed",changedAt:stamp()});return;}
if(act==="teacherSwitch"){code="";localStorage.removeItem("marketgo_lesson_room");location.href="price-lab.html?t=1";return;}
if(act==="download"){downloadCSV();return;}
if(act==="teacherDetail"){detailId=t.dataset.id;document.getElementById("detail").innerHTML=detailHTML(detailId);document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});return;}
if(act==="detailClose"){detailId="";document.getElementById("detail").innerHTML="";return;}
if(act==="deleteStudent"){if(!detailId||!confirm("해당 학생의 기록을 삭제할까요? 되돌릴 수 없습니다."))return;await remove(R("students/"+detailId));detailId="";return;}
if(act==="reviewSave"){if(!detailId)return;const z=document.getElementById("reviewScore").value,nt=document.getElementById("reviewNote").value;await set(R("students/"+detailId+"/review"),{score:z===""?null:Number(z),note:nt,at:stamp()});detailId="";return;}
if(act==="hubStudent"){location.href="hub.html";return;}
if(act==="select"){selected=Number(t.dataset.v);render(true);return;}
if(act==="quizSubmit"){
if(selected===null)throw Error("답을 하나 선택해 주세요.");const answers=val(me,"baseline.answers")||{},q=BASE.find(v=>!(v.id in answers));
if(!q)return;await set(R(studentPath()+"/baseline/answers/"+q.id),selected);selected=null;render(true);return;}
if(act==="baselineDone"){const why=document.getElementById("baselineWhy").value.trim();if(why.length<12)throw Error("생각을 한두 문장으로 써 보세요 (12자 이상).");await update(R(studentPath()+"/baseline"),{why,completedAt:stamp()});selected=null;render(true);return;}
if(act==="practiceSubmit"){
if(selected===null)throw Error("답을 하나 선택해 주세요.");
const answers=val(me,"practice.answers")||{},q=PRACT.find(v=>!answers[v.id]||!answers[v.id].done);
if(!q)return;const prev=answers[q.id]||{},choices=[...(prev.choices||[]),selected],correct=selected===q.a,done=correct||choices.length>=2;
const a={choices,attempts:choices.length,firstCorrect:choices.length===1?correct:prev.firstCorrect===true,correct,done,at:stamp()};
feedback={id:q.id,correct,done};selected=null;await set(R(studentPath()+"/practice/answers/"+q.id),a);render(true);return;}
if(act==="practiceNext"){feedback=null;selected=null;render(true);return;}
if(act==="labGuess"){
const s=document.getElementById("labState").value,d=document.getElementById("labDirection").value;if(!s||!d)throw Error("시장 상태와 가격 변동 방향을 모두 선택해 주세요.");
const low=!!val(me,"lab.low"),k=low?"high":"low",ok=s===(low?"excessS":"excessD")&&d===(low?"down":"up");
await set(R(studentPath()+"/lab/"+k),{state:s,direction:d,correct:ok,at:stamp()});return;}
if(act==="price"){priceChoice=Number(t.dataset.v);render(true);return;}
if(act==="labFinish"){await update(R(studentPath()+"/lab"),{completedAt:stamp(),lastPrice:priceChoice});return;}
if(act==="finalSubmit"){
const low=document.getElementById("finalLow").value.trim(),high=document.getElementById("finalHigh").value.trim(),term=document.getElementById("finalTerm").value.trim();
if(low.length<25||high.length<25||term.length<8)throw Error("초과 수요·초과 공급은 각각 25자, 용어 설명은 8자 이상 써 주세요.");
await set(R(studentPath()+"/final"),{low,high,term,submittedAt:stamp()});return;}
if(act==="revisionSubmit"){
const low=document.getElementById("revLow").value.trim(),high=document.getElementById("revHigh").value.trim(),why=document.getElementById("revWhy").value.trim();
if(low.length<25||high.length<25||why.length<12)throw Error("수정 설명(각 25자)과 고친 이유(12자)를 작성해 주세요.");
await set(R(studentPath()+"/revision"),{low,high,why,submittedAt:stamp()});return;}
}catch(err){console.error(err);screenError=String(err&&err.message||"저장에 실패했어요. 인터넷을 확인해 주세요.");if(document.activeElement&&["TEXTAREA","INPUT"].includes(document.activeElement.tagName)){const old=document.querySelector(".errorText");if(old)old.textContent=screenError;else{const p=document.createElement("p");p.className="errorText";p.textContent=screenError;app.querySelector(".panel")?.appendChild(p);}}else render(true);}
});
async function start(){
try{
await get(ref(db,".info/connected")).then(s=>{if(s.val()===false)throw Error("서버에 연결할 수 없어요. 인터넷을 확인해 주세요.");});
if(isTeacher&&!code){teacherHome();return;}
if(!code){studentEntry();return;}
const s=await get(R());if(!s.exists()){if(isTeacher){teacherHome();return;}studentEntry();screenError="학습방이 아직 열리지 않았어요.";return;}
if(isTeacher){room=s.val();hubSeen("priceLab",code);onValue(R(),snap=>{room=snap.val()||{};render();});return;}
const n=getStudentName();if(!n){studentEntry();return;}await joinStudent(code,n);
}catch(e){app.innerHTML=card('<h2>연결 확인이 필요해요</h2><p class="errorText">'+esc(e.message||e)+'</p><p>실시간 저장이 안 되면 활동을 시작하지 않아요. 페이지를 새로고침해 주세요.</p>'+btn("다시 연결","retry","primary"));}}
start();
app.addEventListener("click",e=>{if(e.target.closest('[data-act="retry"]'))location.reload();});
</script>
